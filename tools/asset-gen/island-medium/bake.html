<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"/assets/vendor/three/build/three.module.js","three/addons/":"/assets/vendor/three/examples/jsm/"}}</script><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const plan=await fetch('/__medium_canopy_v1/plan.json').then(r=>{if(!r.ok)throw Error('Missing frozen plan');return r.json();});
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;renderer.setPixelRatio(1);renderer.setSize(128,128);renderer.setClearColor(0,0);renderer.autoClear=false;
const loader=new GLTFLoader(),asset=await loader.loadAsync('/assets/models/world/realism/'+(plan.source.id||'island_tree_01')+'.glb');let sourceMaterial=null;asset.scene.traverse(o=>{if(o.isMesh&&o.material.name===(plan.source.leafMaterial||'island_tree_01_leaves')){if(sourceMaterial)throw Error('Ambiguous source leaf material');sourceMaterial=o.material;}});if(!sourceMaterial)throw Error('Original material missing');
for(const key of ['map','normalMap'])if(sourceMaterial[key])sourceMaterial[key].anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const scene=new T.Scene(),camera=new T.OrthographicCamera(-1,1,1,-1,.001,100);const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');
const bases=plan.viewBases;const V=a=>new T.Vector3().fromArray(a);
function normalMaterial(base){const old=sourceMaterial,mat=new T.MeshNormalMaterial({side:T.DoubleSide,normalMap:old.normalMap,normalMapType:old.normalMapType,normalScale:old.normalScale.clone().multiplyScalar(.55),bumpMap:old.bumpMap,bumpScale:old.bumpScale});old.map?.updateMatrix();mat.onBeforeCompile=sh=>{
 Object.assign(sh.uniforms,{bakeAlbedo:{value:old.map},bakeHasMap:{value:!!old.map},bakeCutoff:{value:.22},bakeAlbedoTransform:{value:old.map?.matrix.clone()||new T.Matrix3()},clusterU:{value:V(base.U)},clusterB:{value:V(base.V).negate()},clusterN:{value:V(base.N)}});
 sh.vertexShader='varying vec2 vBakeAlbedoUv;uniform mat3 bakeAlbedoTransform;\n'+sh.vertexShader;sh.vertexShader=sh.vertexShader.replace('#include <uv_vertex>','#include <uv_vertex>\n vBakeAlbedoUv=(bakeAlbedoTransform*vec3(uv,1.0)).xy;');
 sh.fragmentShader='varying vec2 vBakeAlbedoUv;uniform sampler2D bakeAlbedo;uniform bool bakeHasMap;uniform float bakeCutoff;uniform vec3 clusterU;uniform vec3 clusterB;uniform vec3 clusterN;\n'+sh.fragmentShader;
 sh.fragmentShader=sh.fragmentShader.replace('#include <normal_fragment_begin>','float bakeAlpha=bakeHasMap?texture2D(bakeAlbedo,vBakeAlbedoUv).a:1.0; if(bakeAlpha<bakeCutoff)discard;\n#include <normal_fragment_begin>');
 sh.fragmentShader=sh.fragmentShader.replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\nvec3 clusterWorldNormal=normalize(normal*mat3(viewMatrix)); vec3 clusterTangentNormal=normalize(vec3(dot(clusterWorldNormal,clusterU),dot(clusterWorldNormal,clusterB),dot(clusterWorldNormal,clusterN)));');
 const anchor='gl_FragColor = vec4( packNormalToRGB( normal ), opacity );';if(!sh.fragmentShader.includes(anchor))throw Error('Normal output anchor missing');sh.fragmentShader=sh.fragmentShader.replace(anchor,'gl_FragColor=vec4(clusterTangentNormal*.5+.5,1.0);');
 };mat.customProgramCacheKey=()=> 'medium-leaf-tangent-bake-1';return mat;}
function geometry(rep){const a=rep.geometry,g=new T.BufferGeometry();for(const [key,size,name]of[['POSITION',3,'position'],['NORMAL',3,'normal'],['TEXCOORD_0',2,'uv']]){if(!a[key])throw Error('Missing rep '+key);g.setAttribute(name,new T.Float32BufferAttribute(a[key],size));}g.setIndex(a.indices||a.index);g.computeBoundingBox();g.computeBoundingSphere();return g;}
function fitCamera(rep,base){const center=V(rep.center),min=rep.bounds.min,max=rep.bounds.max;let loU=Infinity,hiU=-Infinity,loV=Infinity,hiV=-Infinity,span=0;for(let a=0;a<3;a++)span=Math.max(span,max[a]-min[a]);for(let i=0;i<8;i++){const p=[0,1,2].map(a=>(i&(1<<a)?max[a]:min[a])-rep.center[a]),u=p.reduce((s,v,a)=>s+v*base.U[a],0),v=p.reduce((s,v,a)=>s+v*base.V[a],0);loU=Math.min(loU,u);hiU=Math.max(hiU,u);loV=Math.min(loV,v);hiV=Math.max(hiV,v);}const pad=1.01;camera.left=loU*pad;camera.right=hiU*pad;camera.bottom=loV*pad;camera.top=hiV*pad;camera.near=.001;camera.far=span*8+4;camera.position.copy(center).addScaledVector(V(base.N),span*3+1);camera.up.copy(V(base.V));camera.lookAt(center);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);return{left:camera.left,right:camera.right,bottom:camera.bottom,top:camera.top,pad};}
window.bakeMediumClusters=()=>{
 const atlas=plan.atlas,outputs={},channels=[],rows=[];if(atlas.tileSize!==128&&atlas.tile!==128)throw Error('Frozen128px tile required');
 for(const channel of ['albedo','normal']){
  const canvas=document.createElement('canvas');canvas.width=atlas.width;canvas.height=atlas.height;const ctx=canvas.getContext('2d');
  for(const rep of plan.representatives){const geo=geometry(rep);for(let bi=0;bi<bases.length;bi++){const base=bases[bi],mat=channel==='normal'?normalMaterial(base):new T.MeshBasicMaterial({map:sourceMaterial.map,color:sourceMaterial.color.clone(),alphaTest:.22,side:T.DoubleSide}),mesh=new T.Mesh(geo,mat);scene.add(mesh);const frame=fitCamera(rep,base);renderer.setScissorTest(false);renderer.setViewport(0,0,128,128);renderer.clear(true,true,true);renderer.setViewport(4,4,120,120);renderer.setScissor(4,4,120,120);renderer.setScissorTest(true);renderer.render(scene,camera);gl.finish();const id=rep.views[bi].tileID,x=(id%8)*128,y=Math.floor(id/8)*128;ctx.drawImage(renderer.domElement,x,y);const pixels=new Uint8Array(128*128*4);gl.readPixels(0,0,128,128,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let occupied=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i]>55)occupied++;const programs=renderer.info.programs.map(p=>({linked:gl.getProgramParameter(p.program,gl.LINK_STATUS),vertex:gl.getShaderParameter(p.vertexShader,gl.COMPILE_STATUS),fragment:gl.getShaderParameter(p.fragmentShader,gl.COMPILE_STATUS)}));const error=gl.getError();if(error||!occupied||!programs.length||programs.some(p=>!p.linked||!p.vertex||!p.fragment))throw Error('Invalid native cluster tile '+rep.id+':'+bi+':'+error+':'+occupied);rows.push({channel,representative:rep.id,basis:bi,tileID:id,occupied,frame,gl:error,programs});scene.remove(mesh);mat.dispose();}geo.dispose();}
  outputs[channel]=canvas.toDataURL('image/png');channels.push({channel,tiles:rows.filter(r=>r.channel===channel).length});
 }
 renderer.setScissorTest(false);return{outputs,channels,rows,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null,gl:gl.getError(),sourceMaterial:{name:sourceMaterial.name,color:sourceMaterial.color.toArray(),normalScale:sourceMaterial.normalScale.toArray()},pipeline:{albedo:'Original source map+material RGB only. No summer tint/pigment, canopy shade, lighting or normal multiplication.',normals:'Source face-visible normalMap at source scale*.55, encoded tangent(U,-V,N), before live canopy-up blend.',padding:'1% ortho frame padding;4px transparent gutters. Fixed planes retain source cell bounding envelopes.'}};
};window.__bakeReady=true;
</script>
