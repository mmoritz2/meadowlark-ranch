 control('Build hair gallery',async()=>{
  document.getElementById('hair-gallery')?.remove();
  const gallery=document.createElement('div');gallery.id='hair-gallery';gallery.style='position:fixed;inset:0;background:#e8edf0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;z-index:10';
  const close=document.createElement('button');close.textContent='Close gallery';close.style='position:fixed;right:20px;top:12px;z-index:11;padding:10px';close.onclick=()=>{gallery.remove();close.remove();};document.body.append(gallery,close);

 control('Run integration checks',async()=>{
  const assert=(v,s)=>{if(!v)throw Error(s);},checks=[],v=new THREE.Vector3();
  assert(body==='m'||rig.rain109,'New character missing');
  assert(RIDER_HAIR.filter(h=>h.body.includes('f')).length>=3,'Female style catalog missing');
  assert(RIDER_HAIR.some(h=>h.id===riderHairId('braid','f')),'Saved style migration missing');
  const canonical=rig.body.skeleton.bones.map(b=>b.name);
  if(rig.rain109){
   let sourceBones;kit.rain109.scene.traverse(m=>{if(m.isSkinnedMesh&&!sourceBones)sourceBones=m.skeleton.bones.map(b=>b.name);});
   assert(JSON.stringify(sourceBones)===JSON.stringify(canonical),'Canonical bone order differs');
   for(const m of rig.rain109.imported){const a=m.geometry.attributes;assert(m.skeleton===rig.body.skeleton,'Imported body skeleton detached');for(let i=0;i<a.position.count;i++){let sum=0;for(let c=0;c<4;c++){const w=a.skinWeight.array[i*4+c],joint=a.skinIndex.array[i*4+c];assert(Number.isFinite(w)&&w>=0&&joint<canonical.length,'Invalid joint weight');sum+=w;}assert(Math.abs(sum-1)<1e-5,'Unnormalized skin');} }
  }
  checks.push('source, canonical bind and all vertex weights');
  if(rig.caninoHair101){for(const h of RIDER_HAIR.filter(h=>h.body.includes('f')))for(const helmet of ['none','#2e2e38']){rig.setLook({...fit,hairStyle:h.id,helmet});render();const e=rig.caninoHair101.evidence();assert(e.style===h.id,'Wrong hair '+h.id);assert(e.sourceMaterialPreserved&&e.liveOwnedGeometries<=1,'Hair ownership');assert((e.maxCrownDisplacementM||0)<1e-9,'Detached crown');assert(e.headSurfaceMisses===0,'Hair head fit missed');}rig.setLook(fit);checks.push('9 actual hairstyles with and without helmet; attached crown and owned cleanup');}
  const before={...fit};
  for(const outfit of lib.outfits){output.textContent='Checking '+outfit.label+'…';await new Promise(requestAnimationFrame);fit.outfit=outfit.id;rig.setLook(fit);assert(rig.outfitId===outfit.id&&rig.outfit?.meshes.length,'Outfit failed '+outfit.id);if(rig.rain109){assert(!rig.body.visible&&!rig.face.visible&&!rig.eyes.visible,'Old body reappeared');} }
  checks.push(lib.outfits.length+' real outfit changes');Object.assign(fit,before);rig.setLook(fit);

  checks.push('15 standing, walking, running and seated poses');pose('idle');Object.assign(fit,before);rig.setLook(fit);
  for(const slot of ['eyewear','earrings','neckwear'])for(const id of slot==='eyewear'?['round','sport','none']:slot==='earrings'?['hoops','studs','none']:['pendant','pearls','none']){rig.setLook({...fit,[slot]:id});}
  checks.push('glasses, earrings and neckwear changes');rig.setLook(fit);
  const errors=renderer.getContext().getError();assert(errors===0,'WebGL error '+errors);
  output.textContent='PASS\n'+checks.join('\n')+'\nVisible authored parts: '+(rig.rain109?.imported.filter(m=>m.visible).length||0)+'\n'+JSON.stringify(rig.canino100?.accessoryEvidence||{});
 });
 const neckPicker=new THREE.Raycaster();renderer.domElement.addEventListener('pointerdown',event=>{const bounds=renderer.domElement.getBoundingClientRect(),hits=[];for(const[dx,dy]of[[0,0],[-3,0],[3,0],[0,-3],[0,3]]){neckPicker.setFromCamera(new THREE.Vector2((event.clientX+dx-bounds.left)/bounds.width*2-1,-(event.clientY+dy-bounds.top)/bounds.height*2+1),cam);const hit=neckPicker.intersectObjects((rig.rain109?.imported||[]).filter(m=>m.visible),false)[0];if(hit)hits.push({offset:[dx,dy],mesh:hit.object.name,face:hit.faceIndex,vertices:[hit.face.a,hit.face.b,hit.face.c],point:hit.point.toArray().map(n=>+n.toFixed(6))});}output.textContent='Picked neck surface\n'+JSON.stringify(hits,null,1);});
