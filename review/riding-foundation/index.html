<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riding foundation · ordinary play review</title><style>body{margin:0;font:14px system-ui;background:#eef1e7;color:#263d32}header{padding:12px;position:sticky;top:0;background:#eef1e7;z-index:4}h1{font-size:18px;margin:0 0 6px}button{min-height:40px;padding:8px 12px;border:1px solid #7c927f;border-radius:7px;background:white;margin:3px}iframe{width:100%;height:calc(100vh - 190px);min-height:420px;border:0}pre{white-space:pre-wrap;font:11px monospace;max-height:280px;overflow:auto;padding:12px;background:white}#status{margin:5px}</style><header><h1>Horse and ranch riding review</h1><p id="status">Normal game, fresh local review origin. No save seeds or position/progress controls.</p><button id="boot">Start normal game quietly</button><button id="stop">Release all keys</button><button data-key="KeyW" data-ms="500">Forward · 0.5 s</button><button data-key="KeyW" data-ms="2000">Forward · 2 s</button><button data-key="KeyA" data-ms="120">Left rein · 0.12 s</button><button data-key="KeyD" data-ms="120">Right rein · 0.12 s</button><button data-key="KeyA" data-ms="500">Left rein · 0.5 s</button><button data-key="KeyD" data-ms="500">Right rein · 0.5 s</button><button data-key="KeyA" data-ms="2000">Left rein · 2 s</button><button data-key="KeyD" data-ms="2000">Right rein · 2 s</button><button data-key="KeyS" data-ms="1000">Brake · 1 s</button><button data-key="Space" data-ms="120">Jump</button><button data-gait="walk">Walk</button><button data-gait="trot">Trot</button><button data-gait="canter">Canter</button><button data-gait="gallop">Gallop</button><button id="figure">Hold forward + left · 2 s</button></header><iframe id="game" title="Normal production game"></iframe><pre id="report">Not booted</pre><script type="module">
const frame=document.getElementById('game'),report=document.getElementById('report'),status=document.getElementById('status');let w,G,timer=null,held=[],trace=[],soundMuted=false;
function release(){clearTimeout(timer);timer=null;if(w)for(const code of held)w.document.dispatchEvent(new w.KeyboardEvent('keyup',{code,bubbles:true}));held=[];G?.riding?.releaseAll?.();}
function blocked(){return !G||G.input?.blocked?.()||document.hidden||G.cam?.isFree?.();}
function hold(codes,ms){if(blocked()){status.textContent='Close the normal game dialog/menu before riding.';return;}release();w.document.activeElement?.blur?.();held=codes;for(const code of codes)w.document.dispatchEvent(new w.KeyboardEvent('keydown',{code,bubbles:true,cancelable:true}));timer=setTimeout(release,ms);status.textContent='Ordinary input '+codes.join('+')+' for '+ms+'ms. No direct actor or progress mutation.';}
document.getElementById('boot').onclick=()=>{release();frame.src='/ranch3d.html?diagnostics=qa&review=riding-foundation&v=quality-579-road-1';status.textContent='Loading normal game. Finish Character and dialogue normally.';document.getElementById('boot').disabled=true;};
frame.onload=()=>{w=frame.contentWindow;const deadline=performance.now()+180000;const wait=setInterval(()=>{G=w.__features;if(G?.audio&&!soundMuted){G.audio.setMuted(true);soundMuted=true;}if(G?.horse?.RIG?.()?.ready&&!w.document.getElementById('load')){clearInterval(wait);status.textContent='Normal game ready; sound muted for this local review.';}else if(performance.now()>deadline){clearInterval(wait);status.textContent='Normal game still loading; inspect the visible game.';}},250);};
document.getElementById('stop').onclick=release;
for(const b of document.querySelectorAll('[data-key]'))b.onclick=()=>hold([b.dataset.key],Number(b.dataset.ms));
for(const b of document.querySelectorAll('[data-gait]'))b.onclick=()=>{if(!blocked()){release();G.riding.selectGait(b.dataset.gait);status.textContent='Selected '+b.dataset.gait+' through production riding control.';}};
document.getElementById('figure').onclick=()=>hold(['KeyW','KeyA'],2000);
window.addEventListener('blur',release);window.addEventListener('beforeunload',release);
setInterval(()=>{if(!G)return;try{const state=JSON.parse(w.render_game_to_text()),p=G.horse.player;const row={at:Date.now(),position:{x:p.pos.x,z:p.pos.z,heading:p.heading,speed:p.speed},riding:state.riding,steering:state.mountedSteering,steppingTurn:state.horseSteppingTurn,camera:state.followCam,horseMotion:{gait:G.horse.RIG()?.heroMotion?.state?.gait,phase:G.horse.RIG()?.phase},errors:G.errors};trace.push(row);if(trace.length>120)trace.shift();report.textContent=JSON.stringify({current:row,recent:trace.slice(-8)},null,2);}catch(e){report.textContent=String(e);}},500);
</script></html>
