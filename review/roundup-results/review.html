<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roundup riding and reward review</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e9eee5;color:#284c39}header{padding:12px 18px;background:white}h1{font-size:19px;margin:0 0 6px}p{margin:6px 0}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{font:600 13px system-ui;min-height:44px;padding:10px 14px;border:1px solid #6d8978;border-radius:8px;background:#28583f;color:white;cursor:pointer}button:disabled{opacity:.4}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;padding:12px}.viewport{overflow:auto;max-height:calc(100vh - 180px)}iframe{display:block;border:0;width:960px;height:600px}pre{padding:12px;margin:0;background:#fff;white-space:pre-wrap;font:12px/1.4 monospace;max-height:calc(100vh - 180px);overflow:auto}</style><header><h1>Roundup riding and reward review</h1><p>Disposable local save. The rider uses ordinary keyboard controls; horse positions and pen counts are never patched.</p><p id="status">Ready</p><div class="controls"><button id="boot">Load isolated ranch</button><button id="ride" disabled>Ride the roundup</button><button id="pending" disabled>Verify pending save</button><button id="allow" disabled>Allow saving</button><button id="verify" disabled>Verify saved result</button><button id="phone">390 × 844</button><button id="landscape">667 × 375</button><button id="desktop">960 × 600</button></div></header><main><div class="viewport"><iframe id="game" title="Local roundup playtest" sandbox="allow-scripts allow-same-origin"></iframe></div><pre id="report">No save created.</pre></main><script src="./review.js"></script></html>
