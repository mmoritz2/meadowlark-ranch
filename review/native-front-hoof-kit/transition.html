<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createNativeHorseMotion} from '../../assets/native-horse-motion.js';
import {NATIVE_BREED_PROFILES} from '../../assets/native-breed-profiles.js';
const config=await(await fetch('./config.json')).json();
const v=new THREE.Vector3();
async function load(key,url,enabled){

 actor.position.fromArray(profile.nativeTranslation);actor.add(root);actor.updateMatrixWorld(true);

function sample(r){

 for(const[k,mask]of Object.entries(r.masks)){let min=Infinity;const center=new THREE.Vector3();for(const i of mask.wholeVertices){r.body.getVertexPosition(i,v);v.applyMatrix4(r.body.matrixWorld);min=Math.min(min,v.y);center.add(v);}feet[k]={minY:min,center:center.divideScalar(mask.wholeVertices.length).toArray()};}
 const protectedBones=Object.fromEntries(['spine_04_012','head_019','saddle_0333'].map(n=>[n,r.root.getObjectByName(n).matrixWorld.elements.slice()]));
 return{feet,protectedBones,finite:r.bones.length===677&&r.bones.every(b=>b.matrixWorld.elements.every(Number.isFinite)),state:r.motion.snapshot()};

function set(r,gait,phase){

window.hoofTransition={ready:true,async run(key){
 const rigs={baseline:await load(key,config[key].baseline,false),candidate:await load(key,config[key].candidate,true)},rows=[];
 const pairs=[['rest','walk'],['walk','rest'],['walk','trot'],['trot','walk'],['trot','canterLeft'],['canterLeft','trot'],['canterLeft','canterRight'],['canterRight','canterLeft'],['canterRight','rest']];

   for(const[n,matrix]of Object.entries(a[i].protectedBones))for(let j=0;j<16;j++)protectedDelta=Math.max(protectedDelta,Math.abs(matrix[j]-b[i].protectedBones[n][j]));

  }

 }

}};
