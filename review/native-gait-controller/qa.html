<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Native gait controller check</title><script type="importmap">{"imports":{"three":"../../assets/vendor/three/build/three.module.js","three/addons/":"../../assets/vendor/three/examples/jsm/"}}</script></head><body><pre id="status">Loading…</pre><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone} from 'three/addons/utils/SkeletonUtils.js';
import {createNativeHorseController} from './controller.mjs';
const [asset,kit]=await Promise.all([new GLTFLoader().loadAsync('../native-horse-kit/model.glb'),fetch('../native-horse-kit/preservation.json').then(r=>r.json())]);
const scene=new THREE.Scene(),actor=new THREE.Group(),model=clone(asset.scene);scene.add(actor);actor.add(model);
const control=createNativeHorseController({THREE,mixerRoot:model,actor,clips:asset.animations,gaits:kit.gaits});
const bones=root=>{const a=[];root.traverse(o=>{if(o.isBone)a.push(o);});return a;};
const own=bones(model),rest=own.map(b=>({p:b.position.clone(),q:b.quaternion.clone(),s:b.scale.clone()}));
const restore=root=>bones(root).forEach((b,i)=>{b.position.copy(rest[i].p);b.quaternion.copy(rest[i].q);b.scale.copy(rest[i].s);});
function differences(reference){const other=bones(reference);return {positionMax:Math.max(...own.map((b,i)=>b.position.distanceTo(other[i].position))),quaternionDotMax:Math.max(...own.map((b,i)=>1-Math.abs(b.quaternion.dot(other[i].quaternion)))),scaleMax:Math.max(...own.map((b,i)=>b.scale.distanceTo(other[i].scale)))};}
window.controllerQA=async()=>{
 const failures=[],gaits={},reference=clone(asset.scene),refMixer=new THREE.AnimationMixer(reference);
 const checkPose=(label,d)=>{if(d.positionMax>1e-7||d.quaternionDotMax>1e-7||d.scaleMax>1e-7)failures.push(label+' differs from native reference');};
 for(const [name,record] of Object.entries(kit.gaits)){
  control.reset();actor.position.set(0,0,0);control.set(name);refMixer.stopAllAction();restore(reference);
  refMixer.clipAction(THREE.AnimationClip.findByName(asset.animations,record.clip)).reset().play();
  let time=0,maxPose={positionMax:0,quaternionDotMax:0,scaleMax:0};
  // Two cycles with irregular updates cross the clip seam and stance boundaries.
  for(let i=0;i<180;i++){const dt=record.durationS*2/180*(i%2?.6:1.4);time+=dt;control.update(dt);refMixer.update(dt);const d=differences(reference);for(const k in maxPose)maxPose[k]=Math.max(maxPose[k],d[k]);}
  const expected=record.nominalSpeedMps*time,travelError=actor.position.distanceTo(new THREE.Vector3(0,0,expected)),distanceError=Math.abs(control.snapshot().distanceM-expected);
  checkPose(name,maxPose);if(travelError>1e-8||distanceError>1e-8)failures.push(name+' travel mismatch');
  const before=actor.position.clone();control.set('stand');refMixer.stopAllAction();restore(reference);refMixer.clipAction(THREE.AnimationClip.findByName(asset.animations,'Horse|Horse_Idle')).reset().play();control.update(.35);refMixer.update(.35);
  const idle=differences(reference),standTravel=actor.position.distanceTo(before);checkPose(name+' to idle',idle);if(standTravel>1e-8)failures.push('Idle travels');
  control.set('rest');restore(reference);const restored=differences(reference);checkPose(name+' to rest',restored);
  gaits[name]={clip:record.clip,nominalSpeedMps:record.nominalSpeedMps,maxPose,travelError,distanceError,idle,standTravel,restored};
 }
 control.set('canterRight');const unsupported=[];for(const name of ['gallop','jump','canter']){try{control.set(name);unsupported.push({name,rejected:false});}catch(e){unsupported.push({name,rejected:true});}}
 if(unsupported.some(x=>!x.rejected)||control.snapshot().mode!=='canterRight')failures.push('Unsupported gait changes valid mode');
 const nominal=kit.gaits.canterRight.nominalSpeedMps;
 actor.position.set(0,0,0);actor.rotation.y=Math.PI/2;actor.scale.setScalar(2);control.reset();control.set('canterRight');control.update(.32);
 const rotated={error:actor.position.distanceTo(new THREE.Vector3(2*nominal*.32,0,0)),speedError:Math.abs(control.snapshot().speedMps-2*nominal)};
 actor.position.set(0,0,0);actor.rotation.y=0;actor.scale.setScalar(1);scene.scale.setScalar(3);control.reset();control.set('canterRight');control.update(.32);scene.updateMatrixWorld(true);
 const inherited={error:actor.getWorldPosition(new THREE.Vector3()).distanceTo(new THREE.Vector3(0,0,3*nominal*.32)),distanceError:Math.abs(control.snapshot().distanceM-3*nominal*.32),speedError:Math.abs(control.snapshot().speedMps-3*nominal)};
 if(Object.values(rotated).some(x=>x>1e-8)||Object.values(inherited).some(x=>x>1e-8))failures.push('Scaled/rotated world travel mismatch');
 const invalid=[];for(const value of [NaN,-.1,Infinity]){try{control.update(value);invalid.push(false);}catch(e){invalid.push(true);}}
 const wrongMetadata=structuredClone(kit.gaits);wrongMetadata.walk.nominalSpeedMps*=2;let wrongMetadataRejected=false;try{createNativeHorseController({THREE,mixerRoot:model,actor,clips:asset.animations,gaits:wrongMetadata});}catch(e){wrongMetadataRejected=true;}
 const missing=structuredClone(kit.gaits);missing.trot.clip='missing';let missingClipRejected=false;try{createNativeHorseController({THREE,mixerRoot:model,actor,clips:asset.animations,gaits:missing});}catch(e){missingClipRejected=true;}
 control.dispose();restore(reference);const disposedPose=differences(reference);checkPose('dispose',disposedPose);let disposedRejected=false;try{control.update(.1);}catch(e){disposedRejected=true;}
 if(own.length!==677||invalid.some(x=>!x)||!wrongMetadataRejected||!missingClipRejected||!disposedRejected)failures.push('Rig/metadata/lifecycle validation failed');
 const result={scope:'Private measured native gait integration; instantaneous transitions remain unreviewed',modelSha256:kit.targetSha256,nativeBones:own.length,gaits,unsupported,rotated,inherited,invalidDeltasRejected:invalid,wrongMetadataRejected,missingClipRejected,disposedPose,disposedRejected,failures};document.getElementById('status').textContent=JSON.stringify(result,null,2);return result;
};document.getElementById('status').textContent='Ready';
</script></body></html>
