import * as THREE from 'three';

const [asset,kit]=await Promise.all([new GLTFLoader().loadAsync('../native-horse-kit/model.glb'),fetch('../native-horse-kit/preservation.json').then(r=>r.json())]);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(1440,900);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#cbd1c5');scene.add(new THREE.HemisphereLight(0xffffff,0x65735b,2));

const stats=rows=>{const s=[...rows].sort((a,b)=>a-b),q=p=>s[Math.min(s.length-1,Math.floor(p*s.length))];return {samples:rows.length,medianMs:q(.5),p95Ms:q(.95),maxMs:s.at(-1),meanMs:rows.reduce((a,b)=>a+b,0)/rows.length};};

 actors.forEach((a,i)=>{a.visible=i<count;a.position.x=count===1?0:(i-1.5)*2.15;});

 return {count,modelSha256:kit.targetSha256,resolution:[1440,900],pixelRatio:1,shadows:'2048px PCFSoft',warmupFrames:45,hardware,frameInterval:stats(intervals),cpuRenderSubmission:stats(submit),mainPassDrawCalls:Math.max(...drawCalls),mainPassTriangles:Math.max(...triangles),nativeBodyJointsPerHorse:677,scope:'Headless local isolated scene, mixed gaits in place; not full Ranch, mobile, GPU time or transitions approval'};
