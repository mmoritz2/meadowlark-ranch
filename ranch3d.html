<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",sans-serif}
canvas{display:block}
.chip{background:rgba(255,255,253,0.88);border:2px solid #e8d9b8;border-radius:999px;padding:6px 14px;font-weight:700;color:#4a3526;box-shadow:0 2px 6px rgba(60,40,10,0.12);white-space:nowrap}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
#hud .chip,#hud select,#hud button,#hud a{pointer-events:auto}
#hud .spacer{flex:1}
select,button{font-family:inherit;font-weight:700;color:#4a3526;background:linear-gradient(#fff8ea,#f5e3c2);border:2px solid #d9b97f;border-radius:14px;padding:7px 12px;font-size:14px;cursor:pointer}
a.btn{text-decoration:none;font-weight:700;color:#4a3526;background:linear-gradient(#fff8ea,#f5e3c2);border:2px solid #d9b97f;border-radius:14px;padding:7px 12px;font-size:14px}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(60,45,25,0.85);color:#fff8ea;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity 1s;pointer-events:none}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:60px;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(60,45,25,0.92);color:#fff8ea;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;animation:pop .3s ease}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#a9cfe8;color:#34526b;font-size:22px;font-weight:800;z-index:30;text-align:center}
#touch{position:fixed;bottom:16px;right:16px;z-index:6;display:grid;grid-template-columns:repeat(3,56px);gap:8px;user-select:none;-webkit-user-select:none}
#touch button{width:56px;height:56px;border-radius:50%;font-size:20px;opacity:0.9;touch-action:none}
#mini{position:fixed;bottom:16px;left:16px;z-index:6;border:3px solid rgba(255,255,253,0.7);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer}
#bigmapWrap{position:fixed;inset:0;background:rgba(30,40,25,0.6);z-index:25;display:none;align-items:center;justify-content:center}

#courseHud{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(60,45,25,0.9);color:#fff8ea;padding:9px 14px;border-radius:999px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}
#courseHud button{padding:2px 9px;border-radius:10px;font-size:13px}
#countdown{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:8;font-size:84px;font-weight:900;color:#fff8ea;text-shadow:0 4px 18px rgba(40,25,5,0.6);display:none}
#eventsPanel,#carePanel,#shopPanel,#onlinePanel,#lbPanel{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9;background:#fffdf7;border:3px solid #e3cf9f;border-radius:18px;padding:14px;display:none;flex-direction:column;gap:7px;max-height:70vh;overflow:auto;width:min(440px,92vw);color:#4a3526}
#chatFeed{position:fixed;left:16px;bottom:170px;z-index:7;display:flex;flex-direction:column;gap:4px;max-width:min(340px,70vw);pointer-events:none}
#chatFeed div{background:rgba(60,45,25,0.78);color:#fff8ea;padding:5px 11px;border-radius:12px;font-size:13px;font-weight:600;overflow-wrap:break-word}
#chatBar{position:fixed;left:16px;bottom:130px;z-index:8;display:none;gap:6px;width:min(340px,70vw)}
#chatBar input{flex:1;font-family:inherit;font-size:14px;padding:7px 12px;border:2px solid #d9b97f;border-radius:12px}
.evrow{display:flex;align-items:center;gap:8px;font-size:14px;border:2px solid #efe3c8;border-radius:12px;padding:7px 10px;background:#fffaf0}
.evrow span{color:#8c7a63;font-size:12px;flex:1}
.crow{display:flex;align-items:center;gap:8px;font-size:13px}

.cbar{flex:1;height:11px;background:#ece2cd;border-radius:6px;overflow:hidden}
.cfill{height:100%;border-radius:6px;transition:width .3s}

#ctx{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(60,45,25,0.9);color:#fff8ea;padding:8px 16px;border-radius:999px;font-weight:700;cursor:pointer;display:none}
#tameHud{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(60,45,25,0.9);color:#fff8ea;padding:8px 16px;border-radius:999px;font-weight:700;display:none}
#dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;background:#fffdf7;border:3px solid #e3cf9f;border-radius:18px;padding:16px 18px;width:min(420px,90vw);color:#4a3526;display:none;box-shadow:0 16px 40px rgba(40,25,5,0.35)}
#dlg p{line-height:1.45}
/* ============ UI 2.0 — polish layer ============ */
.chip{backdrop-filter:blur(8px);background:rgba(255,255,253,0.82);box-shadow:0 3px 10px rgba(60,40,10,0.16);transition:box-shadow .2s}
select,button,a.btn{transition:transform .12s,box-shadow .15s,filter .15s;box-shadow:0 2px 5px rgba(60,40,10,0.14)}
button:hover,a.btn:hover,select:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 4px 10px rgba(60,40,10,0.2)}

#eventsPanel,#carePanel,#shopPanel,#onlinePanel,#lbPanel,#stablePanel,#questPanel,#profilePanel{border-radius:22px;box-shadow:0 22px 60px rgba(40,25,5,0.35);animation:panelIn .22s ease;border-width:2px;scrollbar-width:thin;scrollbar-color:#d9b97f #fff7e6}
#stablePanel,#questPanel,#profilePanel{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10;background:#fffdf7;border:2px solid #e3cf9f;padding:14px;display:none;flex-direction:column;gap:7px;max-height:72vh;overflow:auto;width:min(460px,94vw);color:#4a3526}
@keyframes panelIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#eventsPanel::-webkit-scrollbar,#shopPanel::-webkit-scrollbar,#stablePanel::-webkit-scrollbar,#questPanel::-webkit-scrollbar,#lbPanel::-webkit-scrollbar{width:9px}
#eventsPanel::-webkit-scrollbar-thumb,#shopPanel::-webkit-scrollbar-thumb,#stablePanel::-webkit-scrollbar-thumb,#questPanel::-webkit-scrollbar-thumb,#lbPanel::-webkit-scrollbar-thumb{background:#d9b97f;border-radius:8px}
.ph{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:2px dashed #efe3c8}
.evrow{transition:transform .12s,box-shadow .15s}
.evrow:hover{transform:translateX(2px);box-shadow:0 3px 9px rgba(60,40,10,0.12)}
.badge{background:#e8b84b;color:#5a3d12;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800}
.qrow{display:flex;align-items:center;gap:9px;border:2px solid #efe3c8;border-radius:14px;padding:8px 10px;background:#fffaf0;font-size:13px;font-weight:700}
.qrow .qico{font-size:21px;width:30px;text-align:center}
.qrow .qmain{flex:1;display:flex;flex-direction:column;gap:4px}
.qbar{height:9px;background:#ece2cd;border-radius:6px;overflow:hidden}
.qfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#f3b73d,#e8943a);transition:width .3s}
.qrow.done{border-color:#9fd486;background:#f3fbe9}
.qrow.claimed{opacity:.55}
.claimBtn{background:linear-gradient(#d8f0c8,#a8d88a);border-color:#8fc474;padding:5px 12px;border-radius:12px;font-size:13px}
#statusCard{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;background:rgba(255,255,253,0.86);backdrop-filter:blur(10px);border:2px solid #e8d9b8;border-radius:20px;padding:8px 12px;box-shadow:0 8px 24px rgba(60,40,10,0.22);color:#4a3526;max-width:94vw}
#scPortrait{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;border:3px solid #fff;box-shadow:0 2px 7px rgba(60,40,10,0.3);flex:none}
#scInfo{display:flex;flex-direction:column;gap:3px;min-width:150px}
#scName{font-weight:800;font-size:14px;white-space:nowrap}
.scbars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scb{height:7px;border-radius:4px;background:#ece2cd;overflow:hidden}
.scb i{display:block;height:100%;border-radius:4px;transition:width .4s}
#scXp{height:5px;border-radius:3px;background:#ece2cd;overflow:hidden}
#scXp i{display:block;height:100%;background:linear-gradient(90deg,#f3b73d,#ffd97a)}
#scBtns{display:flex;gap:5px}
#scBtns button{width:38px;height:38px;border-radius:50%;padding:0;font-size:17px}
#hint{bottom:86px}
#questTrack{backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(60,40,10,0.14);border-radius:14px}
#ftBar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:92vw;margin-top:10px}
#ftBar button{font-size:13px;padding:6px 11px}
@media(max-width:720px){#statusCard{bottom:84px;left:12px;transform:none}#scInfo{min-width:110px}}
</style>

<script id="gameModule" type="text/plain">
import * as THREE from 'three';
import {Sky} from 'three/addons/objects/Sky.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ================= save sync with the 2D game ================= */
const SAVE_KEY='starRanchFable_v1';   // NOT renamed with the game: changing this orphans every existing save
/* Progress is per-browser, so a new visitor always starts fresh. This is for checking what
   that first run actually looks like on a machine that has already been played: open the
   game with ?newgame. It confirms first if there is anything to lose, then drops you back
   on a clean URL so a stray refresh cannot wipe a second time. */
if(location.search.includes('newgame')){
 try{
  const had=localStorage.getItem(SAVE_KEY);
  if(!had||confirm('Start a brand-new ranch? This erases the progress saved in THIS browser.')){
   localStorage.removeItem(SAVE_KEY);
   location.replace(location.pathname);
  }
 }catch(e){}
}
let save=null;
try{save=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
if(!save||!save.horses||!save.horses.length){
 save=save&&save.horses?save:{v:2,ranchName:'Meadowlark Ranch',founded:Date.now(),coins:150,gems:3,items:{carrot:10,apple:2,hay:3},nextId:1,horses:[],decor:[],projects:{},trophies:{},wild:null,wildTrust:0,muted:false,lastSeen:Date.now(),lastDaily:'',questDate:'',quests:[],totalRaces:0,started:true};
 save.horses.push({id:save.nextId++,name:'Clover',breed:'bay',colors:{body:'#8a5a2b',mane:'#332214'},horn:false,rainbow:false,stats:{speed:3,stamina:3,jump:3},level:1,xp:0,bond:25,needs:{hunger:90,thirst:90,clean:90,happy:90},foal:false,tack:null});
 save.started=true;
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}
const myHorses=save.horses;
let rideIdx=0;
// the 3D world now owns the ranch: needs decay (even while away) & the daily gift
const DECAY3={hunger:100/(8*3600),thirst:100/(6*3600),clean:100/(12*3600),happy:100/(16*3600)};
{
 const sec=Math.min(24*3600,(Date.now()-(save.lastSeen||Date.now()))/1000);
 if(sec>60){
  for(const h of save.horses)
   for(const k in DECAY3)h.needs[k]=Math.max(15,h.needs[k]-DECAY3[k]*sec);
 }
 const ds=new Date().toDateString();
 if(save.lastDaily!==ds){
  save.lastDaily=ds;
  save.coins+=100;save.gems+=1;
  save.pass=save.pass||{pts:0};
  save.pass.pts+=30;
  setTimeout(()=>{try{toast('🎁 Daily gift: +100🪙 +1💎 +30 🎟️ pass points');}catch(e){}},1500);
 }
 save.lastSeen=Date.now();
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}
let distAcc=0;
setInterval(()=>{
 let grewName=null;
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  for(const h of s.horses)
   for(const k in DECAY3)h.needs[k]=Math.max(0,h.needs[k]-DECAY3[k]*30);
  // foals grow up: 24 real hours, or sooner if trained to level 3
  for(const h of s.horses){
   if(!h.foal)continue;
   if(!h.born){h.born=Date.now();continue;}
   if(Date.now()-h.born>86400000||(h.level||1)>=3){
    h.foal=false;
    s.stats=s.stats||{};
    s.stats.grown=(s.stats.grown||0)+1;
    grewName=h.name;
   }
  }
  s.stats=s.stats||{};
  s.stats.dist=(s.stats.dist||0)+Math.round(distAcc);
  distAcc=0;
  s.lastSeen=Date.now();
  localStorage.setItem(SAVE_KEY,JSON.stringify(s));
 }catch(e){}
 if(grewName){
  try{toast('🌱➡️🐴 '+grewName+' grew up into a beautiful horse!');reloadHorses();}catch(e){}
 }
},30000);
let coins=save?Math.floor(save.coins):0;
let gems=save?save.gems:0;
let muted=save?!!save.muted:false;
const $=id=>document.getElementById(id);
$('coinEl').textContent=coins;
$('gemEl').textContent=gems;
$('muteBtn').textContent=muted?'🔇':'🔊';
function syncSave(fn){
 if(!save)return;
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  fn(s);
  localStorage.setItem(SAVE_KEY,JSON.stringify(s));
 }catch(e){}
}
function addCoins(n){coins+=n;$('coinEl').textContent=coins;syncSave(s=>{s.coins+=n;s.stats=s.stats||{};s.stats.earned=(s.stats.earned||0)+n;});}
function statBump(k,n){syncSave(s=>{s.stats=s.stats||{};s.stats[k]=(s.stats[k]||0)+n;});}
function addGems(n){gems+=n;$('gemEl').textContent=gems;syncSave(s=>{s.gems+=n;});}
function toast(msg){
 const t=document.createElement('div');t.className='toast';t.textContent=msg;
 $('toasts').appendChild(t);
 setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400);},2200);
 /* In a headset the DOM is not on screen at all, so every one of these — found a gem,
    clean jump, quest complete, a horse getting hungry — was silently lost. Mirror it onto
    a panel in the world. Defined later; guarded so early boot toasts do not throw. */
 try{if(typeof vrToast==='function')vrToast(msg);}catch(e){}
}

/* ================= tiny sounds ================= */
let AC=null;
function beep(f0,f1,dur,type,vol,delay){
 if(muted)return;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol||0.1,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
 }catch(e){}
}
const sCoin=()=>{beep(880,1320,0.09,'triangle',0.1);beep(1320,1760,0.12,'triangle',0.08,0.07);};
const sGem=()=>{[784,988,1319].forEach((f,i)=>beep(f,f,0.14,'triangle',0.1,i*0.08));};
const sJump=()=>beep(300,650,0.18,'sine',0.1);
const sChime=()=>{beep(659,659,0.1,'triangle',0.1);beep(988,988,0.16,'triangle',0.1,0.08);};
const sThud=()=>beep(140,60,0.16,'square',0.12);
const sHoof=alt=>beep(alt?95:75,alt?70:55,0.05,'triangle',0.05);
const sNeigh=()=>{beep(700,250,0.35,'sawtooth',0.05);beep(900,300,0.3,'sawtooth',0.035,0.05);};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';syncSave(s=>{s.muted=muted;});};
function addXp3D(n){
 let leveled=false,lvl=0,grew=false;
 syncSave(s=>{
  const h=s.horses[rideIdx];
  if(!h)return;
  h.xp=(h.xp||0)+n;
  while(h.xp>=50+h.level*50){
   h.xp-=50+h.level*50;
   h.level++;
   leveled=true;lvl=h.level;
   const st=['speed','stamina','jump'][Math.floor(Math.random()*3)];
   h.stats[st]=Math.min(10,h.stats[st]+1);
  }
  if(h.foal&&h.level>=3){h.foal=false;grew=true;s.stats=s.stats||{};s.stats.grown=(s.stats.grown||0)+1;}
 });
 if(leveled){

/* ================= terrain height (smooth value noise) ================= */
function ihash(ix,iz){
 let h=ix*374761393+iz*668265263;
 h=(h^(h>>13))*1274126177;
 return ((h^(h>>16))>>>0)/4294967295;
}
function vnoise(x,z){
 const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;
 const sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz);
 const a=ihash(ix,iz),b=ihash(ix+1,iz),c=ihash(ix,iz+1),d=ihash(ix+1,iz+1);
 return a+(b-a)*sx+(c-a)*sz+(a-b-c+d)*sx*sz;
}
const riverZ=x=>120+Math.sin(x*0.012)*45;
/* Sparrow Creek stream — a tributary that winds down from the southern hills into the river */
const streamX=z=>118+Math.sin(z*0.03)*14+Math.sin(z*0.011+3)*8;
const STREAM_JOIN=160;                          // it meets the river around z≈160
function rawH(x,z){
 const d=Math.hypot(x,z);
 const near=THREE.MathUtils.smoothstep(d,24,58);
 const far=1-THREE.MathUtils.smoothstep(d,380,460);
 const n=vnoise(x*0.018+7,z*0.018+3)*7.5       // medium rolling
        +vnoise(x*0.055,z*0.055)*1.8           // small bumps
        +vnoise(x*0.008+19,z*0.008+5)*14.0     // broad hills
        +vnoise(x*0.0042+50,z*0.0042+22)*13.0; // very broad ridges & valleys
 let h=near*far*(n-9.5);
 const rg=1-Math.abs(vnoise(x*0.006+83,z*0.006-41)*2-1);   // ridged crests give hills a backbone
 h+=near*far*rg*rg*6.0;
 const bl=vnoise(x*0.011-31,z*0.011+44);                    // flat-topped bluffs, steep cliff faces
 h+=near*far*THREE.MathUtils.smoothstep(bl,0.425,0.445)*9.0;
 const rd=Math.abs(z-riverZ(x));
 h-=near*far*1.7*(1-THREE.MathUtils.smoothstep(rd,0,9));
 if(z<STREAM_JOIN){
  const sd=Math.abs(x-streamX(z));
  h-=near*far*1.15*(1-THREE.MathUtils.smoothstep(sd,0,4.5));
 }
 return h;
}
const colliders=[];
const walls=[];
const BR_A=riverZ(0)-7.5,BR_B=riverZ(0)+7.5;
const BRIDGE_Y=Math.max(rawH(0,BR_A),rawH(0,BR_B))+0.22;
function groundH(x,z){
 let h=rawH(x,z);
 if(Math.abs(x)<2.3&&z>BR_A&&z<BR_B)h=Math.max(h,BRIDGE_Y+0.55*Math.sin(Math.PI*(z-BR_A)/15));
 return h;
}

/* Thumbstick -> the same touch flags the on-screen buttons already set,
   so no gameplay code needs to know VR exists. */
let vrMenuOpen=false,vrPrevMenuBtn=false,vrPrevTrigger=false,vrHit=null,vrHover='';

function pollVR(){
 const s=renderer.xr.getSession();
 if(!s)return;
 let menuBtn=false,trigger=false;
 touch.go=false;touch.left=false;touch.right=false;touch.gal=false;touch.jump=false;
 touch.turnA=0;touch.goA=0;
 vrStickY=0;
 let stickX=0,stickY=0,bestMag=0;
 for(const src of s.inputSources){
  const gp=src.gamepad;
  if(!gp||!gp.axes)continue;
  const b=gp.buttons||[];
  if(b[5]&&b[5].pressed)menuBtn=true;      // B / Y toggles the menu
  if(b[0]&&b[0].pressed)trigger=true;
  const ax=gp.axes;
  const x=ax.length>2?ax[2]:ax[0];
  const y=ax.length>3?ax[3]:ax[1];
  if(vrMenuOpen){                          // menu open: the horse waits, the stick scrolls
   if(Math.abs(y)>Math.abs(vrStickY))vrStickY=y;
   continue;
  }
  /* Only the stick you are actually pushing steers. Reading both controllers and OR-ing
     them let a resting thumb, or the drift every analog stick has, fight the one you meant. */
  const mag=Math.hypot(x,y);
  if(mag>bestMag){bestMag=mag;stickX=x;stickY=y;}
  if(b[0]&&b[0].pressed)touch.gal=true;    // trigger: gallop
  if(b[4]&&b[4].pressed)touch.jump=true;   // A / X: jump
 }
 if(!vrMenuOpen){
  /* Thumbstick -> analog steering and throttle. This used to be a hard threshold at 0.40
     that produced a full-rate turn the instant you crossed it, so the horse had no gentle
     steering at all and stick noise around the threshold made it judder. A dead zone kills
     the noise; the squared curve on yaw gives fine control near centre and full lock only
     at the rim. Throttle stays linear so speed is predictable. */
  const DZ=0.18;
  const shape=(v,curved)=>{const a=Math.abs(v);
   if(a<DZ)return 0;
   const n=Math.min(1,(a-DZ)/(1-DZ));      // rescaled so it starts at 0, not at a step
   return Math.sign(v)*(curved?n*(0.35+0.65*n):n);};
  touch.turnA=-shape(stickX,true);            // stick left (-x) turns left (+heading)
  const f=shape(stickY,false);
  touch.goA=f<0?-f:0;                      // forward only; pulling back does not reverse in VR
  if(touch.goA>0.05)touch.go=true;         // keep the booleans truthful for the rest of the game
  if(touch.turnA>0.05)touch.left=true;
  if(touch.turnA<-0.05)touch.right=true;
 }
 if(menuBtn&&!vrPrevMenuBtn)setVRMenu(!vrMenuOpen);
 if(vrMenuOpen&&trigger&&!vrPrevTrigger&&vrHover)vrMenuClick(vrHover);
 vrPrevMenuBtn=menuBtn;
 vrPrevTrigger=trigger;
}

/* Every scrolling page shares this: build a list of row-drawing closures, then draw the
   slice that fits. Rows scrolled out are clipped away and vrButton drops their hitboxes. */
function drawVRList(c){
 const rows=[];
 let note='';
 try{
  const sv=freshSave()||{};
  if(vrPage==='shop')note=buildVRShop(rows,sv);
  else if(vrPage==='stable')note=buildVRStable(rows,sv);
  else if(vrPage==='quests')note=buildVRQuests(rows,sv);
  else if(vrPage==='events')note=buildVREvents(rows,sv);
 }catch(e){
  rows.length=0;
  note='Could not read your save just now — try again in a moment.';
 }
 vrContentH=rows.length*VRM_STEP;
 const max=Math.max(0,vrContentH-vrListH);
 let sc=vrScroll[vrPage]||0;
 sc=Math.max(0,Math.min(max,sc));
 vrScroll[vrPage]=sc;

 if(!rows.length){
  c.fillStyle='#8c7a63';
  c.font='600 24px "Trebuchet MS",sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  String(note||'Nothing here yet.').split('\n')
   .forEach((ln,i)=>c.fillText(ln,VRM_W/2,vrListTop+110+i*38));
  return;
 }

 c.save();
 c.beginPath();c.rect(24,vrListTop,VRM_W-48,vrListH);c.clip();
 vrClip={y:vrListTop,h:vrListH};
 for(let i=0;i<rows.length;i++){
  const y=vrListTop-sc+i*VRM_STEP;
  if(y+VRM_ROW<vrListTop-4||y>vrListTop+vrListH+4)continue;
  rows[i](y);
 }
 vrClip=null;
 c.restore();

 if(max>0){
  const tx=998,th=Math.max(40,vrListH*vrListH/vrContentH);
  const ty=vrListTop+(vrListH-th)*(sc/max);
  vrRR(c,tx,vrListTop,8,vrListH,4);c.fillStyle='#efe3c8';c.fill();
  vrRR(c,tx,ty,8,th,4);c.fillStyle='#d9b97f';c.fill();
 }
}

let vrMenuT=0;
function updateVRMenu(dt){
 if(!vrMenuOpen)return;
 /* point at it */
 let best=null;
 for(const c of vrCtrls){
  _vrM4.identity().extractRotation(c.matrixWorld);
  vrRayc.ray.origin.setFromMatrixPosition(c.matrixWorld);
  vrRayc.ray.direction.set(0,0,-1).applyMatrix4(_vrM4).normalize();
  const hit=vrRayc.intersectObject(vrMenu,false)[0];
  if(hit&&(!best||hit.distance<best.distance))best=hit;
 }
 let hover='';
 if(best&&best.uv){
  const px=best.uv.x*VRM_W,py=(1-best.uv.y)*VRM_H;
  for(const b of vrBtns){
   if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){hover=b.id;break;}
  }
  vrDot.visible=true;
  vrRig.worldToLocal(vrDot.position.copy(best.point));
 }else{
  vrDot.visible=false;
 }
 let redraw=(hover!==vrHover);
 vrHover=hover;
 /* stick scrolls the list; drawVRList clamps the value on the way through */
 if(Math.abs(vrStickY)>0.2&&vrContentH>vrListH){
  vrScroll[vrPage]=(vrScroll[vrPage]||0)+vrStickY*950*dt;
  redraw=true;
 }
 /* the live bars and the minimap need refreshing, but not at 90Hz */
 vrMenuT+=dt;
 if(vrMenuT>0.25){vrMenuT=0;redraw=true;}
 if(redraw)drawVRMenu();
}

const SKY_P={turbidity:2.3,rayleigh:3.5,mieCoefficient:0.003,mieDirectionalG:0.78};
const sunDir=new THREE.Vector3().setFromSphericalCoords(1,THREE.MathUtils.degToRad(90-26),THREE.MathUtils.degToRad(35));
function setSky(skyObj){
 const u=skyObj.material.uniforms;
 for(const k in SKY_P)u[k].value=SKY_P[k];
 u.sunPosition.value.copy(sunDir);
}
/* The Sky shader outputs ~1.6-2.1 scene-linear luminance. ACES desaturates everything
   above ~1.0 on its path to white, so a physically correct blue sky was being rendered as
   a flat grey studio backdrop — the single biggest reason the game read as product
   photography rather than outdoors. Scale it into the range ACES keeps colour in. */
const SKY_SCALE=0.30;
function dimSky(o){o.material.onBeforeCompile=sh=>{
 sh.fragmentShader=sh.fragmentShader.replace(/gl_FragColor\s*=\s*vec4\(\s*retColor/,
  'gl_FragColor = vec4( retColor * '+SKY_SCALE.toFixed(2));};o.material.needsUpdate=true;}
const sky=new Sky();
sky.scale.setScalar(450000);
setSky(sky);dimSky(sky);
scene.add(sky);
const pmrem=new THREE.PMREMGenerator(renderer);
/* PBR ambient comes from a PMREM'd sky — bake one per time-of-day band and swap */
const envMaps={};let curEnv='day';
{
 const es=new THREE.Scene();
 const esky=new Sky();
 esky.scale.setScalar(1000);
 setSky(esky);dimSky(esky);
 es.add(esky);
 /* A ground in the bake, so downward-facing surfaces receive warm bounce instead of sky.
    Without it every shaded underside samples blue sky and reads as if it is floating. */
 {const gd=new THREE.Mesh(new THREE.SphereGeometry(400,12,8,0,Math.PI*2,Math.PI/2,Math.PI/2),
   new THREE.MeshBasicMaterial({color:0x30352c,side:THREE.BackSide}));
  gd.position.y=-1; es.add(gd);}
 const eu=esky.material.uniforms;
 for(const[k,e]of[['day',30],['golden',7],['night',-14]]){
  eu.sunPosition.value.setFromSphericalCoords(1,THREE.MathUtils.degToRad(90-e),THREE.MathUtils.degToRad(120));
  envMaps[k]=pmrem.fromScene(es,0.04).texture;
 }
 scene.environment=envMaps.day;
}
/* Sun-to-ambient was 1.55:1; real daylight is 5:1 to 8:1. The hemisphere light was
   supplying ~40% of the light budget in full sun, so every shadow was a faint 15% dip.
   The env map (PMREM'd sky) now carries the ambient and this is only a trim. */

/* ================= graphics quality (Low / Medium / High) ================= */
let useBloom=true,grassInst=null,cloudList=null,seedTreeInsts=null;
let quality=(save&&save.quality)||'high';
const QUAL_LABEL={low:'🎚️ Graphics: Low — smoothest',medium:'🎚️ Graphics: Medium',high:'🎚️ Graphics: High — prettiest'};
function applyQuality(q){
 quality=q;
 const pr=q==='high'?Math.min(devicePixelRatio,1.75):q==='medium'?Math.min(devicePixelRatio,1.25):1;
 renderer.setPixelRatio(pr);
 composer.setPixelRatio(pr);
 renderer.setSize(innerWidth,innerHeight);
 composer.setSize(innerWidth,innerHeight);
 const sh=q==='high'?4096:q==='medium'?2048:1024;
 if(sun.shadow.mapSize.x!==sh){
  sun.shadow.mapSize.set(sh,sh);
  if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
 }
 useBloom=q!=='low';
 fireflies.count=q==='low'?44:FIREFLY_N;
 if(grassInst)grassInst.count=q==='low'?6200:9500;
 if(cloudList)cloudList.forEach((c,i)=>{c.visible=q==='low'?i%2===0:true;});
 if(seedTreeInsts)seedTreeInsts.forEach(m=>{m.count=q==='low'?Math.ceil(m.userData.fullCount*0.55):m.userData.fullCount;});
 const qb=$('qualBtn');
 if(qb)qb.title=QUAL_LABEL[q];
}
applyQuality(quality);
$('qualBtn').onclick=()=>{
 const order=['high','medium','low'];
 const q=order[(order.indexOf(quality)+1)%order.length];
 applyQuality(q);
 syncSave(s=>{s.quality=q;});
 try{toast(QUAL_LABEL[q]);}catch(e){}
};

function canvasTex(w,h,draw,repeat){
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 draw(cv.getContext('2d'),w,h);
 const tx=new THREE.CanvasTexture(cv);
 tx.colorSpace=THREE.SRGBColorSpace;
 if(repeat){tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(repeat,repeat);}
 return tx;
}
function noiseCanvas(size,scale,off){
 const cv=document.createElement('canvas');cv.width=cv.height=size;
 const c=cv.getContext('2d');
 const img=c.createImageData(size,size);
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  const v=vnoise(x*scale+off,y*scale+off*2)*0.65+vnoise(x*scale*3.1+off,y*scale*3.1)*0.35;
  const i=(y*size+x)*4,g=Math.floor(v*255);
  img.data[i]=img.data[i+1]=img.data[i+2]=g;img.data[i+3]=255;
 }
 c.putImageData(img,0,0);
 return cv;
}

{
 const geo=new THREE.PlaneGeometry(1000,1000,256,256);
 geo.rotateX(-Math.PI/2);
 const pos=geo.attributes.position;
 const colors=[];
 const col=new THREE.Color();
 const C_ROCK=new THREE.Color('#8d8478'),C_CREST=new THREE.Color('#cfc394');
 for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i);
  const y=groundH(x,z);
  pos.setY(i,y);
  const wx=x+vnoise(x*0.01+5,z*0.01+9)*14, wz=z+vnoise(x*0.013+31,z*0.013+2)*14;   // domain warp breaks the axis grid
  const vBig=vnoise(wx*0.011+3,wz*0.011+17);     // big natural patches (~90u)
  const v=vnoise(wx*0.045+40,wz*0.045+9);
  const v2=vnoise(x*0.17+12,z*0.17+71);
  col.set('#eef2df').lerp(new THREE.Color('#b2c084'),vBig*0.5+v*0.32);
  col.lerp(new THREE.Color('#9cad74'),v2*0.22);   // finer mottle
  if(y>1.4)col.lerp(new THREE.Color('#d8d0a4'),Math.min(0.4,(y-1.4)*0.18));
  // slope-aware shading: steep faces read as rock, high crests as sun-dried grass
  const sl=Math.hypot(groundH(x+2,z)-groundH(x-2,z),groundH(x,z+2)-groundH(x,z-2))/4;
  if(sl>0.3)col.lerp(C_ROCK,Math.min(0.85,(sl-0.3)*1.9));
  if(y>7)col.lerp(C_CREST,Math.min(0.5,(y-7)*0.055));
  const rd=Math.abs(z-riverZ(x));
  if(rd<9)col.lerp(new THREE.Color('#e6d6a8'),(1-THREE.MathUtils.smoothstep(rd,0,9))*0.55);
  if(z<STREAM_JOIN){
   const sd=Math.abs(x-streamX(z));
   if(sd<6)col.lerp(new THREE.Color('#dcc9a0'),(1-THREE.MathUtils.smoothstep(sd,0,6))*0.5);   // sandy stream banks
  }
  const dB=Math.hypot(x+220,z-130);
  if(dB<176)col.lerp(new THREE.Color('#d9a276'),0.96*(1-THREE.MathUtils.smoothstep(dB,96,176)));
  const dA=Math.hypot(x-220,z+110);
  if(dA<150)col.lerp(new THREE.Color('#e8e09a'),(1-dA/150)*0.35);
  const dW=Math.hypot(x+160,z+210);
  if(dW<162)col.lerp(new THREE.Color('#eef2f0'),0.96*(1-THREE.MathUtils.smoothstep(dW,84,162)));
  const vshade=0.88+0.12*THREE.MathUtils.clamp((y+2.5)/6.5,0,1);
  col.multiplyScalar(vshade);

 }
 geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 geo.computeVertexNormals();
 groundTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
 const gmat=new THREE.MeshStandardMaterial({map:groundTex,vertexColors:true,roughness:0.97,bumpMap:bumpTexture,bumpScale:0.08});
 gmat.envMapIntensity=0.44;
 gmat.onBeforeCompile=sh=>{   // stochastic no-tile sampling (per-block random UV offsets, bilinear-blended)

   +'vec2 _h22(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}\n'
   +'float _vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(_h21(i),_h21(i+vec2(1.,0.)),f.x),mix(_h21(i+vec2(0.,1.)),_h21(i+vec2(1.,1.)),f.x),f.y);}\n'
   +sh.fragmentShader.replace('#include <map_fragment>',
    `#ifdef USE_MAP
     vec2 _bp=vMapUv*0.22;
     vec2 _bi=floor(_bp), _bf=fract(_bp);
     vec2 _bw=_bf*_bf*(3.0-2.0*_bf);
     vec4 _acc=vec4(0.0);
     for(int _dy=0;_dy<=1;_dy++)for(int _dx=0;_dx<=1;_dx++){
      vec2 _bg=vec2(float(_dx),float(_dy));
      vec2 _bo=_h22(_bi+_bg)*61.7;
      float _wt=(_bg.x>0.5?_bw.x:1.0-_bw.x)*(_bg.y>0.5?_bw.y:1.0-_bw.y);
      _acc+=texture2D(map,vMapUv+_bo)*_wt;
     }
     float macro=_vn(vMapUv*0.06)*0.62+_vn(vMapUv*0.02+5.0)*0.38;
     /* The grass photo was authored far too dark — linear mean luminance ~0.024, an
        almost-black albedo. The terrain's vertex colours are pale on purpose (they TINT
        the photo: sand near the river, rock on slopes, snow up north), so the product
        came out near-black and the meadows looked dead. Normalise the photo up to a
        realistic grass albedo and let the vertex colours go on tinting it. */
     diffuseColor.rgb*=_acc.rgb*2.35*(0.90+macro*0.26);
     /* The albedo was clipping its red channel to zero over most of the map, which is not a
        colour any vegetation has — it read as pure display-primary green. Put red back and
        take the saturation down to something turf actually measures at. */
     float _lg=dot(diffuseColor.rgb,vec3(0.299,0.587,0.114));
     diffuseColor.rgb=mix(vec3(_lg),diffuseColor.rgb,0.84);
     diffuseColor.rgb+=vec3(0.042,0.030,0.010)*_lg;
     /* One flat saturated green over the whole map is the loudest "video game" tell there
        is. Real pasture is a patchwork: sun-dried olive on the crowns, damper blue-green in
        the hollows. Two octaves of the same cheap noise, no extra texture fetch. */
     float _dry=_vn(vMapUv*0.011+11.0);
     diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.20,1.05,0.60),
                          smoothstep(0.52,0.95,_dry)*0.60);
     diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(0.80,0.95,0.88),
                          smoothstep(0.52,0.08,_dry)*0.35);
     #endif`);
 };

 for(let i=0;i<R;i++){
  const p=prof[i];

   const th=j/segs*Math.PI*2;
   pos.push(Math.cos(th)*p.rx,p.cy+Math.sin(th)*p.ry,p.z);
   uv.push(i/(R-1),0.5-Math.sin(th)*0.5);
  }
 }
 for(let i=0;i<R-1;i++)for(let j=0;j<segs;j++){
  const a=i*(segs+1)+j,b=a+segs+1;
  idx.push(a,b,a+1,b,b+1,a+1);
 }
 const c0=pos.length/3;
 pos.push(0,prof[0].cy,prof[0].z);uv.push(0,0.5);
 for(let j=0;j<segs;j++)idx.push(c0,j+1,j);
 const c1=pos.length/3;

 pos.push(0,prof[R-1].cy,prof[R-1].z);uv.push(1,0.5);
 for(let j=0;j<segs;j++)idx.push(c1,base+j,base+j+1);

class WPRng{

  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}

  case 2:return 0.2+0.8*Math.sin(0.5*Math.PI*ratio);

  o.multiply(_wpQ(_wpXA,seg));
  if(level>=2&&p.attractionUp)_wpTropism(o,p.attractionUp/res);

  az+=p.rotate[cl]+rng.vary(0,p.rotateV[cl]);
  const cO=cor.clone();
  cO.multiply(_wpQ(_wpYA,az));
  cO.multiply(_wpQ(_wpXA,p.downAngle[cl]+rng.vary(0,p.downAngleV[cl])));

   const Pp=[],Rr=[];
   for(let i=0;i<points.length-1;i+=ringStride){Pp.push(points[i]);Rr.push(radii[i]);}
   Pp.push(points[points.length-1]);
   Rr.push(radii[radii.length-1]);

  fN.push(nrm.clone());fB.push(bin.clone());

   tangentAt(points,i,tan);
   nrm.copy(fN[i-1]).addScaledVector(tan,-fN[i-1].dot(tan));
   if(nrm.lengthSq()<1e-8){
    nrm.crossVectors(tan,_wpUP);
    if(nrm.lengthSq()<1e-6)nrm.crossVectors(tan,_wpXA);
   }
   nrm.normalize();
   bin.crossVectors(nrm,tan).normalize();
   fN.push(nrm.clone());fB.push(bin.clone());
  }

/* leaf cards: base-anchored on terminal twigs, phyllotactic spin, dome normals */
function wpLeafGeo(stems,cfg,rng){

 let cn=0;
 for(const s of stems)if(s.level===s.maxLevel){cc.add(s.points[s.points.length-1]);cn++;}
 if(cn)cc.divideScalar(cn);

 let vb=0;

  if(s.level!==s.maxLevel)continue;

   const t=0.15+0.85*(k+0.5)/cfg.per;
   const sg=t*(s.points.length-1),si=Math.min(s.points.length-2,Math.floor(sg)),st=sg-si;

   q.multiply(_wpQ(_wpYA,az));
   q.multiply(_wpQ(_wpXA,cfg.tilt+rng.vary(0,16)));

   nq.lerp(mid.sub(cc).normalize(),0.6).normalize();

   const corners=[[-S/2,0,0],[S/2,0,0],[S/2,S*1.15,0],[-S/2,S*1.15,0]];
   for(const c2 of corners){
    wp.set(c2[0],c2[1],c2[2]).applyQuaternion(q).add(v);

/* ================= procedural critters — seamless SDF blob wildlife =================
   Each species is ~15 lines of JSON. The body primitives are fused into ONE seamless
   mesh by shrink-wrapping an icosphere onto a smooth-min SDF (no visible seams, blended
   vertex colours, SDF-gradient normals). A single gait system animates walk4 / walk2 /
   hop / float / fly. Add a def to CRITTER_DEFS and spawn it — that's a new animal. */
function blobBody(prims,detail){
 const P=prims.map(p=>({v:new THREE.Vector3(p.x,p.y,p.z),r:p.r,c:new THREE.Color(p.c),
  s:new THREE.Vector3(p.sx||1,p.sy||1,p.sz||1)}));
 const K=0.09;                                   // smooth-min blend radius
 const q=new THREE.Vector3();
 const sd=(x,y,z)=>{                             // smooth-min of ellipsoid SDFs
  let d=1e9;
  for(const p of P){
   q.set((x-p.v.x)/p.s.x,(y-p.v.y)/p.s.y,(z-p.v.z)/p.s.z);
   const di=(q.length()-p.r)*Math.min(p.s.x,Math.min(p.s.y,p.s.z));
   const h=THREE.MathUtils.clamp(0.5+0.5*(d-di)/K,0,1);
   d=d*(1-h)+di*h-K*h*(1-h);
  }
  return d;
 };
 const ctr=new THREE.Vector3();let wsum=0;
 for(const p of P){ctr.addScaledVector(p.v,p.r);wsum+=p.r;}
 ctr.divideScalar(wsum);
 let tMax=0.2;
 for(const p of P)tMax=Math.max(tMax,p.v.distanceTo(ctr)+p.r*Math.max(p.s.x,p.s.y,p.s.z)+K+0.05);
 const geo=new THREE.IcosahedronGeometry(1,detail||3);
 const pos=geo.attributes.position,n=pos.count;
 const cols=new Float32Array(n*3),dir=new THREE.Vector3(),pt=new THREE.Vector3();
 for(let i=0;i<n;i++){
  dir.fromBufferAttribute(pos,i).normalize();
  let a=0,b=tMax;                                // march out from the centre, then bisect
  for(let s=1;s<=28;s++){
   const tt=tMax*s/28;
   if(sd(ctr.x+dir.x*tt,ctr.y+dir.y*tt,ctr.z+dir.z*tt)>=0){b=tt;a=tMax*(s-1)/28;break;}
  }
  for(let s=0;s<7;s++){
   const m=(a+b)/2;
   if(sd(ctr.x+dir.x*m,ctr.y+dir.y*m,ctr.z+dir.z*m)<0)a=m;else b=m;
  }
  pt.copy(ctr).addScaledVector(dir,(a+b)/2);
  pos.setXYZ(i,pt.x,pt.y,pt.z);
  let wr=0,wg=0,wb=0,ws=0;                       // colour = influence-weighted blend
  for(const p of P){
   q.set((pt.x-p.v.x)/p.s.x,(pt.y-p.v.y)/p.s.y,(pt.z-p.v.z)/p.s.z);
   const w=1/Math.pow(Math.max(0.02,q.length()-p.r+K),3);
   wr+=p.c.r*w;wg+=p.c.g*w;wb+=p.c.b*w;ws+=w;
  }
  cols[i*3]=wr/ws;cols[i*3+1]=wg/ws;cols[i*3+2]=wb/ws;
 }
 const nrm=geo.attributes.normal,e=0.012;        // normals from the SDF gradient
 for(let i=0;i<n;i++){
  pt.fromBufferAttribute(pos,i);
  dir.set(sd(pt.x+e,pt.y,pt.z)-sd(pt.x-e,pt.y,pt.z),
          sd(pt.x,pt.y+e,pt.z)-sd(pt.x,pt.y-e,pt.z),
          sd(pt.x,pt.y,pt.z+e)-sd(pt.x,pt.y,pt.z-e)).normalize();
  nrm.setXYZ(i,dir.x,dir.y,dir.z);
 }
 geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
 const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.78}));
 mesh.castShadow=true;
 return mesh;
}

const blobCache={};
function makeCritter(key){
 const D=CRITTER_DEFS[key];

 const body=new THREE.Group();
 g.add(body);
 if(!blobCache[key])blobCache[key]=blobBody(D.body,D.detail);
 const bm=new THREE.Mesh(blobCache[key].geometry,blobCache[key].material);
 bm.castShadow=true;
 body.add(bm);
 const eyeGs=[];
 for(const ep of D.eyes){
  const e=blob(D.eyeR,D.eyeR,D.eyeR,'#16120f',ep[0],ep[1],ep[2],body);
  eyeGs.push(e);
 }
 if(D.beak){
  const bk=new THREE.Mesh(new THREE.ConeGeometry(D.beak.r,D.beak.len,6),smat(D.beak.c));
  bk.rotation.x=Math.PI/2;
  bk.position.set(D.beak.x,D.beak.y,D.beak.z);
  bk.castShadow=true;
  body.add(bk);
 }
 let tail=null;
 if(D.tail){
  tail=new THREE.Group();
  tail.position.set(D.tail.x,D.tail.y,D.tail.z);
  blob(D.tail.r,D.tail.r,D.tail.r,D.tail.c,0,0,0,tail);
  body.add(tail);
 }
 const legs=[];
 if(D.legs)for(const lp of D.legs.pts){
  const leg=new THREE.Group();
  leg.position.set(lp[0],D.legs.len,lp[1]);
  tube(D.legs.r,D.legs.r*0.85,D.legs.len,D.legs.c,0,-D.legs.len/2,0,leg);
  g.add(leg);

 }
 const wings=[];
 if(D.wings){
  for(const s of[-1,1]){
   const w=new THREE.Group();
   w.position.set(D.wings.x*s,D.wings.y,D.wings.z);
   const wm=blob(D.wings.sx,D.wings.sy,D.wings.sz,D.wings.c,D.wings.sx*0.8*s,0,0,w);
   wings.push(w);
   body.add(w);

 }

 cs.scale.set(0.45,0.32,1);

function updateCritters(dt,t){
 for(const c of critters){
  const D=c.def,P=c.p;
  // day/night: most wildlife sleeps at night; deer stay out through dusk
  const awake=D.dusky?nightNow<0.85:nightNow<0.55;
  P.group.visible=awake;
  if(!awake)continue;
  const pd=Math.hypot(player.pos.x-c.x,player.pos.z-c.z);
  /* -------- behaviour states -------- */
  if(D.fleeR&&c.mode!=='flee'&&pd<D.fleeR&&Math.abs(player.speed)>3){
   c.mode='flee';c.timer=2.2+Math.random();
  }
  c.timer-=dt;
  if(c.mode==='flee'){
   const away=Math.atan2(c.x-player.pos.x,c.z-player.pos.z);
   c.heading+=(THREE.MathUtils.euclideanModulo(away-c.heading+Math.PI,Math.PI*2)-Math.PI)*Math.min(1,dt*6);
   c.speed=D.fleeSpeed||D.speed*2.4;
   if(c.timer<=0){c.mode='idle';c.timer=1+Math.random()*2;}
  }else if(c.mode==='wander'){
   const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz);
   if(d<0.5||c.timer<=0){c.mode=Math.random()<0.55?'graze':'idle';c.timer=2.5+Math.random()*5;c.speed=0;}
   else{
    const want=Math.atan2(dx,dz);
    c.heading+=(THREE.MathUtils.euclideanModulo(want-c.heading+Math.PI,Math.PI*2)-Math.PI)*Math.min(1,dt*3);
    c.speed=D.speed;
   }
  }else{ // idle / graze
   c.speed=0;
   if(c.timer<=0){
    c.mode='wander';c.timer=8+Math.random()*6;
    const hd=Math.hypot(c.x-c.home.x,c.z-c.home.z);
    if(hd>c.home.r){c.tx=c.home.x;c.tz=c.home.z;}                 // drift back home
    else{const a=Math.random()*Math.PI*2,rr=2+Math.random()*c.home.r;
     c.tx=c.home.x+Math.cos(a)*rr;c.tz=c.home.z+Math.sin(a)*rr;}
   }
  }
  /* -------- locomotion & gait -------- */
  if(D.gait==='float'){                       // ducks paddle the river
   c.heading+=Math.sin(t*0.23+c.phase)*dt*0.5;
   c.x+=Math.sin(c.heading)*D.speed*dt;
   c.x=THREE.MathUtils.clamp(c.x,c.home.x-c.home.r,c.home.x+c.home.r);
   const zc=riverZ(c.x);
   c.z+=(zc+(Math.sin(c.phase)*2)-c.z)*Math.min(1,dt*1.1);
   c.y=rawH(c.x,zc)+0.55+Math.sin(t*1.3+c.phase)*0.02;
   P.group.rotation.z=Math.sin(t*1.1+c.phase)*0.05;
  }else if(D.gait==='fly'){                   // bluebirds hop between perch spots
   if(!c.fly&&c.mode==='wander'){
    c.fly={fx:c.x,fz:c.z,fy:groundH(c.x,c.z),t:0,
     dur:Math.max(1.2,Math.hypot(c.tx-c.x,c.tz-c.z)/D.speed)};
   }
   if(c.fly){
    c.fly.t+=dt;
    const p01=Math.min(1,c.fly.t/c.fly.dur);
    c.x=THREE.MathUtils.lerp(c.fly.fx,c.tx,p01);
    c.z=THREE.MathUtils.lerp(c.fly.fz,c.tz,p01);
    const gy=groundH(c.x,c.z);
    c.y=THREE.MathUtils.lerp(c.fly.fy,gy,p01)+Math.sin(Math.PI*p01)*3.2-gy;
    c.heading=Math.atan2(c.tx-c.fly.fx,c.tz-c.fly.fz);
    if(p01>=1){c.fly=null;c.mode='graze';c.timer=2.5+Math.random()*4;}
   }else c.y=0;
   const flap=c.fly?Math.sin(t*26+c.phase)*0.85:0.12+Math.sin(t*2+c.phase)*0.04;
   if(P.wings.length){P.wings[0].rotation.z=-flap;P.wings[1].rotation.z=flap;}
  }else{                                      // ground gaits share the mover
   c.x+=Math.sin(c.heading)*c.speed*dt;
   c.z+=Math.cos(c.heading)*c.speed*dt;
   c.y=0;
  }
  c.phase+=dt*(2.4+c.speed*2.6);
  const moving=c.speed>0.05;
  if(D.gait==='walk4'&&P.legs.length===4){
   for(let i=0;i<4;i++)P.legs[i].rotation.x=moving?Math.sin(c.phase+(i===0||i===3?0:Math.PI))*0.55:0;
   P.body.position.y=moving?Math.abs(Math.sin(c.phase*2))*0.02:0;
  }else if(D.gait==='walk2'&&P.legs.length===2){
   P.legs[0].rotation.x=moving?Math.sin(c.phase)*0.7:0;
   P.legs[1].rotation.x=moving?-Math.sin(c.phase)*0.7:0;
   P.body.rotation.z=moving?Math.sin(c.phase)*0.07:0;
   P.body.position.z=moving?Math.abs(Math.sin(c.phase))*0.02:0;
  }else if(D.gait==='hop'){
   const h=moving?Math.max(0,Math.sin(c.phase*1.6)):0;
   c.y+=h*0.22;
   P.body.scale.y=1-(moving?Math.max(0,Math.sin(c.phase*1.6+Math.PI))*0.12:0);
   for(const lg of P.legs)lg.rotation.x=moving?-h*0.9:0;
  }
  /* -------- shared juice: graze lean, blinking, tail wag -------- */
  const leanT=(c.mode==='graze'&&!moving)?(D.gait==='walk2'?0.5+Math.sin(t*7+c.phase)*0.12:0.34+Math.sin(t*1.4+c.phase)*0.04):0;
  P.body.rotation.x+=(leanT-P.body.rotation.x)*Math.min(1,dt*5);
  c.blink-=dt;
  if(c.blink<-0.13)c.blink=2.5+Math.random()*4;
  const es=c.blink<0?0.12:1;
  for(const e of P.eyes)e.scale.y=P.def.eyeR*es;
  if(P.tail)P.tail.rotation.y=Math.sin(t*(moving?9:2.2)+c.phase)*(moving?0.5:0.15);
  P.group.position.set(c.x,(D.gait==='float'?c.y:groundH(c.x,c.z)+c.y),c.z);
  P.group.rotation.y=c.heading;
 }
}

/* Stylized pegasus wing — layered geometric feathers (primaries + coverts) fanning
   back from the withers. Pivot flaps via rotation.z (driven in animateHorse). */
function buildPegasusWing(sgn){
 const piv=new THREE.Group();
 piv.position.set(sgn*0.18,1.22,0.15);
 const wing=new THREE.Group();          // built +X-out, fanning back; mirrored by sgn
 const FG=new THREE.SphereGeometry(0.5,8,5);
 const mW=new THREE.MeshStandardMaterial({color:0xf8fbff,roughness:0.55,metalness:0,side:THREE.DoubleSide});
 const mB=new THREE.MeshStandardMaterial({color:0xdfe7f4,roughness:0.66,metalness:0,side:THREE.DoubleSide});
 // feather: length L, width W, fan-angle a (deg, 0=out +X -> 90=back -Z), row lift dy, depth dz.
 // Rows are stacked in y AND pushed back in z so they OVERLAP (depth), not coplanar.
 const mk=(L,W,mat,aDeg,dy,dz)=>{const m=new THREE.Mesh(FG,mat);m.scale.set(L,0.05,W);
  const a=aDeg*Math.PI/180;
  m.position.set(Math.cos(a)*L*0.5, dy||0, -Math.sin(a)*L*0.5+(dz||0));
  m.rotation.y=a; m.castShadow=true; wing.add(m);};
 // primaries — long, low/back row (the main fan)
 [[1.22,6],[1.48,20],[1.68,34],[1.76,48],[1.68,62],[1.48,76],[1.24,90],[0.98,104]].forEach(([L,a],i)=>mk(L,0.21,i%2?mB:mW,a,0,0));
 // secondaries — mid row, lifted + set back (creates thickness/overlap)
 [[0.94,12],[1.06,28],[0.98,46],[0.82,64],[0.62,82]].forEach(([L,a],i)=>mk(L,0.20,i%2?mW:mB,a,0.13,0.06));
 // coverts — short top row, more lift + forward (the leading shoulder mass)
 [[0.62,18],[0.70,38],[0.58,58],[0.46,78]].forEach(([L,a],i)=>mk(L,0.18,i%2?mB:mW,a,0.26,0.12));
 // scapular tuft — fills the wing root so it doesn't sprout from a single point
 [[0.42,34],[0.36,56]].forEach(([L,a],i)=>mk(L,0.17,mW,a,0.34,0.18));
 wing.scale.set(sgn,1,1);
 wing.rotation.x=-0.34;          // tilt the fan plane so the wing ARCS up-and-back (not a flat horizontal fan)
 piv.add(wing);
 piv.userData.sgn=sgn;
 piv.userData.mats=[mW,mB];      // exposed so mythic coats can tint the wings (see tintWings)
 piv.rotation.z=sgn*0.42;
 return piv;
}

function makeGate(x,z,rotY){

function startCourse(ev){
 cancelCourse();
 const jumps3=[];
 let par;
 if(ev.race){
  let pts=RACE_ROUTES[ev.route].map(p=>p.slice());
  if(ev.rev)pts=pts.slice().reverse();
  let len=0;
  pts.forEach((p,i)=>{
   const nx=pts[(i+1)%pts.length];
   len+=Math.hypot(nx[0]-p[0],nx[1]-p[1]);
   const rotY=Math.atan2(nx[0]-p[0],nx[1]-p[1]);
   const made=makeGate(p[0],p[1],rotY);
   const num=nameSprite(String(i+1));
   num.position.y=3.0;
   num.scale.set(1.1,0.34,1);
   made.g.add(num);
   jumps3.push({x:p[0],z:p[1],rotY,g:made.g,ring:made.ring,prevSide:0});
  });
  par=len/7.2;
 }else{
  const N=ev.n;
  const cx=2,cz=1,A=Math.min(17,11+N*0.6),B=Math.min(13,8+N*0.5);
  for(let i=0;i<N;i++){
   const th=i/N*Math.PI*2+0.4;
   const x=cx+Math.cos(th)*A,z=cz+Math.sin(th)*B;
   const rotY=Math.atan2(-A*Math.sin(th),B*Math.cos(th));
   const g=new THREE.Group();
   box(0.17,1.1,0.17,paintMat('#2e86c1'),-1.5,0.55,0,g);
   box(0.17,1.1,0.17,paintMat('#2e86c1'),1.5,0.55,0,g);

   box(3,0.13,0.1,whitePaintMat,0,0.9,0,g);
   const num=nameSprite(String(i+1));
   num.position.y=1.7;
   num.scale.set(1.1,0.34,1);
   g.add(num);
   g.position.set(x,groundH(x,z),z);
   g.rotation.y=rotY;
   scene.add(g);
   jumps3.push({x,z,rotY,g,prevSide:0});
  }
  par=N*9;
 }
 course={ev,jumps:jumps3,idx:0,t:0,cd:3.6,started:false,faults:0,race:!!ev.race,par};
 setPracticeJumps(false);        // clear the arena so only the numbered course is standing
 $('eventsPanel').style.display='none';
 $('courseHud').style.display='flex';
 $('courseHudTxt').textContent='🏆 '+ev.name+' — get ready!';
 if(net.client&&net.client.connected)netSendChat('🏁 started '+ev.name+' — join from 🏆 Events and race me!');
}
function cancelCourse(){
 if(!course)return;
 /* Course fences are built fresh per event and were only unparented, so every event
    entered, quit or replayed leaked its geometries and its numbered-sign canvas texture.
    Materials from smat()/paintMat() are shared caches — leave those alone. */
 for(const j of course.jumps){
  scene.remove(j.g);
  j.g.traverse(o=>{
   if(o.isMesh&&o.geometry)o.geometry.dispose();
   if(o.isSprite&&o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}
  });
 }
 setPracticeJumps(true);
 course=null;
 arrow.visible=false;
 $('courseHud').style.display='none';
 $('countdown').style.display='none';
}

function drawBigMap(){
 const mc=$('bigmap').getContext('2d');
 const S=560/700;
 const W2=(x,z)=>[280+x*S,280+z*S];
 mc.fillStyle='#5d8c4f';mc.fillRect(0,0,560,560);
 const zone=(x,z,r,c)=>{
  const q=W2(x,z);
  const g=mc.createRadialGradient(q[0],q[1],8,q[0],q[1],r*S);
  g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
  mc.fillStyle=g;mc.fillRect(0,0,560,560);
 };
 zone(-220,130,170,'rgba(217,162,118,0.75)');
 zone(220,-110,150,'rgba(232,224,154,0.55)');
 zone(-160,-210,170,'rgba(238,242,240,0.6)');
 mc.strokeStyle='#4f9ad6';mc.lineWidth=6;mc.lineCap='round';
 mc.beginPath();
 for(let x=-340;x<=340;x+=16){
  const q=W2(x,riverZ(x));
  x===-150?mc.moveTo(q[0],q[1]):mc.lineTo(q[0],q[1]);
 }
 mc.stroke();
 mc.fillStyle='#d9c49a';
 const aq=W2(0,0);
 mc.beginPath();mc.ellipse(aq[0],aq[1],23.5*S,18.5*S,0,0,7);mc.fill();
 mc.strokeStyle='#fff';mc.lineWidth=2;
 mc.strokeRect(280-25*S,280-20*S,50*S,40*S);
 mc.strokeRect(280+PAST.x1*S,280+PAST.z1*S,(PAST.x2-PAST.x1)*S,(PAST.z2-PAST.z1)*S);
 const pq=W2(20,16);
 mc.fillStyle='#4f9ad6';mc.beginPath();mc.arc(pq[0],pq[1],4.5*S,0,7);mc.fill();
 mc.fillStyle='#b96b38';
 [[42,-50],[48,-56],[54,-48],[45,-43]].forEach(cc=>{
  const q=W2(cc[0],cc[1]);mc.fillRect(q[0]-3,q[1]-3,6,6);
 });
 if(course){
  mc.strokeStyle='rgba(255,209,102,0.85)';mc.lineWidth=2.5;
  mc.beginPath();
  course.jumps.forEach((j,i)=>{const q=W2(j.x,j.z);i?mc.lineTo(q[0],q[1]):mc.moveTo(q[0],q[1]);});

function remoteUpdate(m){
 if(typeof m.x!=='number'||typeof m.z!=='number')return;
 let r=remotes[m.id];
 if(!r){
  if(Object.keys(remotes).length>=12)return;
  const parts=makeHorse({colors:(m.c&&m.c.body)?m.c:{body:'#8a5a2b',mane:'#332214'},tack:m.k||'#7a583a',bridle:true,seed:5,wings:!!m.wg,coat:m.ct||null});
  const rider=makeRider({shirt:m.s||'#c98c5a',pants:m.p||'#4a4338'});
  parts.group.add(rider.g);
  const nm=String(m.n||'Rider').slice(0,14);
  const tag=nameSprite((isFriend(nm)?'💚':'🌐')+nm);
  tag.position.y=3.15;
  parts.group.add(tag);
  scene.add(parts.group);
  r=remotes[m.id]={parts,rider,name:nm,x:m.x,z:m.z,tx:m.x,tz:m.z,heading:m.h||0,sp:0,phase:Math.random()*6,lastSeen:0};
  chatMsg('🌐',nm+' is riding nearby!');
 }
 r.tx=m.x;r.tz=m.z;
 r.theading=m.h||0;
 r.sp=m.sp||0;
 r.lastSeen=0;
 if(m.c&&m.c.body)r.colors=m.c;
 if(m.hn)r.horseName=m.hn;
 if(m.b)r.breed=m.b;
 r.wings=!!m.wg;
 if(m.ct)r.coat=m.ct;
 if(m.hl)r.horseLv=m.hl;
}
function netTick(dt,t){
 if(!SOCIAL)return;
 if(net.client&&net.club&&t-net.lastPub>0.15){
  net.lastPub=t;
  const s=freshSave();
  const h=s&&s.horses[rideIdx];
  try{
   net.client.publish('srf1/'+net.club+'/pos',JSON.stringify({
    id:net.id,n:myName(),x:+player.pos.x.toFixed(1),z:+player.pos.z.toFixed(1),
    h:+player.heading.toFixed(2),sp:+Math.abs(player.speed).toFixed(1),
    c:h?h.colors:null,k:h?(h.tack||'#7a583a'):null,
    s:(s.rider&&s.rider.shirt)||'#c98c5a',p:(s.rider&&s.rider.pants)||'#4a4338',
    hn:h?String(h.name).slice(0,14):null,b:h?(h.breed||null):null,hl:h?(h.level||1):1,wg:!!(h&&h.wings),ct:h?(h.coat||null):null,
   }));
  }catch(e){}
 }
 for(const id of Object.keys(remotes)){
  const r=remotes[id];
  r.lastSeen+=dt;
  if(r.lastSeen>7){
   scene.remove(r.parts.group);
   delete remotes[id];
   continue;
  }
  r.x+=(r.tx-r.x)*Math.min(1,dt*5);
  r.z+=(r.tz-r.z)*Math.min(1,dt*5);
  if(typeof r.theading==='number'){
   let dh=r.theading-r.heading;
   while(dh>Math.PI)dh-=Math.PI*2;
   while(dh<-Math.PI)dh+=Math.PI*2;
   r.heading+=dh*Math.min(1,dt*6);
  }
  r.phase+=dt*(2.2+r.sp*1.9);
  const g3=gaitFor(r.sp);
  animateHorse(r.parts,r.phase,r.sp<0.2?0:g3.amp,g3,true,t,0,dt);
  r.parts.group.position.set(r.x,groundH(r.x,r.z),r.z);
  r.parts.group.rotation.y=r.heading;
  r.rider.g.rotation.x=-0.1;
 }
}

function updatePet(dt,t){
 if(!petComp)return;
 const off=2.2;
 const bx=player.pos.x-Math.sin(player.heading)*off+Math.cos(player.heading)*0.9;
 const bz=player.pos.z-Math.cos(player.heading)*off-Math.sin(player.heading)*0.9;
 const dx=bx-petComp.pos.x,dz=bz-petComp.pos.z,d=Math.hypot(dx,dz);
 if(d>40){petComp.pos.set(bx,0,bz);}      // catch up after fast travel
 let sp=0;
 if(d>0.6){
  const want=Math.atan2(dx,dz);let dh=want-petComp.heading;
  while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
  petComp.heading+=dh*Math.min(1,dt*7);
  sp=Math.min(11,1.4+d*0.7);
  petComp.pos.x+=Math.sin(petComp.heading)*sp*dt;
  petComp.pos.z+=Math.cos(petComp.heading)*sp*dt;
 }
 petComp.phase+=dt*(3+sp*2.2);
 const hop=sp>0.3?Math.abs(Math.sin(petComp.phase))*0.06*Math.min(1,sp/4):0;
 petComp.parts.group.position.set(petComp.pos.x,groundH(petComp.pos.x,petComp.pos.z)+hop,petComp.pos.z);
 petComp.parts.group.rotation.y=petComp.heading;
 const L=petComp.parts.legs;
 for(let i=0;i<4;i++){const o=i<2?0:Math.PI;L[i].rotation.x=Math.sin(petComp.phase+(i%2?Math.PI:0)+o)*0.5*Math.min(1,sp/3);}
 petComp.parts.tail.rotation.z=Math.sin(t*6)*0.25;  // happy wag
}

// long-haul variants share their hooks with the base types
function dailyTypeAliases(type){return type==='gallop'?['gallop','gallop2k']:type==='feed'?['feed','feed6']:[type];}
function todayDaily(){
 const ds=new Date().toDateString();
 let h=0;for(let i=0;i<ds.length;i++)h=(h*31+ds.charCodeAt(i))|0;
 const idx=[];let k=Math.abs(h)||1;
 while(idx.length<3){k=(k*1103515245+12345)%2147483647;const j=k%DAILYQ.length;if(!idx.includes(j))idx.push(j);}
 return idx.map(i=>DAILYQ[i]);
}
function ensureDq(s){
 const ds=new Date().toDateString();
 if(!s.dq||s.dq.date!==ds)s.dq={date:ds,prog:{},claimed:{}};
}
function dailyEvt(type,val){
 val=val||1;
 const today=todayDaily();
 for(const ty of dailyTypeAliases(type)){
  const q=today.find(q=>q.type===ty);
  if(!q)continue;
  let crossed=false;
  syncSave(s=>{
   ensureDq(s);
   const before=s.dq.prog[ty]||0;
   if(s.dq.claimed[ty]||before>=q.goal)return;
   s.dq.prog[ty]=Math.min(q.goal,before+val);
   crossed=before<q.goal&&s.dq.prog[ty]>=q.goal;
  });
  if(crossed)toast('📋 Daily quest done: '+q.label+' — claim it in 📜 Quests!');
 }
}
function claimDaily(type){
 const q=todayDaily().find(q=>q.type===type);if(!q)return;
 let ok=false;
 syncSave(s=>{
  ensureDq(s);
  if(s.dq.claimed[type]||(s.dq.prog[type]||0)<q.goal)return;
  s.dq.claimed[type]=true;
  if(q.r.c)s.coins+=q.r.c;
  if(q.r.g)s.gems+=q.r.g;
  if(q.r.p){s.pass=s.pass||{pts:0};s.pass.pts+=q.r.p;}
  ok=true;
 });
 if(ok){refreshWallet();sChime();toast('📋 +'+(q.r.c||0)+'🪙'+(q.r.g?' +'+q.r.g+'💎':'')+(q.r.p?' +'+q.r.p+'🎟️':''));renderQuests();}
}

/* `len` is stride length in metres — the ground covered by one full leg cycle. Driving the
   cycle from distance/len instead of from a clock is what stops the hooves skating: the
   stance hoof now travels backwards at very close to -v, which is the definition of a
   planted foot. Time-driven phase made the legs churn ~40% too fast at a gallop. */
const GAITS={
 walk:{off:[0,Math.PI,Math.PI*0.5,Math.PI*1.5],amp:0.42,rate:1.6,len:1.7},
 trot:{off:[0,Math.PI,Math.PI,0],amp:0.62,rate:1.9,len:2.7},
 gallop:{off:[0,0.45,Math.PI+0.3,Math.PI],amp:0.95,rate:1.55,len:5.8},
};

function animateHorse(parts,phase,amp,gait,grounded,t,grazing,dt){

 for(let i=0;i<4;i++){
  const o=gait.off[i];
  const swing=Math.sin(phase+o)*amp*(i<2?0.55:0.6);
  const lift=Math.max(0,Math.sin(phase+o+Math.PI*0.5));
  const hip=parts.legs[i].hip,knee=parts.legs[i].knee;
  hip.rotation.x+=(swing-hip.rotation.x)*k;
  knee.rotation.x+=((grounded?-lift*amp*1.15:-0.55)-knee.rotation.x)*k;
 }

 parts.tail.rotation.z=Math.sin(phase*0.4+1)*0.12;
 if(parts.wings){
  const pow=parts.wingPow||0;
  for(const w of parts.wings){
   const sgn=w.userData.sgn;
   const flap=grounded
    ?Math.sin(t*2.1)*0.06+Math.sin(phase)*0.05*amp
    :Math.sin(t*(6.5+pow*4.5))*(0.38+0.4*pow);
   w.rotation.z=sgn*(0.54+(grounded?flap:0.1+0.12*(1-pow)+flap));   // higher dihedral -> wings arc up, clear the rider

}

 /* minimap */
 {

<script>
(()=>{
 const src=document.getElementById('gameModule');
 if(!src)return;
 if(location.protocol==='file:'){
  window.__gameModuleBlocked=true;
  const ld=document.getElementById('load');
  if(ld)ld.innerHTML='Start a local web server, then open ranch3d.html.<br>Example: python -m http.server 8431';
  return;
 }
 const runner=document.createElement('script');
 runner.type='module';
 runner.textContent=src.textContent;
 src.after(runner);
})();
</script>
<script>
setTimeout(()=>{
 if(window.__gameModuleBlocked)return;

 if(ld)ld.innerHTML='Hmm, the 3D engine could not load.<br>Check that the local game assets are present and try refreshing.';
},9000);
</script>
