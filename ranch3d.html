<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="description" content="Ride, care for and breed horses across an open 3D ranch world. Runs in your browser — and in VR.">

<title>Meadowlark Ranch 🐴✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐴</text></svg>">
<style>
/* ================= Meadowlark UI 3 =================
   One paper-and-leather palette, two typefaces (Fredoka for titles, Nunito for everything
   else, both bundled), glass surfaces with a single shadow language, and a HUD laid out the
   way a rider reads it: the horse top-left, the quest top-centre, the wallet top-right, the
   actions in a dock along the bottom. Every id the game writes to is unchanged. */
@font-face{font-family:"Fredoka";src:url("assets/fonts/fredoka.woff2") format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Nunito";src:url("assets/fonts/nunito.woff2") format("woff2");font-weight:400 900;font-display:swap}
:root{
 --ink:#3b2a1e;--ink-2:#6b5a49;--ink-3:#9a8770;
 --paper:#fffaf1;--paper-2:#f6ecd9;--paper-3:#efe1c6;--line:#e6d6b8;--line-2:#d4bf93;
 --gold:#e0b25a;--gold-2:#c8952f;--gold-3:#fff0c2;--green:#5fb56a;--green-2:#3f8f4c;--sky:#7fb8e6;--rose:#e88aa8;--red:#d9534f;
 --glass:rgba(255,250,241,.80);--dark:rgba(43,30,20,.88);
 --r-s:12px;--r:18px;--r-l:24px;
 --sh-1:0 2px 6px rgba(50,32,10,.14);--sh-2:0 10px 30px rgba(50,32,10,.22);--sh-3:0 30px 80px rgba(40,25,5,.38);
 --font:"Nunito","Trebuchet MS",sans-serif;--display:"Fredoka","Nunito","Trebuchet MS",sans-serif;
 --tb:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;font-family:var(--font);color:var(--ink)}
canvas{display:block}
/* ---- surfaces ---- */
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border:1px solid rgba(255,255,255,.75);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.85)}
.chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;font-weight:700;color:var(--ink);box-shadow:var(--sh-1);white-space:nowrap;font-size:13px}
/* ---- controls ---- */
select,button,a.btn{font-family:var(--font);font-weight:700;font-size:13.5px;color:var(--ink);background:linear-gradient(#fffaf0,#f1e2c4);border:1.5px solid var(--line-2);border-radius:var(--r-s);padding:7px 12px;cursor:pointer;box-shadow:inset 0 1px 0 #fff,var(--sh-1);transition:transform .12s,box-shadow .15s,filter .15s,background .15s;text-decoration:none;line-height:1.2}
button:hover,a.btn:hover,select:hover{transform:translateY(-1px);filter:brightness(1.04);box-shadow:inset 0 1px 0 #fff,0 5px 12px rgba(50,32,10,.2)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none;filter:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid rgba(224,178,90,.55);outline-offset:1px}
.claimBtn{background:linear-gradient(#ffe7a6,#e9bb52);border-color:var(--gold-2);color:#4a3210}
button.ico{width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
/* ---- HUD: wallet + system (top-right) ---- */
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
#hud *{pointer-events:auto}
#wallet{display:flex;gap:14px;align-items:center;padding:7px 16px;border-radius:999px}
#wallet .w{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em}
#wallet .w i{font-style:normal;font-size:15px}
#sysBtns{display:flex;gap:6px}
#vrBtn{top:calc(58px + env(safe-area-inset-top))!important;right:calc(12px + env(safe-area-inset-right))!important;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7);border-radius:999px;font-size:13px}
#sysBtns button{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7)}
/* ---- HUD: the horse card (top-left) ---- */
#statusCard{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:6;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:20px;width:250px;color:var(--ink)}
#scTop{display:flex;align-items:center;gap:10px;position:relative}
#scPortrait{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #fff;box-shadow:0 3px 9px rgba(50,32,10,.3);flex:none}
#gaitEl{position:absolute;left:36px;top:34px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid #fff;box-shadow:var(--sh-1);font-size:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#scInfo{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
#scName{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
#horseSel{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--paper-2);border-color:var(--line);box-shadow:none;width:100%}
.scbars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scb{height:7px;border-radius:4px;background:rgba(59,42,30,.12);overflow:hidden}
.scb i{display:block;height:100%;border-radius:4px;transition:width .4s}
#scXp{height:5px;border-radius:3px;background:rgba(59,42,30,.12);overflow:hidden}
#scXp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd97a)}
#scBtns{display:flex;gap:6px}
#scBtns button{flex:1;height:34px;padding:0;border-radius:12px;font-size:16px}
#nameEl{display:none}
/* ---- HUD: quest pill, course capsule, stamina (top-centre) ---- */
#questTrack{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;color:var(--ink);max-width:min(46vw,520px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--sh-1)}
#courseHud{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:var(--dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff8ea;padding:9px 18px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,248,234,.18);box-shadow:var(--sh-2)}
#courseHud button{padding:3px 10px;border-radius:999px;font-size:12px}
#stamWrap{position:fixed;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;width:170px;height:8px;border-radius:6px;background:rgba(43,30,20,.55);border:1px solid rgba(255,248,234,.6);display:none;overflow:hidden}
#stamFill{height:100%;width:100%;background:linear-gradient(90deg,#7fd07a,#b5e88a);border-radius:6px;transition:width .12s linear}
#stamWrap.blown #stamFill{background:linear-gradient(90deg,#e06a5a,#ff9a7a)}
#countdown{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);z-index:8;font-family:var(--display);font-size:110px;font-weight:700;color:#fff8ea;text-shadow:0 6px 24px rgba(40,25,5,.55),0 0 2px rgba(0,0,0,.4);display:none;letter-spacing:.02em}
/* ---- the dock (bottom-centre) ---- */
#dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:6px;border-radius:20px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock button{background:transparent;border:1px solid transparent;box-shadow:none;border-radius:14px;padding:9px 13px;font-size:13.5px;font-weight:700;white-space:nowrap}
#dock button:hover{background:rgba(224,178,90,.18);border-color:rgba(224,178,90,.35);transform:translateY(-2px);box-shadow:none;filter:none}
#dock button:active{transform:translateY(0) scale(.96)}
#dock .badge{margin-left:4px;vertical-align:1px}
/* ---- prompts, hints, toasts ---- */
#hint{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;background:var(--dark);color:#fff8ea;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:opacity 1s;pointer-events:none;border:1px solid rgba(255,248,234,.15)}
#ctx{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:7;background:var(--dark);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff8ea;padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;display:none;border:1px solid rgba(255,248,234,.22);box-shadow:var(--sh-2);animation:rise .18s ease}
#tameHud{position:fixed;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:var(--dark);color:#fff8ea;padding:8px 16px;border-radius:999px;font-weight:700;display:none}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top));z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--dark);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff8ea;padding:9px 16px 9px 14px;border-radius:14px;font-size:14px;font-weight:600;border-left:4px solid var(--gold);box-shadow:var(--sh-2);animation:rise .22s ease;max-width:min(560px,92vw)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes rise{from{transform:translateY(8px) scale(.96)}to{transform:translateY(0) scale(1)}}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
/* ---- loading ---- */
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 8%,#c6e4f7 0%,#a9cfe8 40%,#8fbf6a 100%);color:#2f4a5e;font-family:var(--display);font-size:30px;font-weight:600;z-index:30;text-align:center;letter-spacing:.01em}
#loadbar{width:220px;height:8px;margin:16px auto 0;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
#loadbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#ffe6a8);border-radius:99px;transition:width .25s ease}
#loadpct{margin-top:8px;font-family:var(--font);font-size:13px;font-weight:700;opacity:.7}
/* ---- panels ---- */
#eventsPanel,#carePanel,#shopPanel,#onlinePanel,#lbPanel,#buildPanel,#stablePanel,#questPanel,#profilePanel{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:10;background:linear-gradient(180deg,#fffdf7,#fbf3e3);border:1px solid rgba(255,255,255,.8);border-radius:var(--r-l);padding:16px 16px 18px;display:none;flex-direction:column;gap:8px;max-height:min(74vh,760px);overflow:auto;width:min(470px,94vw);color:var(--ink);box-shadow:var(--sh-3),inset 0 1px 0 #fff;animation:panelIn .22s ease;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
@keyframes panelIn{from{transform:translateX(-50%) translateY(-14px) scale(.985)}to{transform:translateX(-50%) translateY(0) scale(1)}}   /* transform only: an entrance must never leave a panel invisible if the timeline stalls */
#eventsPanel::-webkit-scrollbar,#shopPanel::-webkit-scrollbar,#stablePanel::-webkit-scrollbar,#questPanel::-webkit-scrollbar,#lbPanel::-webkit-scrollbar,#carePanel::-webkit-scrollbar,#buildPanel::-webkit-scrollbar,#onlinePanel::-webkit-scrollbar{width:8px}
#eventsPanel::-webkit-scrollbar-thumb,#shopPanel::-webkit-scrollbar-thumb,#stablePanel::-webkit-scrollbar-thumb,#questPanel::-webkit-scrollbar-thumb,#lbPanel::-webkit-scrollbar-thumb,#carePanel::-webkit-scrollbar-thumb,#buildPanel::-webkit-scrollbar-thumb,#onlinePanel::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
.ph,#eventsPanel>b:first-child,#lbPanel>b:first-child,#onlinePanel>b:first-child,#carePanel>b:first-child{font-family:var(--display);font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;padding-bottom:6px;letter-spacing:.01em;color:var(--ink)}
.ph .chip{font-family:var(--font);font-size:12px}
.evrow{display:flex;align-items:center;gap:9px;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:9px 12px;background:#fff;box-shadow:0 1px 2px rgba(50,32,10,.05);transition:transform .12s,box-shadow .15s}
.evrow:hover{transform:translateX(2px);box-shadow:0 4px 12px rgba(50,32,10,.12)}
.evrow span{color:var(--ink-2);font-size:12px;flex:1;font-weight:600}
.evrow b{font-weight:800}
.evrow.done{border-color:#bfe0a4;background:linear-gradient(180deg,#fff,#f4fbea)}
.crow{display:flex;align-items:center;gap:8px;font-size:13px}
.crow .lbl{min-width:68px;max-width:150px;font-weight:700;color:var(--ink-2);font-size:12px;line-height:1.2}
.crow:has(> .tabbtn){background:var(--paper-2);border-radius:999px;padding:4px;gap:2px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabbtn{background:transparent;border:1px solid transparent;box-shadow:none;border-radius:999px;padding:6px 13px;color:var(--ink-2);font-size:13px}
.tabbtn:hover{transform:none;background:rgba(255,255,255,.6);filter:none;box-shadow:none}
.tabbtn.on{background:var(--ink);color:#fff8ea;border-color:var(--ink);box-shadow:var(--sh-1)}
.cbar{flex:1;height:10px;background:rgba(59,42,30,.1);border-radius:6px;overflow:hidden}
.cfill{height:100%;border-radius:6px;transition:width .3s}
.badge{background:linear-gradient(#ffe39a,var(--gold));color:#4a3210;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800;box-shadow:var(--sh-1)}
.qrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:9px 12px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(50,32,10,.05)}
.qrow .qico{font-size:22px;width:32px;text-align:center}
.qrow .qmain{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.qbar{height:8px;background:rgba(59,42,30,.1);border-radius:6px;overflow:hidden}
.qfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),#ffd97a);transition:width .3s}
.qrow.done{border-color:#bfe0a4;background:linear-gradient(180deg,#fff,#f1f9e6)}
.qrow.claimed{opacity:.55}
/* ---- dialogue ---- */
#dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;background:linear-gradient(180deg,#fffdf7,#fbf3e3);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:18px 20px 16px;width:min(440px,92vw);color:var(--ink);display:none;box-shadow:var(--sh-3);animation:pop .2s ease}
#dlg>b{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--paper-2);border-radius:999px;padding:4px 12px;margin-bottom:6px}
#dlg p{line-height:1.5;font-size:15px;margin:8px 0}
#dlg button{margin-top:4px}
/* ---- chat ---- */
#chatFeed{position:fixed;left:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;gap:4px;max-width:min(340px,70vw);pointer-events:none}
#chatFeed div{background:var(--dark);color:#fff8ea;padding:6px 12px;border-radius:12px;font-size:13px;font-weight:600;overflow-wrap:break-word}
#chatBar{position:fixed;left:16px;bottom:calc(110px + env(safe-area-inset-bottom));z-index:8;display:none;gap:6px;width:min(360px,72vw)}
#chatBar input{flex:1;font-family:var(--font);font-size:14px;padding:8px 12px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--paper)}
/* ---- map, minimap, build, free camera ---- */
#mini{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:calc(16px + env(safe-area-inset-left));z-index:6;border:3px solid rgba(255,250,241,.92);border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
#bigmapWrap{position:fixed;inset:0;background:rgba(30,40,25,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:25;display:none;align-items:center;justify-content:center}
#bigmap{border:4px solid #f3e6c6;border-radius:24px;box-shadow:var(--sh-3);max-width:92vw;max-height:80vh}
#ftBar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:92vw;margin-top:12px}
#ftBar button{font-size:13px;padding:6px 12px;background:var(--glass);border-color:rgba(255,255,255,.7)}
#buildHud{display:none;position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);border-radius:14px;padding:9px 14px;color:var(--ink);font-weight:700;font-size:13px;box-shadow:var(--sh-2);max-width:94vw;text-align:center}
#buildHud button{margin-left:6px}
#buildHud.bad{border-color:var(--red);color:#a33}
body.freecam #hud,body.freecam #hint,body.freecam #questTrack,body.freecam #mini,body.freecam #ctx,body.freecam #statusCard,body.freecam #stamWrap,body.freecam #touch,body.freecam #stickZone,body.freecam #chatFeed,body.freecam #tameHud,body.freecam #dock{display:none!important}
#fcHint{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9;background:var(--dark);color:#fff8ea;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600}
body.freecam #fcHint{display:block}
/* ---- touch ---- */
#touch{position:fixed;z-index:6;user-select:none;-webkit-user-select:none;display:none;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,var(--tb));gap:10px;touch-action:none}
#touch button{width:var(--tb);height:var(--tb);border-radius:50%;font-size:23px;opacity:.94;touch-action:none;padding:0;border-width:2px;box-shadow:0 4px 12px rgba(40,25,5,.3);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#touch button:active{transform:scale(.92);filter:brightness(1.1)}
#stickZone{position:fixed;left:0;bottom:0;width:46vw;height:56vh;z-index:6;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stickBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:3px solid rgba(255,248,234,.55);background:rgba(74,53,38,.22);opacity:0;transition:opacity .12s;pointer-events:none}
#stickKnob{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff8ea,#e3cf9f);border:3px solid var(--line-2);box-shadow:0 4px 12px rgba(40,25,5,.35);opacity:0;transition:opacity .12s;pointer-events:none}
#stickZone.on #stickBase,#stickZone.on #stickKnob{opacity:.95}
body.touch #touch{display:grid}
body.touch #stickZone{display:block}
/* ---- small screens ---- */
@media(max-width:720px){
 #statusCard{width:186px;padding:8px 10px}
 #scPortrait{width:44px;height:44px;font-size:22px}
 #gaitEl{left:30px;top:28px;width:20px;height:20px;font-size:10px}
 #scName{font-size:14px}
 #scBtns{display:none}
 #hud{flex-direction:column;align-items:flex-end;gap:6px}
 #wallet{gap:9px;padding:5px 11px}
 #wallet .w{font-size:13px}
 #wallet .w i{font-size:13px}
 #sysBtns button{width:32px;height:32px;font-size:14px}

 energetic:{emoji:'⚡',label:'Energetic',desc:'quick off the mark, and eats like a horse',ac:1.08,decay:1.15,neck:0.03},

 {id:'mesa',x:-215,z:95,tier:3},{id:'snowpeak',x:-175,z:-240,tier:3},{id:'farbank',x:150,z:150,tier:2},{id:'creek',x:-60,z:150,tier:2},

/* Tack as gear. A horse wears four pieces: saddle, saddle pad, bridle, horseshoes. Each piece

const GEAR_SLOTS=['saddle','pad','bridle','shoes'];
const GEAR_SLOT_LBL={saddle:'🐎 Saddle',pad:'🟦 Saddle Pad',bridle:'🪢 Bridle',shoes:'🍀 Horseshoes'};
const RARITIES=['Common','Uncommon','Rare','Epic','Legendary'];

function rollRarity(){let t=0;for(const r of RARITIES)t+=RAR_W[r];let x=Math.random()*t;for(const r of RARITIES){x-=RAR_W[r];if(x<=0)return r;}return 'Common';}
function genGear(rarity,slot){
 rarity=rarity||rollRarity(); slot=slot||GEAR_SLOTS[Math.floor(Math.random()*GEAR_SLOTS.length)];

 const bonus={}; for(const k of pool)bonus[k]=ri<=1?1:ri===2?(Math.random()<0.5?1:2):ri===3?2:(Math.random()<0.5?2:3);
 const adj=GEAR_ADJ[rarity][Math.floor(Math.random()*GEAR_ADJ[rarity].length)];
 return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),slot,rarity,name:adj+' '+GEAR_NOUN[slot],bonus,lvl:1};
}

 save=save&&save.horses?save:{v:2,ranchName:'Meadowlark Ranch',founded:Date.now(),coins:150,gems:3,items:{carrot:10,apple:2,hay:3},nextId:1,horses:[],decor:[],projects:{},trophies:{},wild:null,wildTrust:0,muted:false,lastSeen:Date.now(),lastDaily:'',questDate:'',quests:[],totalRaces:0,started:true};

{

function beep(f0,f1,dur,type,vol,delay){

 }catch(e){}
}

/* ================= terrain height (smooth value noise) ================= */
function ihash(ix,iz){
 let h=ix*374761393+iz*668265263;
 h=(h^(h>>13))*1274126177;
 return ((h^(h>>16))>>>0)/4294967295;
}
function vnoise(x,z){
 const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;
 const sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz);
 const a=ihash(ix,iz),b=ihash(ix+1,iz),c=ihash(ix,iz+1),d=ihash(ix+1,iz+1);
 return a+(b-a)*sx+(c-a)*sz+(a-b-c+d)*sx*sz;
}
const riverZ=x=>120+Math.sin(x*0.012)*45;
/* Sparrow Creek stream — a tributary that winds down from the southern hills into the river */
const streamX=z=>118+Math.sin(z*0.03)*14+Math.sin(z*0.011+3)*8;
const STREAM_JOIN=160;                          // it meets the river around z≈160
function rawH(x,z){
 const d=Math.hypot(x,z);
 const near=THREE.MathUtils.smoothstep(d,24,58);
 const far=1-THREE.MathUtils.smoothstep(d,380,460);
 const n=vnoise(x*0.018+7,z*0.018+3)*7.5       // medium rolling
        +vnoise(x*0.055,z*0.055)*1.8           // small bumps
        +vnoise(x*0.008+19,z*0.008+5)*14.0     // broad hills
        +vnoise(x*0.0042+50,z*0.0042+22)*13.0; // very broad ridges & valleys
 let h=near*far*(n-9.5);
 const rg=1-Math.abs(vnoise(x*0.006+83,z*0.006-41)*2-1);   // ridged crests give hills a backbone
 h+=near*far*rg*rg*6.0;
 const bl=vnoise(x*0.011-31,z*0.011+44);                    // flat-topped bluffs, steep cliff faces
 h+=near*far*THREE.MathUtils.smoothstep(bl,0.425,0.445)*9.0;
 const rd=Math.abs(z-riverZ(x));
 h-=near*far*1.7*(1-THREE.MathUtils.smoothstep(rd,0,9));
 if(z<STREAM_JOIN){
  const sd=Math.abs(x-streamX(z));
  h-=near*far*1.15*(1-THREE.MathUtils.smoothstep(sd,0,4.5));
 }
 return h;
}
const colliders=[];
const walls=[];
const BR_A=riverZ(0)-7.5,BR_B=riverZ(0)+7.5;
const BRIDGE_Y=Math.max(rawH(0,BR_A),rawH(0,BR_B))+0.22;
function groundH(x,z){
 let h=rawH(x,z);
 if(Math.abs(x)<2.3&&z>BR_A&&z<BR_B)h=Math.max(h,BRIDGE_Y+0.55*Math.sin(Math.PI*(z-BR_A)/15));
 return h;
}

   so no gameplay code needs to know VR exists. */
let vrMenuOpen=false,vrPrevMenuBtn=false,vrPrevTrigger=false,vrHit=null,vrHover='';

const _rhL=new THREE.Vector3(),_rhR=new THREE.Vector3(),_rsL=new THREE.Vector3(),_rsR=new THREE.Vector3();
let reinNeutral=0.30,reinCal=0;   // where this rider's hands naturally sit

/* Which VR input actually drives the horse. 'either' reads both and lets whichever you are
   using win, which is the nicest default but means a resting hand can still nudge the horse
   if you meant to ride on the stick alone — so both can be picked outright. */
const VRCTRL=['either','reins','stick'];
const VRCTRL_LBL={either:'🎮 Either',reins:'🪢 Reins',stick:'🕹️ Stick'};
let vrCtrlMode=(()=>{try{const v=localStorage.getItem('mlrVRCtrl');return VRCTRL.includes(v)?v:'either';}catch(e){return 'either';}})();
/* Reads the two controllers as a pair of reins. Everything is measured against the head so
   it works whatever height you are, and there is no calibration step to get wrong. */
function pollReins(){
 const a=vrCtrls[0],b=vrCtrls[1];
 if(!a||!b||a.visible===false||b.visible===false)return null;
 /* Low-pass the hand poses. Controller tracking is noisy at the millimetre level and the
    steering term is a DIFFERENCE between two hands, which doubles that noise — raw, it read
    as twitch. */
 _rsL.lerp(a.position,0.25);_rsR.lerp(b.position,0.25);
 _rhL.copy(_rsL);_rhR.copy(_rsR);
 if(_rhL.x>_rhR.x){const t=_rhL.x,y=_rhL.y,z=_rhL.z;   // keep left = the horse's left (-x)
  _rhL.set(_rhR.x,_rhR.y,_rhR.z);_rhR.set(t,y,z);}
 const head=camera.position;
 const fwdL=head.z-_rhL.z, fwdR=head.z-_rhR.z;         // +ve = that hand is out in front
 const ext=(fwdL+fwdR)*0.5;
 if(ext<-0.15||ext>1.2)return null;                    // hands somewhere implausible: ignore
 /* Wherever you naturally hold your hands is "neutral", so nobody has to find an invisible
    sweet spot. Averaged over the first moment in the headset and clamped to a sane reach,
    because a fixed threshold had the horse walking off while your hands just rested. */
 if(reinCal<1){reinCal+=0.02;reinNeutral=reinNeutral*0.9+ext*0.1;return {turn:0,go:0,brake:false};}
 const n=THREE.MathUtils.clamp(reinNeutral,0.20,0.42);
 /* Throttle reads the LEADING hand, not the average: drawing one rein back to steer would
    otherwise halve your speed and pull the horse up mid-turn. Both hands back still halts,
    because then there is no leading hand left. */
 const lead=Math.max(fwdL,fwdR);
 const go=THREE.MathUtils.clamp((lead-(n+0.05))/0.24,0,1);
 const brake=lead<n-0.10;                              // both reins drawn into your chest
 // steering: draw one rein back, or carry both hands across
 const diff=(fwdR-fwdL)/0.28;                          // left hand back -> turn left
 const lat=((_rhL.x+_rhR.x)*0.5-head.x)/0.34;          // hands carried right -> turn right
 let turn=diff*0.70-lat*0.40;
 const t=Math.abs(turn);
 turn=t<0.16?0:Math.sign(turn)*Math.min(1,(t-0.16)/0.84);   // dead zone eats tracking noise
 return {turn,go,brake};
}
function pollVR(){
 const s=renderer.xr.getSession();
 if(!s)return;
 let menuBtn=false,trigger=false;
 touch.go=false;touch.left=false;touch.right=false;touch.gal=false;touch.jump=false;
 touch.turnA=0;touch.goA=0;
 vrStickY=0;
 let stickX=0,stickY=0,bestMag=0;
 for(const src of s.inputSources){
  const gp=src.gamepad;
  if(!gp||!gp.axes)continue;
  const b=gp.buttons||[];
  if(b[5]&&b[5].pressed)menuBtn=true;      // B / Y toggles the menu
  if(b[0]&&b[0].pressed)trigger=true;
  const ax=gp.axes;
  const x=ax.length>2?ax[2]:ax[0];
  const y=ax.length>3?ax[3]:ax[1];
  if(vrMenuOpen){                          // menu open: the horse waits, the stick scrolls
   if(Math.abs(y)>Math.abs(vrStickY))vrStickY=y;
   continue;
  }
  /* Only the stick you are actually pushing steers. Reading both controllers and OR-ing
     them let a resting thumb, or the drift every analog stick has, fight the one you meant. */
  const mag=Math.hypot(x,y);
  if(mag>bestMag){bestMag=mag;stickX=x;stickY=y;}
  if(b[0]&&b[0].pressed)touch.gal=true;    // trigger: gallop
  if(b[4]&&b[4].pressed)touch.jump=true;   // A / X: jump
 }
 if(!vrMenuOpen){
  /* Thumbstick -> analog steering and throttle. This used to be a hard threshold at 0.40
     that produced a full-rate turn the instant you crossed it, so the horse had no gentle
     steering at all and stick noise around the threshold made it judder. A dead zone kills
     the noise; the squared curve on yaw gives fine control near centre and full lock only
     at the rim. Throttle stays linear so speed is predictable. */
  const DZ=0.18;
  const shape=(v,curved)=>{const a=Math.abs(v);
   if(a<DZ)return 0;
   const n=Math.min(1,(a-DZ)/(1-DZ));      // rescaled so it starts at 0, not at a step
   return Math.sign(v)*(curved?n*(0.35+0.65*n):n);};
  if(vrCtrlMode!=='reins'){
   touch.turnA=-shape(stickX,true);           // stick left (-x) turns left (+heading)
   const f=shape(stickY,false);
   touch.goA=f<0?-f:0;                     // forward only; pulling back does not reverse in VR
  }
  /* Reins. Both controllers are children of the rig, so their positions are already in the
     horse's frame: rig -Z is the way it faces, +X is its right. Hold your hands out as if
     you had reins in them — give rein (hands forward) to move off, draw them back to halt,
     and take one hand back or carry both to a side to turn. Whichever you are actually
     using — stick or reins — wins, so neither can fight the other. */
  const rein=vrCtrlMode==='stick'?null:pollReins();
  if(rein){
   if(Math.abs(rein.turn)>Math.abs(touch.turnA))touch.turnA=rein.turn;
   if(rein.go>touch.goA)touch.goA=rein.go;
   touch.brake=rein.brake;
  }else touch.brake=false;
  if(touch.goA>0.05)touch.go=true;         // keep the booleans truthful for the rest of the game
  if(touch.turnA>0.05)touch.left=true;
  if(touch.turnA<-0.05)touch.right=true;
 }else touch.brake=false;
 if(menuBtn&&!vrPrevMenuBtn)setVRMenu(!vrMenuOpen);
 if(vrMenuOpen&&trigger&&!vrPrevTrigger&&vrHover)vrMenuClick(vrHover);
 vrPrevMenuBtn=menuBtn;
 vrPrevTrigger=trigger;
}

function vrBreed(ia,ib){

/* Every scrolling page shares this: build a list of row-drawing closures, then draw the
   slice that fits. Rows scrolled out are clipped away and vrButton drops their hitboxes. */
function drawVRList(c){
 const rows=[];
 let note='';
 try{
  const sv=freshSave()||{};
  if(vrPage==='shop')note=buildVRShop(rows,sv);
  else if(vrPage==='stable')note=buildVRStable(rows,sv);
  else if(vrPage==='quests')note=buildVRQuests(rows,sv);
  else if(vrPage==='events')note=buildVREvents(rows,sv);
  else if(vrPage==='pass')note=buildVRPass(rows,sv);
 }catch(e){
  rows.length=0;
  note='Could not read your save just now — try again in a moment.';
 }
 vrContentH=rows.length*VRM_STEP;
 const max=Math.max(0,vrContentH-vrListH);
 let sc=vrScroll[vrPage]||0;
 sc=Math.max(0,Math.min(max,sc));
 vrScroll[vrPage]=sc;

 if(!rows.length){
  c.fillStyle='#8c7a63';
  c.font='600 24px "Trebuchet MS",sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  String(note||'Nothing here yet.').split('\n')
   .forEach((ln,i)=>c.fillText(ln,VRM_W/2,vrListTop+110+i*38));
  return;
 }

 c.save();
 c.beginPath();c.rect(24,vrListTop,VRM_W-48,vrListH);c.clip();
 vrClip={y:vrListTop,h:vrListH};
 for(let i=0;i<rows.length;i++){
  const y=vrListTop-sc+i*VRM_STEP;
  if(y+VRM_ROW<vrListTop-4||y>vrListTop+vrListH+4)continue;
  rows[i](y);
 }
 vrClip=null;
 c.restore();

 if(max>0){
  const tx=998,th=Math.max(40,vrListH*vrListH/vrContentH);
  const ty=vrListTop+(vrListH-th)*(sc/max);
  vrRR(c,tx,vrListTop,8,vrListH,4);c.fillStyle='#efe3c8';c.fill();
  vrRR(c,tx,ty,8,th,4);c.fillStyle='#d9b97f';c.fill();
 }
}

function vrMenuClick(id){
 if(id==='noop')return;
 if(id==='exit'){const s=renderer.xr.getSession();if(s)s.end();return;}
 if(id.startsWith('tab:')){vrPage=id.slice(4);drawVRMenu();return;}
 if(id.startsWith('shoptab:')){vrShopTab=id.slice(8);vrScroll.shop=0;drawVRMenu();return;}
 if(id.startsWith('questtab:')){vrQuestTab=id.slice(9);vrScroll.quests=0;drawVRMenu();return;}
 if(id.startsWith('care:')){try{careAct(id.slice(5));}catch(e){}drawVRMenu();return;}
 if(id.startsWith('pass:')){
  const i=+id.slice(5);let ok=false;
  syncSave(sv=>{
   sv.lbClaims=sv.lbClaims||{};
   const key='p'+i, tp=Math.floor(((sv.pass&&sv.pass.pts)||0)/200);
   if(sv.lbClaims[key]||tp<i+1)return;
   sv.lbClaims[key]=true;
   const r=PASS_REWARDS[i];
   if(r.c)sv.coins+=r.c;
   if(r.g)sv.gems+=r.g;
   if(r.k)sv.keys=(sv.keys||0)+r.k;
   if(r.tack)sv.goldTack=true;
   ok=true;
  });
  if(ok){refreshWallet();sGem();
   toast(PASS_REWARDS[i].tack?'✨ Golden saddle unlocked — it is in the Tack shop!':'🎟️ Pass reward claimed!');}
  drawVRMenu();return;
 }
 if(id==='act:ctrl'){
  vrCtrlMode=VRCTRL[(VRCTRL.indexOf(vrCtrlMode)+1)%VRCTRL.length];
  try{localStorage.setItem('mlrVRCtrl',vrCtrlMode);}catch(e){}
  reinCal=0;                               // re-learn where your hands rest for the new mode
  toast(vrCtrlMode==='reins'?'🎗️ Reins only — the thumbstick is off.'
       :vrCtrlMode==='stick'?'🕹️ Thumbstick only — the reins are just for show.'
       :'🎮 Either — reins or stick, whichever you use.');
  drawVRMenu();return;
 }
 if(id==='act:trick'){
  try{window._tkN=((window._tkN||0)+1)%3;startTrick(['roll','spin','flip'][window._tkN]);}catch(e){}
  setVRMenu(false);return;
 }
 if(id==='act:fly'){const b=$('flyBtn');if(b)b.click();setVRMenu(false);return;}
 if(id==='act:photo'){const b=$('photoBtn');if(b)b.click();return;}
 if(id==='act:mute'){const b=$('muteBtn');if(b)b.click();drawVRMenu();return;}

 /* Everything below reuses the flat game's own handlers, then hides the DOM panels those
    handlers pop open — invisible in VR, but they would be sitting there on the way out. */
 const done=()=>{try{hidePanels();}catch(e){}try{refreshWallet();}catch(e){}drawVRMenu();};
 const p=id.split(':');
 try{
  if(p[0]==='buy'){
   if(p[1]==='h')buyHorse3(+p[2]);
   else if(p[1]==='pet')buyPet(p[2]);
   else if(p[1]==='food')buyFood3(p[2],+p[3]);
   else if(p[1]==='tack')buyTack3(p.slice(2).join(':'));
   else if(p[1]==='bundle')buyBundle3(p[2]);
  }
  else if(p[0]==='petfollow')setActivePet(p[1]);
  else if(p[0]==='outfit'){
   const part=p[1],col=p.slice(2).join(':');   // the colour carries its own '#'
   syncSave(sv=>{sv.rider=sv.rider||{};sv.rider[part]=col;});
   reloadHorses();
   toast('Looking sharp! 🧢');
  }
  else if(p[0]==='mate'){
   /* no dropdowns in VR — tapping Swap steps to the next eligible horse, skipping

/* The VR button is always drawn, even where VR cannot run. Hiding it on an
   unsupported browser is technically correct and tells a first-time visitor on a
   laptop that the headset mode does not exist — which is the opposite of true, and
   VR is the part of this worth showing. So: live button where WebXR is available,
   and everywhere else a muted one that says what it needs. */
{
 const b=document.createElement('button');
 b.id='vrBtn';
 b.style.cssText='position:fixed;top:52px;right:10px;z-index:12;';
 const enable=()=>{
  b.textContent='🥽 Ride in VR';
  b.title='Ride from the saddle, holding the reins in your hands';
  b.onclick=async()=>{
   if(renderer.xr.isPresenting){renderer.xr.getSession().end();return;}
   try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','hand-tracking']});
    await renderer.xr.setSession(s);
   }catch(err){
    /* Reaching here means the browser said immersive-vr was supported and then
       refused to start one. Overwhelmingly that is an OpenXR runtime installed
       with no headset actually on — a PC with SteamVR sitting idle answers "yes"
       to isSessionSupported — so lead with that rather than the raw DOMException,
       and keep the real message on the end for anything genuinely unusual. */
    const why=(err&&err.name==='NotSupportedError')||(err&&err.name==='InvalidStateError')
     ? 'Could not start VR — is your headset connected and turned on?'
     : 'Could not start VR — is your headset connected and turned on? ('+((err&&err.message)||err)+')';
    if(typeof toast==='function')toast(why);
   }
  };
 };
 const explain=why=>{
  b.textContent='🥽 Ride in VR';   // same label either way: it advertises the mode, and the dimming says it needs a headset
  b.style.cssText+='opacity:0.55;border-style:dashed;';
  b.title=why;
  b.onclick=()=>{ if(typeof toast==='function')toast(why); };
 };
 if(!navigator.xr||!navigator.xr.isSessionSupported){
  /* No WebXR at all: every desktop Safari, and Chrome/Firefox with no runtime. */
  explain(isSecureContext
   ? 'Open this link in a VR headset — on a Quest, use its own browser — to ride holding the reins.'
   : 'VR needs a secure (https) page. Open the published link rather than a plain http one.');
 }else{
  navigator.xr.isSessionSupported('immersive-vr')
   .then(ok=>ok?enable():explain('No headset detected. Open this link in a VR headset — on a Quest, use its own browser — to ride holding the reins.'))
   .catch(()=>explain('Could not check for a headset. Open this link in a VR headset’s own browser to ride holding the reins.'));
 }
 document.body.appendChild(b);
}

function loftZ(prof,segs,mat){
 const pos=[],uv=[],idx=[];
 const R=prof.length;
 for(let i=0;i<R;i++){
  const p=prof[i];
  for(let j=0;j<=segs;j++){
   const th=j/segs*Math.PI*2;
   pos.push(Math.cos(th)*p.rx,p.cy+Math.sin(th)*p.ry,p.z);
   uv.push(i/(R-1),0.5-Math.sin(th)*0.5);
  }
 }
 for(let i=0;i<R-1;i++)for(let j=0;j<segs;j++){
  const a=i*(segs+1)+j,b=a+segs+1;
  idx.push(a,b,a+1,b,b+1,a+1);
 }
 const c0=pos.length/3;
 pos.push(0,prof[0].cy,prof[0].z);uv.push(0,0.5);
 for(let j=0;j<segs;j++)idx.push(c0,j+1,j);

 pos.push(0,prof[R-1].cy,prof[R-1].z);uv.push(1,0.5);
 for(let j=0;j<segs;j++)idx.push(c1,base+j,base+j+1);

 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

 return m;
}

function wpLeafGeo(stems,cfg,rng){

 let cn=0;
 for(const s of stems)if(s.level===s.maxLevel){cc.add(s.points[s.points.length-1]);cn++;}
 if(cn)cc.divideScalar(cn);
 const q=new THREE.Quaternion(),v=new THREE.Vector3(),nq=new THREE.Vector3(),wp=new THREE.Vector3(),mid=new THREE.Vector3();
 let vb=0;
 for(const s of stems){
  if(s.level!==s.maxLevel)continue;

  for(let k=0;k<cfg.per;k++){
   const t=0.15+0.85*(k+0.5)/cfg.per;
   const sg=t*(s.points.length-1),si=Math.min(s.points.length-2,Math.floor(sg)),st=sg-si;

   q.multiply(_wpQ(_wpYA,az));
   q.multiply(_wpQ(_wpXA,cfg.tilt+rng.vary(0,16)));

   mid.set(0,S*0.6,0).applyQuaternion(q).add(v);
   nq.lerp(mid.sub(cc).normalize(),0.6).normalize();

   const corners=[[-S/2,0,0],[S/2,0,0],[S/2,S*1.15,0],[-S/2,S*1.15,0]];
   for(const c2 of corners){
    wp.set(c2[0],c2[1],c2[2]).applyQuaternion(q).add(v);
    P.push(wp.x,wp.y,wp.z);
    N.push(nq.x,nq.y,nq.z);
    W.push(wind);
   }
   UV.push(0,0,1,0,1,1,0,1);
   idx.push(vb,vb+1,vb+2,vb,vb+2,vb+3);

 }

 g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(P),3));
 g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(N),3));
 g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(UV),2));

function placeFoliage(name){

  let src=null; g.scene.traverse(o=>{if(o.isMesh&&!src)src=o;});

  const minY=geo.boundingBox.min.y, h=(geo.boundingBox.max.y-minY)||1;
  const mat=src.material; mat.roughness=0.9; mat.metalness=0;

  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new THREE.Vector3(),sc=new THREE.Vector3();
  list.forEach((tp,i)=>{
   const s=tp.s*FOLIAGE_H[name]/h;

   p.set(tp.x,groundH(tp.x,tp.z)-minY*s-0.06*FOLIAGE_H[name]*tp.s,tp.z);   // sunk into the ground, not resting on the analytic curve
   sc.set(s,s,s); m.compose(p,q,sc); inst.setMatrixAt(i,m);

 },undefined,e=>console.warn(name+' load failed',e));

/* Mesas were using grainTex, which draws VERTICAL streaks — it is the plank/wood-grain
   texture. On a cylinder that reads as a moulded plastic drum, because the one thing
   that says "mesa" is horizontal sedimentary banding: layers laid down over time and
   then cut through. So: horizontal strata in muted desert ochres, with faint vertical
   weathering streaks over the top where rain has run down the face. */
function strataTex(){
 /* Keep the band tones CLOSE together. Wide tonal jumps turn a butte into a stack of
    pancakes — the banding should be something you notice on second look, not stripes. */
 const BANDS=['#b07a5c','#a97052','#b98764','#a06849','#b3805f','#a5744f','#bc8b6a'];
 return canvasTex(128,256,(c,w,h)=>{
  c.fillStyle='#ac7455';c.fillRect(0,0,w,h);
  for(let y=0;y<h;){
   const bh=1+Math.random()*9;             // thinner beds, so no one band dominates
   c.fillStyle=BANDS[(Math.random()*BANDS.length)|0];
   c.globalAlpha=0.18+Math.random()*0.30;  // was up to 0.95 — far too opaque
   c.fillRect(0,y,w,bh);
   if(Math.random()<0.18){                 // occasional harder bed, still subtle
    c.globalAlpha=0.10;c.fillStyle='#7d4a33';
    c.fillRect(0,y,w,1);
   }
   y+=bh;
  }
  c.globalAlpha=0.07;
  for(let i=0;i<34;i++){                   // rain-run weathering down the face
   c.strokeStyle='#5d3320';
   c.lineWidth=1+Math.random()*3;
   const x=Math.random()*w;
   c.beginPath();c.moveTo(x,0);
   c.quadraticCurveTo(x+(Math.random()-0.5)*5,h/2,x+(Math.random()-0.5)*4,h);
   c.stroke();
  }
  c.globalAlpha=0.05;                      // break up the flat bands with grit
  for(let i=0;i<2200;i++){
   c.fillStyle=Math.random()<0.5?'#6b3f2a':'#d3a482';
   c.fillRect(Math.random()*w,Math.random()*h,1,1);
  }
  c.globalAlpha=1;
 },1);
}

/* Mythic coats ON THE RIG: recolour the baked texture's LUMINANCE through a 3-stop ramp

 galaxy:{ramp:['#0a0818','#3a2a72','#caa8ff'], glow:0.8,  rough:0.78},
 shadow:{ramp:['#060409','#170f2a','#5a3aa0'], glow:0.55, rough:0.84},   // darker -> reads "shadow", not bright purple

 ice:`float gl=step(0.99,_hash(floor(vMapUv*150.0)))*(0.5+0.5*sin(uTime*4.0+_l*30.0));

const blobCache={};
function makeCritter(key){
 const D=CRITTER_DEFS[key];
 const g=new THREE.Group();
 const body=new THREE.Group();
 g.add(body);
 if(!blobCache[key])blobCache[key]=blobBody(D.body,D.detail);
 const bm=new THREE.Mesh(blobCache[key].geometry,blobCache[key].material);
 bm.castShadow=true;
 body.add(bm);
 const eyeGs=[];
 for(const ep of D.eyes){
  const e=blob(D.eyeR,D.eyeR,D.eyeR,'#16120f',ep[0],ep[1],ep[2],body);
  eyeGs.push(e);
 }
 if(D.beak){
  const bk=new THREE.Mesh(new THREE.ConeGeometry(D.beak.r,D.beak.len,6),smat(D.beak.c));
  bk.rotation.x=Math.PI/2;
  bk.position.set(D.beak.x,D.beak.y,D.beak.z);
  bk.castShadow=true;
  body.add(bk);
 }
 let tail=null;
 if(D.tail){
  tail=new THREE.Group();
  tail.position.set(D.tail.x,D.tail.y,D.tail.z);
  blob(D.tail.r,D.tail.r,D.tail.r,D.tail.c,0,0,0,tail);
  body.add(tail);
 }
 const legs=[];
 if(D.legs)for(const lp of D.legs.pts){
  const leg=new THREE.Group();
  leg.position.set(lp[0],D.legs.len,lp[1]);
  tube(D.legs.r,D.legs.r*0.85,D.legs.len,D.legs.c,0,-D.legs.len/2,0,leg);
  g.add(leg);
  legs.push(leg);
 }
 const wings=[];
 if(D.wings){
  for(const s of[-1,1]){
   const w=new THREE.Group();
   w.position.set(D.wings.x*s,D.wings.y,D.wings.z);
   const wm=blob(D.wings.sx,D.wings.sy,D.wings.sz,D.wings.c,D.wings.sx*0.8*s,0,0,w);
   wings.push(w);
   body.add(w);
  }
 }
 const cs=contactShadow(g);
 cs.scale.set(0.45,0.32,1);
 g.scale.setScalar(D.size);
 return {group:g,body,legs,tail,wings,eyes:eyeGs,def:D,key};
}

function spawnCritter(key,hx,hz,hr){
 const p=makeCritter(key);
 scene.add(p.group);
 const a=Math.random()*Math.PI*2,rr=Math.random()*hr;
 const c={p,key,def:p.def,home:{x:hx,z:hz,r:hr},
  x:hx+Math.cos(a)*rr,z:hz+Math.sin(a)*rr,y:0,heading:Math.random()*6.3,
  mode:'idle',timer:1+Math.random()*4,tx:0,tz:0,phase:Math.random()*9,
  blink:2+Math.random()*4,fly:null,speed:0};
 if(p.def.gait==='float')c.z=riverZ(c.x)+(Math.random()-0.5)*3;  // ducks start on the water
 critters.push(c);

function updateCritters(dt,t){
 for(const c of critters){
  const D=c.def,P=c.p;
  // day/night: most wildlife sleeps at night; deer stay out through dusk
  const awake=D.dusky?nightNow<0.85:nightNow<0.55;
  P.group.visible=awake;
  if(!awake)continue;
  const pd=Math.hypot(player.pos.x-c.x,player.pos.z-c.z);
  /* -------- behaviour states -------- */
  if(D.fleeR&&c.mode!=='flee'&&pd<D.fleeR&&Math.abs(player.speed)>3){
   c.mode='flee';c.timer=2.2+Math.random();
  }
  c.timer-=dt;
  if(c.mode==='flee'){
   const away=Math.atan2(c.x-player.pos.x,c.z-player.pos.z);
   c.heading+=(THREE.MathUtils.euclideanModulo(away-c.heading+Math.PI,Math.PI*2)-Math.PI)*Math.min(1,dt*6);
   c.speed=D.fleeSpeed||D.speed*2.4;
   if(c.timer<=0){c.mode='idle';c.timer=1+Math.random()*2;}
  }else if(c.mode==='wander'){
   const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz);
   if(d<0.5||c.timer<=0){c.mode=Math.random()<0.55?'graze':'idle';c.timer=2.5+Math.random()*5;c.speed=0;}
   else{
    const want=Math.atan2(dx,dz);
    c.heading+=(THREE.MathUtils.euclideanModulo(want-c.heading+Math.PI,Math.PI*2)-Math.PI)*Math.min(1,dt*3);
    c.speed=D.speed;
   }
  }else{ // idle / graze
   c.speed=0;
   if(c.timer<=0){
    c.mode='wander';c.timer=8+Math.random()*6;
    const hd=Math.hypot(c.x-c.home.x,c.z-c.home.z);
    if(hd>c.home.r){c.tx=c.home.x;c.tz=c.home.z;}                 // drift back home
    else{const a=Math.random()*Math.PI*2,rr=2+Math.random()*c.home.r;
     c.tx=c.home.x+Math.cos(a)*rr;c.tz=c.home.z+Math.sin(a)*rr;}
   }
  }
  /* -------- locomotion & gait -------- */
  if(D.gait==='float'){                       // ducks paddle the river
   c.heading+=Math.sin(t*0.23+c.phase)*dt*0.5;
   c.x+=Math.sin(c.heading)*D.speed*dt;
   c.x=THREE.MathUtils.clamp(c.x,c.home.x-c.home.r,c.home.x+c.home.r);
   const zc=riverZ(c.x);
   c.z+=(zc+(Math.sin(c.phase)*2)-c.z)*Math.min(1,dt*1.1);
   c.y=rawH(c.x,zc)+0.55+Math.sin(t*1.3+c.phase)*0.02;
   P.group.rotation.z=Math.sin(t*1.1+c.phase)*0.05;
  }else if(D.gait==='fly'){                   // bluebirds hop between perch spots
   if(!c.fly&&c.mode==='wander'){
    c.fly={fx:c.x,fz:c.z,fy:groundH(c.x,c.z),t:0,
     dur:Math.max(1.2,Math.hypot(c.tx-c.x,c.tz-c.z)/D.speed)};
   }
   if(c.fly){
    c.fly.t+=dt;
    const p01=Math.min(1,c.fly.t/c.fly.dur);
    c.x=THREE.MathUtils.lerp(c.fly.fx,c.tx,p01);
    c.z=THREE.MathUtils.lerp(c.fly.fz,c.tz,p01);
    const gy=groundH(c.x,c.z);
    c.y=THREE.MathUtils.lerp(c.fly.fy,gy,p01)+Math.sin(Math.PI*p01)*3.2-gy;
    c.heading=Math.atan2(c.tx-c.fly.fx,c.tz-c.fly.fz);
    if(p01>=1){c.fly=null;c.mode='graze';c.timer=2.5+Math.random()*4;}
   }else c.y=0;
   const flap=c.fly?Math.sin(t*26+c.phase)*0.85:0.12+Math.sin(t*2+c.phase)*0.04;
   if(P.wings.length){P.wings[0].rotation.z=-flap;P.wings[1].rotation.z=flap;}
  }else{                                      // ground gaits share the mover
   c.x+=Math.sin(c.heading)*c.speed*dt;
   c.z+=Math.cos(c.heading)*c.speed*dt;
   c.y=0;
  }
  c.phase+=dt*(2.4+c.speed*2.6);
  const moving=c.speed>0.05;
  if(D.gait==='walk4'&&P.legs.length===4){
   for(let i=0;i<4;i++)P.legs[i].rotation.x=moving?Math.sin(c.phase+(i===0||i===3?0:Math.PI))*0.55:0;
   P.body.position.y=moving?Math.abs(Math.sin(c.phase*2))*0.02:0;
  }else if(D.gait==='walk2'&&P.legs.length===2){
   P.legs[0].rotation.x=moving?Math.sin(c.phase)*0.7:0;
   P.legs[1].rotation.x=moving?-Math.sin(c.phase)*0.7:0;
   P.body.rotation.z=moving?Math.sin(c.phase)*0.07:0;
   P.body.position.z=moving?Math.abs(Math.sin(c.phase))*0.02:0;
  }else if(D.gait==='hop'){
   const h=moving?Math.max(0,Math.sin(c.phase*1.6)):0;
   c.y+=h*0.22;
   P.body.scale.y=1-(moving?Math.max(0,Math.sin(c.phase*1.6+Math.PI))*0.12:0);
   for(const lg of P.legs)lg.rotation.x=moving?-h*0.9:0;
  }
  /* -------- shared juice: graze lean, blinking, tail wag -------- */
  const leanT=(c.mode==='graze'&&!moving)?(D.gait==='walk2'?0.5+Math.sin(t*7+c.phase)*0.12:0.34+Math.sin(t*1.4+c.phase)*0.04):0;
  P.body.rotation.x+=(leanT-P.body.rotation.x)*Math.min(1,dt*5);
  c.blink-=dt;
  if(c.blink<-0.13)c.blink=2.5+Math.random()*4;
  const es=c.blink<0?0.12:1;
  for(const e of P.eyes)e.scale.y=P.def.eyeR*es;
  if(P.tail)P.tail.rotation.y=Math.sin(t*(moving?9:2.2)+c.phase)*(moving?0.5:0.15);
  P.group.position.set(c.x,(D.gait==='float'?c.y:groundH(c.x,c.z)+c.y),c.z);
  P.group.rotation.y=c.heading;
 }
}

/* Stylized pegasus wing — layered geometric feathers (primaries + coverts) fanning
   back from the withers. Pivot flaps via rotation.z (driven in animateHorse). */
function buildPegasusWing(sgn){
 const piv=new THREE.Group();
 piv.position.set(sgn*0.18,1.22,0.15);
 const wing=new THREE.Group();          // built +X-out, fanning back; mirrored by sgn
 const FG=new THREE.SphereGeometry(0.5,8,5);
 const mW=new THREE.MeshStandardMaterial({color:0xf8fbff,roughness:0.55,metalness:0,side:THREE.DoubleSide});
 const mB=new THREE.MeshStandardMaterial({color:0xdfe7f4,roughness:0.66,metalness:0,side:THREE.DoubleSide});
 // feather: length L, width W, fan-angle a (deg, 0=out +X -> 90=back -Z), row lift dy, depth dz.
 // Rows are stacked in y AND pushed back in z so they OVERLAP (depth), not coplanar.
 const mk=(L,W,mat,aDeg,dy,dz)=>{const m=new THREE.Mesh(FG,mat);m.scale.set(L,0.05,W);
  const a=aDeg*Math.PI/180;
  m.position.set(Math.cos(a)*L*0.5, dy||0, -Math.sin(a)*L*0.5+(dz||0));
  m.rotation.y=a; m.castShadow=true; wing.add(m);};
 // primaries — long, low/back row (the main fan)
 [[1.22,6],[1.48,20],[1.68,34],[1.76,48],[1.68,62],[1.48,76],[1.24,90],[0.98,104]].forEach(([L,a],i)=>mk(L,0.21,i%2?mB:mW,a,0,0));
 // secondaries — mid row, lifted + set back (creates thickness/overlap)
 [[0.94,12],[1.06,28],[0.98,46],[0.82,64],[0.62,82]].forEach(([L,a],i)=>mk(L,0.20,i%2?mW:mB,a,0.13,0.06));
 // coverts — short top row, more lift + forward (the leading shoulder mass)
 [[0.62,18],[0.70,38],[0.58,58],[0.46,78]].forEach(([L,a],i)=>mk(L,0.18,i%2?mB:mW,a,0.26,0.12));
 // scapular tuft — fills the wing root so it doesn't sprout from a single point
 [[0.42,34],[0.36,56]].forEach(([L,a],i)=>mk(L,0.17,mW,a,0.34,0.18));
 wing.scale.set(sgn,1,1);
 wing.rotation.x=-0.34;          // tilt the fan plane so the wing ARCS up-and-back (not a flat horizontal fan)
 piv.add(wing);
 piv.userData.sgn=sgn;
 piv.userData.mats=[mW,mB];      // exposed so mythic coats can tint the wings (see tintWings)
 piv.rotation.z=sgn*0.42;
 return piv;
}

function nameSprite(text){

    quietly cutting "MEADOWLARK ARENA" down to "MEADOWLARK". */

 const c=cv.getContext('2d');

 c.beginPath();c.roundRect(56,12,400,104,44);c.fill();

 const label=text.slice(0,22);
 let fs=56;
 c.font='700 '+fs+'px "Trebuchet MS",sans-serif';
 while(c.measureText(label).width>384&&fs>24){fs-=2;c.font='700 '+fs+'px "Trebuchet MS",sans-serif';}
 c.fillText(label,256,68+fs*0.34);

}

/* The rider is a generated, textured mesh — a girl in show kit, seated, reins in hand —
   made the same way as the horse: a FLUX.2 reference, Hunyuan3D for the shape, a baked
   texture, smooth normals. She has no skeleton, so the life in her comes from a vertex
   shader instead: everything above the hip leans and breathes as a rotation about the
   hip, the head turns about the neck, and the whole figure posts with the gait from the
   group, exactly as the old blob figure did. The boots stay where they are, which is what
   a good seat does anyway. Custom shirt and breeches colours are recoloured by height
   band, so the defaults (navy coat, cream breeches) show the baked texture untouched.
   Group origin = hip centre, +z = the way she faces, same frame the blob rider used, so
   every seat in the game (player, club riders, NPCs) keeps its numbers. */

function riderRefit(){for(const R of RIDER_MESH.riders)R._fit();}
new GLTFLoader().load('assets/models/rider_seat_textured.glb',g=>{

 if(!mesh)return;

   .replace('#include <begin_vertex>',`#include <begin_vertex>
 { vec3 rHIP=vec3(0.,-0.18,-0.30), rNECK=vec3(0.,0.55,-0.22);
   transformed.x+=sign(position.x)*uSpread*rwL;   // straddle: the reference sat on nothing, the horse has a barrel

   all-or-nothing, which is why turning felt like a light switch on a phone — the
   game already carries analog turn and throttle for VR, so the stick simply feeds
   the same two values and the flat game reads them the same way.

   Floating, not fixed: the stick centres itself wherever the thumb first lands
   anywhere in the lower-left, so it never has to be looked at or aimed for. */
{
 const zone=$('stickZone'),base=$('stickBase'),knob=$('stickKnob');
 const R=58, DEAD=0.14;
 let id=null,cx=0,cy=0;
 const place=(el,x,y)=>{el.style.left=x+'px';el.style.top=y+'px';};
 const release=()=>{
  id=null;zone.classList.remove('on');

  touch.go=touch.left=touch.right=false;

  zone.addEventListener('pointerdown',e=>{
   if(id!==null)return;
   e.preventDefault();
   id=e.pointerId;
   try{zone.setPointerCapture(id);}catch(err){}   // capture is an optimisation, not a requirement

function weeklyFeatured(){

/* ================= online multiplayer: clubs, chat & friends =================
   SOCIAL gates this whole layer — the MQTT connection, chat, remote riders, profiles,
   friends, invite links and club rankings. With it off the game is purely single player
   and never contacts the broker; the code stays put so flipping this back to true
   restores everything. Trail Pass and milestone rewards are NOT social and stay on. */
const SOCIAL=true;
const net={client:null,id:'p'+Math.random().toString(36).slice(2,8),club:null,lastPub:0};

/* Your club code is your room. It used to default to "kestrel" for everybody, which
   meant anyone who pressed Connect landed in ONE shared room with open chat and
   whoever else happened to be there. The broker is public and unauthenticated, so
   that is a room full of strangers by default.
   Now every player gets their own random code the first time they look, and you ride
   with people you sent the invite link to. Treat the code like a password: anyone who
   has it can join and read the chat. */
function myClub(){
 const s=freshSave()||{};
 if(s.club)return s.club;
 const code='mr-'+Math.random().toString(36).slice(2,8);
 syncSave(sv=>{ if(!sv.club)sv.club=code; });
 return (freshSave()||{}).club||code;
}

let _mqttLoad=null;
function loadMQTT(){
 if(typeof mqtt!=='undefined')return Promise.resolve(true);
 if(_mqttLoad)return _mqttLoad;
 _mqttLoad=new Promise(res=>{
  const el=document.createElement('script');
  el.src='assets/vendor/mqtt/mqtt.min.js';
  el.onload=()=>res(typeof mqtt!=='undefined');
  el.onerror=()=>res(false);
  document.head.appendChild(el);
 });
 return _mqttLoad;
}

/* Give a remote rider the same rigged horse the player rides. SkeletonUtils.clone is
   what makes this possible: a plain .clone() on a SkinnedMesh shares the ORIGINAL
   skeleton, so every remote rider would pose identically to you and to each other.
   Capped, because each clone is a 26k-vertex skinned mesh with its own 33-bone
   skeleton to update every frame — past a handful that cost is real, and the
   procedural horse is a perfectly good stand-in for a distant dot. */
/* A bridle for the rigged horse. The procedural one is parented to the procedural
   head, so it cannot simply be kept — the rig's muzzle is somewhere else entirely.
   These are the same mouth-corner coordinates attachTack uses for the rein anchors. */
function remoteBridle(){
 const g=new THREE.Group();
 const strap=smat('#4a3526');
 const nose=new THREE.Mesh(new THREE.TorusGeometry(0.115,0.017,6,14),strap);
 nose.position.set(0,1.33,0.94); nose.rotation.x=0.12; g.add(nose);
 const brow=new THREE.Mesh(new THREE.TorusGeometry(0.15,0.016,6,14),strap);
 brow.position.set(0,1.50,0.68); brow.rotation.x=Math.PI/2; g.add(brow);
 const cheek=(x)=>{const b=box(0.018,0.30,0.018,'#4a3526',x,1.42,0.80,g);b.rotation.x=0.5;return b;};
 cheek(-0.125); cheek(0.125);
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
 return g;
}
const REMOTE_RIG_MAX=6;
let remoteRigCount=0;
function makeRemoteRig(){
 if(!RIG.ready||!RIG.scene||!RIG.fitScale)return null;
 if(remoteRigCount>=REMOTE_RIG_MAX||quality==='low')return null;
 let sc;
 try{ sc=skeletonClone(RIG.scene); }catch(e){ return null; }
 let skin=null;
 sc.traverse(o=>{ if(o.isSkinnedMesh&&!skin)skin=o; });
 if(!skin)return null;
 sc.scale.setScalar(RIG.fitScale);
 sc.position.set(0,RIG.fitY,0);
 sc.rotation.set(0,-Math.PI/2,0);     // same model->game orientation as the player's
 sc.visible=true;
 remoteRigCount++;
 return {scene:sc,bones:skin.skeleton.bones,phase:Math.random()};
}
function remoteUpdate(m){
 if(typeof m.x!=='number'||typeof m.z!=='number')return;
 let r=remotes[m.id];
 if(!r){
  if(Object.keys(remotes).length>=12)return;
  const parts=makeHorse({colors:(m.c&&m.c.body)?m.c:{body:'#8a5a2b',mane:'#332214'},tack:m.k||'#7a583a',bridle:true,seed:5,wings:!!m.wg,coat:m.ct||null});
  const rider=makeRider({shirt:m.s||RIDER_DEF_SHIRT,pants:m.p||RIDER_DEF_PANTS,hair:m.hr||null,skin:m.sk||null,helmet:m.hm||null});
  parts.group.add(rider.g);
  /* Swap in the good horse. The procedural body goes, and so does its tack — the
     procedural saddle sits at y≈1.75 and its bridle hangs off the procedural head,
     both shaped for a horse that is no longer there. Hiding the body but keeping
     that tack left a saddle floating in mid-air; keeping neither left the rider
     perched on nothing. So the rigged remote gets the SAME saddle, bridle position
     and rider seat the player's own rigged mount uses. */
  const rrig=makeRemoteRig();
  let r_bridle=null;
  if(rrig){
   const keep=new Set();
   if(parts.wings)parts.wings.forEach(w=>w.traverse(o=>keep.add(o)));
   rider.g.traverse(o=>keep.add(o));
   parts.group.traverse(o=>{ if(o.isMesh&&!keep.has(o))o.visible=false; });
   parts.group.add(rrig.scene);

   const sd=buildSaddle();                       // same builder the player's mount uses
   sd.position.set(0,SADDLE_Y,SADDLE_Z);
   parts.group.add(sd);
   const br=buildBridle(); parts.group.add(br); r_bridle=br;
   // The rider was still sitting where the PROCEDURAL horse's back was, which is
   // higher and further forward than the rig's — that is the "floating up high".
   rider.g.position.set(0,RID2_Y,RID2_Z);
  }
  const nm=String(m.n||'Rider').slice(0,14);
  const tag=nameSprite((isFriend(nm)?'💚':'🌐')+nm);
  tag.position.y=3.15;
  parts.group.add(tag);
  scene.add(parts.group);
  r=remotes[m.id]={parts,rider,rig:rrig,bridle:r_bridle,name:nm,x:m.x,z:m.z,tx:m.x,tz:m.z,heading:m.h||0,sp:0,phase:Math.random()*6,lastSeen:0};
  chatMsg('🌐',nm+' is riding nearby!');
 }
 r.tx=m.x;r.tz=m.z;
 r.theading=m.h||0;
 r.sp=m.sp||0;
 r.lastSeen=0;
 if(m.c&&m.c.body)r.colors=m.c;
 if(m.hn)r.horseName=m.hn;
 if(m.b)r.breed=m.b;
 r.wings=!!m.wg;
 if(m.ct)r.coat=m.ct;
 if(m.hl)r.horseLv=m.hl;
}
function netTick(dt,t){

    h:+player.heading.toFixed(2),sp:+Math.abs(player.speed).toFixed(1),
    c:h?h.colors:null,k:h?(h.tack||'#7a583a'):null,
    s:(s.rider&&s.rider.shirt)||RIDER_DEF_SHIRT,p:(s.rider&&s.rider.pants)||RIDER_DEF_PANTS,hr:(s.rider&&s.rider.hair)||null,sk:(s.rider&&s.rider.skin)||null,hm:(s.rider&&s.rider.helmet)||null,
    hn:h?String(h.name).slice(0,14):null,b:h?(h.breed||null):null,hl:h?(h.level||1):1,wg:!!(h&&h.wings),ct:h?(h.coat||null):null,
   }));
  }catch(e){}
 }
 for(const id of Object.keys(remotes)){
  const r=remotes[id];
  r.lastSeen+=dt;
  if(r.lastSeen>7){
   scene.remove(r.parts.group);
   if(r.rig)remoteRigCount=Math.max(0,remoteRigCount-1);   // free the slot for the next rider
   delete remotes[id];
   continue;
  }
  r.x+=(r.tx-r.x)*Math.min(1,dt*5);
  r.z+=(r.tz-r.z)*Math.min(1,dt*5);
  if(typeof r.theading==='number'){
   let dh=r.theading-r.heading;
   while(dh>Math.PI)dh-=Math.PI*2;
   while(dh<-Math.PI)dh+=Math.PI*2;
   r.heading+=dh*Math.min(1,dt*6);
  }
  if(r.rig){
   // the good horse: same gait code the player's mount runs
   r.rig.phase+=rigPhaseStep(r.sp,true,dt);
   poseRigBones(r.rig.bones,r.rig.phase,r.sp,true,0,t,dt);
   if(r.bridle)r.bridle.userData.follow(r.rig.bones[RIG.headIdx==null?6:RIG.headIdx],r.rig.bones,RIG.restQ,r.rig.scene,r.parts.group);
  }
  r.phase+=dt*(2.2+r.sp*1.9);
  const g3=gaitFor(r.sp);
  animateHorse(r.parts,r.phase,r.sp<0.2?0:g3.amp,g3,true,t,0,dt);
  r.parts.group.position.set(r.x,groundH(r.x,r.z),r.z);
  r.parts.group.rotation.y=r.heading;
  r.rider.g.rotation.x=0;
  if(r.rider.u)r.rider.u.uLean.value=0.06+0.2*Math.min(1,r.sp/6)+Math.sin(r.phase)*0.03;
 }
}

function updatePet(dt,t){
 if(!petComp)return;
 const off=2.2;
 const bx=player.pos.x-Math.sin(player.heading)*off+Math.cos(player.heading)*0.9;
 const bz=player.pos.z-Math.cos(player.heading)*off-Math.sin(player.heading)*0.9;
 const dx=bx-petComp.pos.x,dz=bz-petComp.pos.z,d=Math.hypot(dx,dz);
 if(d>40){petComp.pos.set(bx,0,bz);}      // catch up after fast travel
 let sp=0;
 if(d>0.6){
  const want=Math.atan2(dx,dz);let dh=want-petComp.heading;
  while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
  petComp.heading+=dh*Math.min(1,dt*7);
  sp=Math.min(11,1.4+d*0.7);
  petComp.pos.x+=Math.sin(petComp.heading)*sp*dt;
  petComp.pos.z+=Math.cos(petComp.heading)*sp*dt;
 }
 petComp.phase+=dt*(3+sp*2.2);
 const hop=sp>0.3?Math.abs(Math.sin(petComp.phase))*0.06*Math.min(1,sp/4):0;
 petComp.parts.group.position.set(petComp.pos.x,groundH(petComp.pos.x,petComp.pos.z)+hop,petComp.pos.z);
 petComp.parts.group.rotation.y=petComp.heading;
 const L=petComp.parts.legs;
 for(let i=0;i<4;i++){const o=i<2?0:Math.PI;L[i].rotation.x=Math.sin(petComp.phase+(i%2?Math.PI:0)+o)*0.5*Math.min(1,sp/3);}
 petComp.parts.tail.rotation.z=Math.sin(t*6)*0.25;  // happy wag
}

// long-haul variants share their hooks with the base types
function dailyTypeAliases(type){return type==='gallop'?['gallop','gallop2k']:type==='feed'?['feed','feed6']:[type];}
function todayDaily(){
 const ds=new Date().toDateString();
 let h=0;for(let i=0;i<ds.length;i++)h=(h*31+ds.charCodeAt(i))|0;
 const idx=[];let k=Math.abs(h)||1;
 while(idx.length<3){k=(k*1103515245+12345)%2147483647;const j=k%DAILYQ.length;if(!idx.includes(j))idx.push(j);}
 return idx.map(i=>DAILYQ[i]);
}
function ensureDq(s){
 const ds=new Date().toDateString();
 if(!s.dq||s.dq.date!==ds)s.dq={date:ds,prog:{},claimed:{}};
}
function dailyEvt(type,val){
 val=val||1;
 const today=todayDaily();
 for(const ty of dailyTypeAliases(type)){
  const q=today.find(q=>q.type===ty);
  if(!q)continue;
  let crossed=false;
  syncSave(s=>{
   ensureDq(s);
   const before=s.dq.prog[ty]||0;
   if(s.dq.claimed[ty]||before>=q.goal)return;
   s.dq.prog[ty]=Math.min(q.goal,before+val);
   crossed=before<q.goal&&s.dq.prog[ty]>=q.goal;
  });
  if(crossed)toast('📋 Daily quest done: '+q.label+' — claim it in 📜 Quests!');
 }
}
function claimUmbrella(){
 let ok=false;

 if(ok){refreshWallet();sGem();toast('🌂 Umbrella: +1🗝️ +1💎');renderQuests();}
}
function claimDaily(type){
 const q=todayDaily().find(q=>q.type===type);if(!q)return;
 let ok=false;
 syncSave(s=>{
  ensureDq(s);
  if(s.dq.claimed[type]||(s.dq.prog[type]||0)<q.goal)return;
  s.dq.claimed[type]=true;

let storyIdx=0,storyProg=0,nearNPC=false;
try{if(save&&save.story){storyIdx=save.story.idx||0;storyProg=save.story.prog||0;}}catch(e){}
function saveStory(){syncSave(s=>{s.story={idx:storyIdx,prog:storyProg};});}
function missionDone(){const m=STORY[storyIdx];return m&&storyProg>=m.goal;}
function questEvt(type,val){
 const m=STORY[storyIdx];
 if(!m||m.type!==type||storyProg>=m.goal)return;
 if(type==='event'){if(val===m.ev)storyProg=m.goal;}
 else if(type==='forage'){if(val===m.item)storyProg=Math.min(m.goal,storyProg+1);}
 else storyProg=Math.min(m.goal,storyProg+val);
 saveStory();
 if(storyProg>=m.goal){const g=NPC_DEFS.find(x=>x.id===(m.npc||'wren'))||NPC_DEFS[0];toast('📜 Done! Ride back and tell '+g.name);}
}
function npcShort(def){return def.name.replace('Grandpa ','').replace('Farmer ','').replace('Sheriff ','');}
function openDlg(){
 const q=nearNPC||npcList[0], def=q.def, m=STORY[storyIdx], d=$('dlg');
 const head='<b>'+def.icon+' '+def.name+'</b>';
 const giver=m?(m.npc||'wren'):null, mine=m&&giver===def.id;
 if(m&&m.type==='talk'&&m.talk===def.id&&storyProg<m.goal){storyProg=m.goal;saveStory();}   // the conversation is the mission
 if(m&&m.type==='guess'&&mine&&storyProg<m.goal){                                              // a clue and three suspects
  d.innerHTML=head+'<p>'+m.text+'</p><p style="font-size:13px;color:#5a4a3a">🔍 '+m.clue+'</p>'
   +m.options.map((o,i)=>'<button data-g="'+i+'" style="display:block;margin:4px 0">'+o+'</button>').join('')+'<button id="dlgBtn" style="margin-top:6px">Let me think…</button>';
  d.style.display='block';
  d.querySelectorAll('[data-g]').forEach(b=>{b.onclick=()=>{ if(+b.dataset.g===m.answer){storyProg=m.goal;saveStory();sGem();toast('🔍 Solved!');openDlg();} else toast(m.wrong||'Hmm — look at the clues again.'); };});
  $('dlgBtn').onclick=()=>{d.style.display='none';};
  return;
 }
 if(!m){
  d.innerHTML=head+'<p>'+(def.id==='wren'?'You brought the Silver Kestrel home, champion. Your grandmother would have loved to see it. Ride free! 🏆':def.idle)+'</p><button id="dlgBtn">🐴</button>';
 }else if(mine&&missionDone()){
  const r=m.reward;
  d.innerHTML=head+'<p>Wonderful work! Here — you earned it: <b>'+(r.c||0)+'🪙'+(r.g?' +'+r.g+'💎':'')+(r.k?' +'+r.k+'🗝️':'')+(r.gear?' + a Legendary piece of tack':'')+'</b></p><button id="dlgBtn">Claim ✨</button>';
 }else if(mine){
  d.innerHTML=head+(m.ch?'<div style="font-size:11px;color:#8c7a63;letter-spacing:.04em">📖 '+m.ch+'</div>':'')+'<p>'+m.text+'</p><span style="color:#8c7a63;font-size:13px">📜 '+m.label+(m.goal>1?' ('+Math.floor(storyProg)+'/'+m.goal+')':'')+'</span><br><br><button id="dlgBtn">On it!</button>';
 }else{
  const g=NPC_DEFS.find(x=>x.id===giver)||NPC_DEFS[0];
  d.innerHTML=head+'<p>'+def.idle+'</p><span style="color:#8c7a63;font-size:13px">📜 '+m.label+' — '+(missionDone()?'tell '+npcShort(g):'ask '+npcShort(g)+' about it')+'</span><br><br><button id="dlgBtn">🐴</button>';
 }
 d.style.display='block';
 $('dlgBtn').onclick=()=>{
  if(m&&mine&&missionDone()){
   addCoins(m.reward.c||0);
   if(m.reward.g)addGems(m.reward.g);
   if(m.reward.k){syncSave(s=>{s.keys=(s.keys||0)+m.reward.k;});refreshWallet();}
   if(m.reward.gear){syncSave(s=>{s.tack=s.tack||[];s.tack.push(genGear(m.reward.gear));});refreshTack();toast('🐎 A Legendary piece is in your tack locker!');}
   sGem();
   storyIdx++;storyProg=0;saveStory();
   const nm=STORY[storyIdx];
   toast('📜 Mission complete! '+(nm?(nm.ch&&nm.ch!==m.ch?'New chapter: '+nm.ch:'New mission from '+npcShort(NPC_DEFS.find(x=>x.id===(nm.npc||'wren'))||NPC_DEFS[0])):'Story complete! 🏆'));
  }
  d.style.display='none';
 };

/* Treasure. Twelve chests hidden across the Basin, marked on the map as a treasure map
   should be, opened at the press of a key and refilled three days later. Four sets of five
   collectibles, one set to a region, each set worth gems and a key when complete. A locked
   tack room by the barn that a Silver Key opens once a week for a piece that is rare at
   least. And Loon Lake to fish, with a bite to catch and, now and then, a bottle. */
const things=[];   // {kind,id,g,x,z,...}
function mkChest(c){
 const g=new THREE.Group();
 box(0.9,0.5,0.6,'#6b4423',0,0.25,0,g); const lid=box(0.92,0.22,0.62,'#7d5230',0,0.6,-0.0,g); lid.position.z=-0.0;
 box(0.12,0.16,0.05,'#d8b24a',0,0.42,0.31,g); box(0.94,0.05,0.64,'#4a2f18',0,0.02,0,g);
 g.position.set(c.x,groundH(c.x,c.z),c.z); g.rotation.y=Math.atan2(-c.x,-c.z);
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;}}); scene.add(g); return {kind:'chest',id:c.id,g,lid,x:c.x,z:c.z,tier:c.tier};
}
function mkCollectible(set,i,pt){
 const g=new THREE.Group(); const col=COLL_SETS[set].col;
 const mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.35,roughness:0.4});
 let m; if(set==='shells')m=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,8),mat),m.scale.set(1,0.5,1);
 else if(set==='feathers')m=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,0.02),mat),m.rotation.z=0.5;
 else if(set==='crystals')m=new THREE.Mesh(new THREE.OctahedronGeometry(0.24,0),mat);
 else m=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.16,0.3,10),mat);
 m.position.y=0.5; m.castShadow=true; g.add(m);
 g.position.set(pt[0],groundH(pt[0],pt[1]),pt[1]); scene.add(g); return {kind:'coll',set,i,id:set+'_'+i,g,m,x:pt[0],z:pt[1]};
}
function mkTackRoom(){
 const g=new THREE.Group(); const x=TACK_ROOM.x,z=TACK_ROOM.z;
 box(3.2,2.4,2.6,'#e9dcc0',0,1.2,0,g); box(3.5,0.16,2.9,'#b5633a',0,2.5,0,g); const door=box(0.9,1.7,0.08,'#6b4423',0,0.85,1.31,g); box(0.14,0.14,0.06,'#d8b24a',0.3,0.9,1.36,g);
 g.position.set(x,groundH(x,z),z); g.rotation.y=Math.atan2(-x,-z)+Math.PI; g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}}); scene.add(g);
 colliders.push({x,z,r:2.0});
 const sp=nameSprite("🔐 Grandma's tack room"); sp.position.y=3.1; g.add(sp);
 return {kind:'room',id:'tackroom',g,door,x,z};
}
{
 for(const c of CHESTS)things.push(mkChest(c));
 for(const set in COLL_SETS)COLL_SETS[set].pts.forEach((pt,i)=>things.push(mkCollectible(set,i,pt)));
 things.push(mkTackRoom());
 things.push({kind:'fish',id:'lake',x:20,z:16,g:null});
 setTimeout(()=>{const sv=freshSave(); if(!sv)return; for(const t of things){ if(t.kind==='coll'&&sv.sets&&sv.sets[t.set]&&sv.sets[t.set].includes(t.i))t.g.visible=false; if(t.kind==='chest'&&sv.chests&&sv.chests[t.id]&&Date.now()-sv.chests[t.id]<CHEST_REOPEN)t.lid.rotation.x=-1.2; }},1500);
}
let nearThing=null, fishing=null;
function thingLabel(t){
 if(t.kind==='chest'){const sv=freshSave(); const at=sv&&sv.chests&&sv.chests[t.id]; const open=at&&Date.now()-at<CHEST_REOPEN; return open?'🎁 Chest (refills in '+Math.ceil((CHEST_REOPEN-(Date.now()-at))/3600000)+'h)':'🎁 Open the chest (E)';}
 if(t.kind==='room'){const sv=freshSave(); const used=sv&&sv.tackRoom===weekKey(); return used?'🔐 Tack room (opens again next week)':'🔐 Unlock with a Silver Key (E)';}
 if(t.kind==='fish')return fishing?(fishing.bit?'❗ BITE — reel in (E)!':'🎣 Waiting for a bite…'):'🎣 Fish (E)';
 return '';
}
function useThing(){
 const t=nearThing; if(!t)return;
 if(t.kind==='chest'){
  let got=null;
  syncSave(sv=>{ sv.chests=sv.chests||{}; const at=sv.chests[t.id]; if(at&&Date.now()-at<CHEST_REOPEN)return;
   sv.chests[t.id]=Date.now(); const r={c:t.tier===1?80+Math.floor(Math.random()*80):t.tier===2?200:300};
   if(t.tier>=2)r.k=1; if(t.tier===3){r.g=2;r.gear='Rare';} if(t.tier===1){const fk=['carrot','apple','lettuce','pumpkin'][Math.floor(Math.random()*4)];sv.items[fk]=(sv.items[fk]||0)+3;r.food=fk;}
   sv.coins+=r.c; if(r.k)sv.keys=(sv.keys||0)+r.k; if(r.g)sv.gems+=r.g; if(r.gear){sv.tack=sv.tack||[];sv.tack.push(genGear(r.gear));} sv.stats=sv.stats||{}; sv.stats.chests=(sv.stats.chests||0)+1; got=r; });
  if(!got){toast('The chest is empty — it refills in a few days.');return;}
  t.lid.rotation.x=-1.2; refreshWallet(); refreshTack(); sGem(); passAdd(5);
  toast('🎁 '+got.c+'🪙'+(got.k?' +'+got.k+'🗝️':'')+(got.g?' +'+got.g+'💎':'')+(got.gear?' + Rare tack!':'')+(got.food?' + 3 '+FOODS3[got.food].emoji:''));
 }else if(t.kind==='room'){
  let ok=false,piece=null;
  syncSave(sv=>{ if(sv.tackRoom===weekKey())return; if((sv.keys||0)<1)return; sv.keys--; sv.tackRoom=weekKey(); const r=Math.random(); piece=genGear(r<0.05?'Legendary':r<0.3?'Epic':'Rare'); sv.tack=sv.tack||[]; sv.tack.push(piece); sv.coins+=100; ok=true; });
  if(!ok){const sv=freshSave(); toast(sv&&sv.tackRoom===weekKey()?'Grandma\'s tack room opens once a week.':'You need a Silver Key.');return;}
  t.door.rotation.y=-1.3; refreshWallet(); refreshTack(); sGem(); toast('🔐 '+piece.rarity+'! '+piece.name+' — and 100🪙 in the tin');
 }else if(t.kind==='fish'){
  if(!fishing){ fishing={t:2+Math.random()*4,bit:false,win:0}; toast('🎣 Cast… keep still and wait for the bite'); return; }
  if(fishing.bit){ const r=Math.random(); const c=r<0.05?{n:'a bottle with a note',c:60,k:1,bottle:true}:r<0.15?{n:'a Golden Loon Perch',c:150,g:1}:r<0.45?{n:'a Trout',c:70}:{n:'a Bass',c:40};
   syncSave(sv=>{sv.fish=sv.fish||{n:0,bottles:0}; sv.fish.n++; if(c.bottle)sv.fish.bottles++; sv.coins+=c.c; if(c.k)sv.keys=(sv.keys||0)+c.k; if(c.g)sv.gems+=c.g;});
   refreshWallet(); sChime(); if(c.g||c.k)sGem(); toast('🎣 Caught '+c.n+'! +'+c.c+'🪙'+(c.g?' +1💎':'')+(c.k?' +1🗝️':'')); dailyEvt('fish',1); passAdd(3); fishing=null; }
 }
}
function tickThings(dt){
 nearThing=null; let best=1e9;
 for(const t of things){ const d=Math.hypot(player.pos.x-t.x,player.pos.z-t.z);
  if(t.kind==='coll'){ if(t.g.visible){t.m.rotation.y+=dt*1.5; if(d<1.6&&player.y<1.2)collect(t);} continue; }
  const reach=t.kind==='fish'?8:t.kind==='room'?5.2:3.2; if(d<reach&&d<best){best=d;nearThing=t;} }   // the room has a collider, so its reach starts outside it
 if(fishing){ if(Math.abs(player.speed)>0.6||!nearThing||nearThing.kind!=='fish'){fishing=null;toast('The line went slack.');}
  else if(!fishing.bit){fishing.t-=dt; if(fishing.t<=0){fishing.bit=true;fishing.win=1.0;sChime();toast('❗ Bite! Press E');}}
  else {fishing.win-=dt; if(fishing.win<=0){fishing=null;toast('It got away…');}} }
}
function collect(t){
 t.g.visible=false; let done=false,cnt=0;
 syncSave(sv=>{ sv.sets=sv.sets||{}; const a=sv.sets[t.set]=sv.sets[t.set]||[]; if(!a.includes(t.i))a.push(t.i); cnt=a.length;
  if(cnt>=5&&!(sv.setsDone&&sv.setsDone[t.set])){ sv.setsDone=sv.setsDone||{}; sv.setsDone[t.set]=true; const r=COLL_SETS[t.set].reward; sv.gems+=r.g||0; sv.keys=(sv.keys||0)+(r.k||0); done=true; } });
 sCoin(); passAdd(3); refreshWallet();
 toast(COLL_SETS[t.set].label+' '+cnt+'/5'+(done?' — set complete! +2💎 +1🗝️':''));

/* ================= gaits ================= */
/* `len` is stride length in metres — the ground covered by one full leg cycle. Driving the
   cycle from distance/len instead of from a clock is what stops the hooves skating: the
   stance hoof now travels backwards at very close to -v, which is the definition of a
   planted foot. Time-driven phase made the legs churn ~40% too fast at a gallop. */
const GAITS={
 walk:{off:[0,Math.PI,Math.PI*0.5,Math.PI*1.5],amp:0.42,rate:1.6,len:1.7},
 trot:{off:[0,Math.PI,Math.PI,0],amp:0.62,rate:1.9,len:2.7},
 gallop:{off:[0,0.45,Math.PI+0.3,Math.PI],amp:0.95,rate:1.55,len:5.8},
};
function gaitFor(sp){return sp<2.8?GAITS.walk:sp<7?GAITS.trot:GAITS.gallop;}
function animateHorse(parts,phase,amp,gait,grounded,t,grazing,dt){
 const k=dt?Math.min(1,dt*14):1;
 for(let i=0;i<4;i++){
  const o=gait.off[i];
  const swing=Math.sin(phase+o)*amp*(i<2?0.55:0.6);
  const lift=Math.max(0,Math.sin(phase+o+Math.PI*0.5));
  const hip=parts.legs[i].hip,knee=parts.legs[i].knee;
  hip.rotation.x+=(swing-hip.rotation.x)*k;
  knee.rotation.x+=((grounded?-lift*amp*1.15:-0.55)-knee.rotation.x)*k;
 }
 parts.tail.rotation.x=0.5+Math.sin(phase*0.55)*0.16;
 parts.tail.rotation.z=Math.sin(phase*0.4+1)*0.12;
 if(parts.wings){
  const pow=parts.wingPow||0;
  for(const w of parts.wings){
   const sgn=w.userData.sgn;
   const flap=grounded
    ?Math.sin(t*2.1)*0.06+Math.sin(phase)*0.05*amp
    :Math.sin(t*(6.5+pow*4.5))*(0.38+0.4*pow);
   w.rotation.z=sgn*(0.54+(grounded?flap:0.1+0.12*(1-pow)+flap));   // higher dihedral -> wings arc up, clear the rider
   w.rotation.x=grounded?0:-(0.12+0.12*pow);
  }
 }
 if(grazing>0){
  parts.neck.rotation.x+=(0.55-parts.neck.rotation.x)*0.06;
  parts.head.rotation.x+=(0.85-parts.head.rotation.x)*0.06;
 }else{
  parts.head.rotation.x+=(0.63-parts.head.rotation.x)*0.08;
 }
}

 {const sw=$('stamWrap'); if(sw){const show=(course&&course.started)||player.stam<0.98||player.blown; sw.style.display=show?'block':'none'; if(show){$('stamFill').style.width=Math.round(player.stam*100)+'%'; sw.classList.toggle('blown',!!player.blown);}}}

  /* Ride the horse, do not chase it.

     the MESH, not to this, so there was never anything bumpy in here to smooth. The filter's
     only real job is absorbing the discontinuities: collision push-out, landings, fast
     travel. Running every frame through it instead cost lag, and the velocity lead added to
     cancel that lag pointed along the OLD heading through a turn — up to 0.89 m sideways at
     a gallop, which is the "floating beside the horse". Vertically the same filter with no
     lead sank the rider into it on a climb.

     separation while riding, which is also what keeps the reins attached to your hands. */
  const step=Math.hypot(tX-vrPrevPos.x,tY-vrPrevPos.y,tZ-vrPrevPos.z);

  vrPos.x+=(tX-vrPos.x)*k;

<script>
/* Installable-app plumbing. Kept out of the game module on purpose: if any of
   this throws it must not take the game down with it. */
(function(){
 if('serviceWorker' in navigator&&location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
 }
 /* Chrome fires beforeinstallprompt only when the page actually qualifies to be
    installed, so the button appears if and only if pressing it will work — no
    dead "Install" that does nothing. iOS never fires it; there you use Share ->
    Add to Home Screen, which is why the hint below exists. */
 let deferred=null;
 addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferred=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='block';
 });
 addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('installBtn');
  if(!b)return;
  b.onclick=async()=>{
   if(!deferred)return;
   b.style.display='none';
   deferred.prompt();
   try{await deferred.userChoice;}catch(e){}
   deferred=null;
  };
  // already installed and launched from the home screen: nothing to offer
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)b.remove();
 });
 addEventListener('appinstalled',()=>{
  const b=document.getElementById('installBtn');if(b)b.remove();
 });
})();
</script>
