/* ===== Ranch building =====
   The ranch is yours to furnish: pick a piece from the catalogue, a ghost of it follows the
   pointer across the ground, turn it with R or Q, click to set it down. Five of the pieces
   are the generated props already in the world (hay bales, troughs, barrels, boulders,
   stumps) reused from their loaded geometry; the rest are built here. What you place is
   solid to the horses, saved, and rebuilt when you come back. Every piece is worth builder
   points, and points raise the ranch level, which does real things: horses get hungry more
   slowly, XP comes faster, forage grows back sooner. Nothing here costs anything but coins. */
const decorObjs=[];   // {d, g, coll}
function buildDecorMesh(t,forGhost){
 const c=DECOR_CAT[t]; if(!c)return null; const g=new THREE.Group();
 if(c.mk){ c.mk(g,forGhost,{box,tube,blob,THREE,nameSprite,smat}); }
 else if(c.prop){
  const src=PROP_SRC[c.prop]; if(!src)return null;
  const s=FOLIAGE_H[c.prop]/src.h; const m=new THREE.Mesh(src.geo,src.mat); m.scale.setScalar(s); m.position.y=-src.minY*s-0.05*FOLIAGE_H[c.prop]; m.castShadow=true; m.receiveShadow=true; g.add(m);
 }else if(t==='fence'){
  const L=c.len; for(const x of[-L/2,L/2])box(0.14,1.1,0.14,'#f4f0e6',x,0.55,0,g); box(L,0.09,0.06,'#f4f0e6',0,0.95,0,g); box(L,0.09,0.06,'#f4f0e6',0,0.55,0,g);
 }else if(t==='post'){ tube(0.07,0.08,1.3,'#5a3d22',0,0.65,0,g); box(0.9,0.08,0.08,'#5a3d22',0,1.22,0,g); blob(0.09,0.09,0.09,'#8a6a45',0,1.34,0,g); }
 else if(t==='planter'){ box(1.3,0.45,0.55,'#7a5236',0,0.22,0,g); box(1.2,0.08,0.45,'#4a3320',0,0.46,0,g); [['#ff8fab',-0.4],['#ffd166',0],['#b197fc',0.4]].forEach(([col,x])=>{blob(0.16,0.14,0.16,'#5a9a4a',x,0.58,0,g);blob(0.12,0.12,0.12,col,x,0.72,0,g);}); }
 else if(t==='lantern'){ tube(0.05,0.06,2.2,'#3a2e24',0,1.1,0,g); box(0.3,0.3,0.3,'#3a2e24',0,2.3,0,g); const lm=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffb347,emissiveIntensity:1.6,roughness:0.6})); lm.position.set(0,2.3,0); g.add(lm); }
 else if(t==='bench'){ box(1.5,0.08,0.45,'#8a6745',0,0.5,0,g); box(1.5,0.4,0.08,'#8a6745',0,0.78,-0.2,g); for(const x of[-0.6,0.6]){box(0.08,0.5,0.4,'#5a3d22',x,0.25,0,g);} }
 else if(t==='stand'){ for(const sg of[-1,1]){const a=box(0.08,1.0,0.08,'#8a6745',sg*0.25,0.5,0,g);a.rotation.z=-sg*0.25;} box(0.5,0.08,0.7,'#8a6745',0,0.98,0,g); blob(0.28,0.12,0.36,'#6b4423',0,1.06,0,g); }
 else if(t==='sapling'){ tube(0.06,0.08,1.4,'#6b4a2e',0,0.7,0,g); blob(0.55,0.5,0.55,'#5d9e4f',0,1.55,0,g); blob(0.4,0.38,0.4,'#7bbb60',0.2,1.8,0.1,g); }
 else if(t==='sign'){ for(const x of[-0.55,0.55])box(0.1,1.6,0.1,'#5a3d22',x,0.8,0,g); box(1.6,0.6,0.08,'#f4f0e6',0,1.35,0,g); if(!forGhost){const sp=nameSprite((freshSave()||{}).ranchName||'Meadowlark Ranch'); sp.position.set(0,1.36,0.08); sp.scale.set(1.5,0.38,1); g.add(sp);} }
 else if(t==='stall'){ box(4.2,0.12,3.6,'#a88a5a',0,0.06,0,g); box(4.2,2.4,0.14,'#e9dcc0',0,1.2,-1.75,g); for(const x of[-2.05,2.05])box(0.14,2.4,3.6,'#e9dcc0',x,1.2,0,g); box(4.4,0.14,3.9,'#b5633a',0,2.5,0,g); box(1.9,1.1,0.08,'#8a6745',-1.05,0.55,1.75,g); blob(0.7,0.35,0.5,'#d9b56a',1.0,0.35,-0.9,g); }
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 if(forGhost)g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=0.55;o.castShadow=false;}});
 return g;
}
function decorOk(t,x,z,skip){
 if(Math.hypot(x,z)>290)return 'Past the edge of the valley';   // the whole valley is yours to build in
 if(Math.abs(x)<27&&Math.abs(z)<22)return 'Not in the arena';
 if(Math.abs(z-riverZ(x))<8)return 'Not in the river';
 const c=DECOR_CAT[t]; if(!c)return 'Unknown piece'; const r=c.r;
 if(G.ranch&&G.ranch.decorOk){const v=G.ranch.decorOk(c,x,z,skip);if(v!==undefined)return v;}   // indoor rooms, walls and floors, land slots
 for(const o of decorObjs){ if(o===skip)continue; const oc=DECOR_CAT[o.d.t]||{r:0.3}; if(oc.flat||c.flat)continue; if(Math.hypot(o.d.x-x,o.d.z-z)<(r+oc.r)*0.85)return 'Overlaps another piece'; }
 for(const c of colliders){ if(c.decor)continue; if(Math.hypot(c.x-x,c.z-z)<c.r+r*0.6)return 'Something is in the way'; }
 return null;
}
function spawnDecor(d){
 const g=buildDecorMesh(d.t,false); if(!g)return null;
 g.position.set(d.x,groundH(d.x,d.z),d.z); g.rotation.y=d.ry||0; scene.add(g);
 const coll={x:d.x,z:d.z,r:DECOR_CAT[d.t].r,decor:true,id:d.id}; if(DECOR_CAT[d.t].r>0.35&&!DECOR_CAT[d.t].flat)colliders.push(coll);
 const o={d,g,coll}; decorObjs.push(o); return o;
}
function rebuildDecor(){
 const sv=freshSave(); if(!sv)return; sv.decor=sv.decor||[];
 _ranchLvlCache=ranchLevel(sv);
 for(const d of sv.decor){ if(decorObjs.some(o=>o.d.id===d.id))continue; if(!d.id)d.id=Math.random().toString(36).slice(2,8); const o=spawnDecor(d); }
}
const build={type:null,ghost:null,rot:0,remove:false,down:null,lastPt:null,moving:null,move:false};   // moving: the placed piece being picked up; move: click-a-piece mode
const _bray=new THREE.Raycaster(),_bndc=new THREE.Vector2(),_bpt=new THREE.Vector3();
function groundPoint(cx,cy){
 _bndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1); _bray.setFromCamera(_bndc,camera);
 let y=groundH(player.pos.x,player.pos.z);
 for(let k=0;k<3;k++){ const t=(y-_bray.ray.origin.y)/_bray.ray.direction.y; if(!(t>0))return null; _bpt.copy(_bray.ray.origin).addScaledVector(_bray.ray.direction,t); y=groundH(_bpt.x,_bpt.z); }
 return _bpt;
}
function buildHud(msg,bad){const h=$('buildHud'); h.style.display=msg?'block':'none'; h.classList.toggle('bad',!!bad); if(msg)h.innerHTML=msg;}
function startPlace(t){
 endBuild(); const c=DECOR_CAT[t]; if(!c)return;

 build.type=t; build.ghost=g; build.rot=0; g.visible=false; scene.add(g); hidePanels();
 buildHud(c.emoji+' Placing <b>'+c.label+'</b> · '+(c.gems?c.gems+'💎':c.price+'🪙')+' · click the ground to set it down · R / Q turn (Shift: fine) · Esc done<button data-bh="rot">↻</button><button data-bh="rotf" title="Fine turn">↻°</button><button data-bh="done">Done</button>');

}
/* Pick a placed piece up again: it becomes the ghost, and setting it down costs nothing. */
function startMove(o){ if(!o)return false; const c=DECOR_CAT[o.d.t]; if(!c)return false; endBuild(); const g=buildDecorMesh(o.d.t,true); if(!g)return false;
 build.type=o.d.t; build.moving=o; build.rot=o.d.ry||0; build.ghost=g; g.visible=false; scene.add(g); o.g.visible=false; hidePanels();
 buildHud(c.emoji+' Moving <b>'+c.label+'</b> · click the ground to set it down · R / Q turn (Shift: fine) · Esc puts it back<button data-bh="rot">↻</button><button data-bh="rotf" title="Fine turn">↻°</button><button data-bh="done">Put back</button>');
 $('buildHud').querySelectorAll('[data-bh]').forEach(b=>{b.onclick=e=>{e.stopPropagation(); if(b.dataset.bh==='rot')build.rot+=Math.PI/4; else if(b.dataset.bh==='rotf')build.rot+=Math.PI/16; else endBuild(); if(build.ghost)build.ghost.rotation.y=build.rot;};});
 return true; }
function startMoveMode(){ endBuild(); build.move=true; hidePanels(); buildHud('✋ Click a piece to pick it up · Esc done<button data-bh="done">Done</button>'); $('buildHud').querySelector('[data-bh]').onclick=e=>{e.stopPropagation();endBuild();}; }
function startRemove(){ endBuild(); build.remove=true; hidePanels(); buildHud('🧹 Click a piece to remove it (half its price back) · Esc done<button data-bh="done">Done</button>'); $('buildHud').querySelector('[data-bh]').onclick=e=>{e.stopPropagation();endBuild();}; }
function endBuild(){ if(build.ghost){scene.remove(build.ghost);build.ghost=null;} if(build.moving){build.moving.g.visible=true;build.moving=null;} build.type=null; build.remove=false; build.move=false; buildHud(null); }
function placeAt(x,z){
 const t=build.type; if(!t)return false; const c=DECOR_CAT[t];
 if(G.ranch&&G.ranch.snap){const q=G.ranch.snap(c,x,z,build.rot,build.moving);if(q){x=q.x;z=q.z;if(q.ry!=null)build.rot=q.ry;}}   // walls snap end to end
 const mv=build.moving;
 const why=decorOk(t,x,z,mv); if(why){toast('🚫 '+why);return false;}
 if(mv){   // a piece picked up again: same piece, new spot, nothing to pay
  const nx=+x.toFixed(2),nz=+z.toFixed(2),ry=+build.rot.toFixed(3);
  syncSave(sv=>{const d=(sv.decor||[]).find(d=>d.id===mv.d.id);if(d){d.x=nx;d.z=nz;d.ry=ry;}});
  mv.d.x=nx;mv.d.z=nz;mv.d.ry=ry; mv.g.position.set(nx,groundH(nx,nz),nz); mv.g.rotation.y=ry; mv.g.visible=true; if(mv.coll){mv.coll.x=nx;mv.coll.z=nz;}
  build.moving=null; endBuild(); sChime(); toast(c.emoji+' '+c.label+' moved'); return true;
 }
 let ok=false,d=null,sp=0;
 syncSave(sv=>{ sv.decor=sv.decor||[]; if(sv.decor.length>=2000){toast('That is two thousand pieces — even this valley has to stop somewhere!');return;}
  if(c.gems){ if((sv.gems||0)<c.gems){toast('Not enough gems — '+c.gems+'💎');return;} sv.gems-=c.gems; }
  else if(sv.coins<c.price){toast('Not enough coins — '+c.price+'🪙');return;} else sv.coins-=c.price;
  d={id:Math.random().toString(36).slice(2,8),t,x:+x.toFixed(2),z:+z.toFixed(2),ry:+build.rot.toFixed(3)}; sv.decor.push(d);
  sp=Math.ceil(decorPts(c)/2)+(c.gems?Math.max(1,Math.floor(c.gems/10)):0);   // half the builder points, and a Star Point per 10 gems of premium decor
  addSP(sv,sp,'build'); sv.stats=sv.stats||{}; sv.stats.decorGems=(sv.stats.decorGems||0)+(c.gems||0); sv.stats.decorSpend=(sv.stats.decorSpend||0)+(c.gems?0:c.price||0); ok=true; });
 if(!ok)return false;
 spawnDecor(d); refreshWallet(); sCoin();
 const sv=freshSave(); const L=ranchLevel(sv); if(L>_ranchLvlCache){_ranchLvlCache=L;sGem();toast('🏗️ Ranch level '+L+'! '+(RANCH_PERKS[L]||''));} else toast(c.emoji+' '+c.label+' placed · '+ranchPts(sv)+' builder points · +'+sp+' ⭐');
 passAdd(2); statBump('built',1); G.run('decorPlaced',d,c);
 questEvt('build',t); questEvt('ranchlvl',0); dailyEvt('build',1);   // the builder questline and the build daily
 return true;
}
function pickDecor(cx,cy){
 _bndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1); _bray.setFromCamera(_bndc,camera);
 const hits=_bray.intersectObjects(decorObjs.map(o=>o.g),true); if(!hits.length)return null;
 let o=null; for(const cand of decorObjs){ let p=hits[0].object; while(p){ if(p===cand.g){o=cand;break;} p=p.parent; } if(o)break; }
 return o;
}
function removeAt(cx,cy){ const o=pickDecor(cx,cy); if(!o)return false; removeDecor(o); return true; }
function removeDecor(o){
 const c=DECOR_CAT[o.d.t]; scene.remove(o.g); const ci=colliders.indexOf(o.coll); if(ci>=0)colliders.splice(ci,1);
 decorObjs.splice(decorObjs.indexOf(o),1);
 const back=c.gems?Math.floor(c.gems/2):Math.floor(c.price/2);
 syncSave(sv=>{ sv.decor=(sv.decor||[]).filter(d=>d.id!==o.d.id); if(c.gems)sv.gems=(sv.gems||0)+back; else sv.coins+=back; for(const h of sv.horses)if(h.hitch===o.d.id)h.hitch=null; });
 refreshWallet(); _ranchLvlCache=ranchLevel(freshSave()); toast('🧹 Removed · +'+back+(c.gems?'💎':'🪙')+' back'); G.run('decorRemoved',o.d,c);
}
function openBuild(){

 html+=Object.keys(DECOR_CAT).map(t=>{const c=DECOR_CAT[t];const have=sv.decor.filter(d=>d.t===t).length;return '<div class="evrow">'+c.emoji+' <b>'+c.label+'</b><span style="font-size:11px">'+c.price+'🪙 · '+c.pts+' pts'+(have?' · placed ×'+have:'')+'</span><button data-b="place:'+t+'">Place</button></div>';}).join('');
 html+='<div class="crow" style="gap:6px;margin-top:6px"><button data-b="remove">🧹 Remove a piece</button><span style="font-size:11px;color:#8c7a63">'+sv.decor.length+' pieces placed · build anywhere in the valley</span></div>';
 html+=sect('build',sv);
 }
 p.innerHTML=html; p.style.display='flex';

 p.querySelectorAll('[data-buildtab]').forEach(b=>{b.onclick=()=>{buildTab=b.dataset.buildtab;p.style.display='none';openBuild();};});

renderer.domElement.addEventListener('pointermove',e=>{ if(!build.ghost)return; const pt=groundPoint(e.clientX,e.clientY); if(!pt)return; if(G.ranch&&G.ranch.snap){const q=G.ranch.snap(DECOR_CAT[build.type],pt.x,pt.z,build.rot,build.moving);if(q){pt.x=q.x;pt.z=q.z;pt.y=groundH(q.x,q.z);if(q.ry!=null)build.rot=q.ry;}} build.ghost.visible=true; build.ghost.position.set(pt.x,pt.y,pt.z); build.ghost.rotation.y=build.rot; build.lastPt=[pt.x,pt.z]; const why=decorOk(build.type,pt.x,pt.z); $('buildHud').classList.toggle('bad',!!why); });
renderer.domElement.addEventListener('pointerdown',e=>{ if(build.type||build.remove||build.move)build.down={x:e.clientX,y:e.clientY,id:e.pointerId}; });
addEventListener('pointerup',e=>{ const dn=build.down; build.down=null; if(!dn||e.pointerId!==dn.id)return; if(Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>7)return;
 if(build.remove){removeAt(e.clientX,e.clientY);return;}
 if(build.move&&!build.type){const o=pickDecor(e.clientX,e.clientY);if(o)startMove(o);return;}
 if(build.type){ const pt=groundPoint(e.clientX,e.clientY); if(pt)placeAt(pt.x,pt.z); } });

   A free camera for photographs: the ride stops, the HUD goes, and the camera is yours to
   fly. Trail rides: a route of named stops, ridden stop to stop behind the golden arrow,
   announced to the club so friends can ride the same one. Ranch parties: a banner, confetti
   for a minute and a half, and a gift for everyone who rides over while it lasts. And on
   weekends the Runaway Roundup: three of Otto's horses loose in the Basin, calmed by
   standing quietly beside them and led home to the pasture. */
let freeCam=null;
function toggleFreeCam(){
 if(renderer.xr.isPresenting)return;
 if(freeCam){freeCam=null;document.body.classList.remove('freecam');return;}
 const d=new THREE.Vector3(); camera.getWorldDirection(d);
 freeCam={pos:camera.position.clone(),yaw:Math.atan2(d.x,d.z),pitch:Math.asin(THREE.MathUtils.clamp(d.y,-1,1))};
 document.body.classList.add('freecam'); toast('📷 Free camera — C to come back');
}
function tickFreeCam(dt){
 if(!freeCam)return;
 const f=freeCam, spd=(keys.ShiftLeft||keys.ShiftRight?24:9)*dt;
 const dir=new THREE.Vector3(Math.cos(f.pitch)*Math.sin(f.yaw),Math.sin(f.pitch),Math.cos(f.pitch)*Math.cos(f.yaw));
 const right=new THREE.Vector3(Math.cos(f.yaw),0,-Math.sin(f.yaw));
 const mv=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0), st=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0), up=(keys.KeyE?1:0)-(keys.KeyQ?1:0);
 f.pos.addScaledVector(dir,mv*spd).addScaledVector(right,st*spd); f.pos.y+=up*spd;
 f.pos.y=Math.max(groundH(f.pos.x,f.pos.z)+0.4,f.pos.y);
 camera.position.copy(f.pos); camera.lookAt(f.pos.x+dir.x,f.pos.y+dir.y,f.pos.z+dir.z);
}

function tickRunaways(dt,t){
 for(const r of runaways){
  const d=Math.hypot(player.pos.x-r.x,player.pos.z-r.z);
  let sp=0;
  if(!r.caught){
   if(d<4.5&&Math.abs(player.speed)<3){ r.calm=Math.min(1,r.calm+dt/4); r.tag.material.opacity=1; if(r.calm>=1){r.caught=true; toast('🐎 Calmed! It will follow you — lead it to the pasture.'); sChime();} }
   else if(d<4.5&&Math.abs(player.speed)>=3){ r.calm=Math.max(0,r.calm-dt); }
   r.wander-=dt; if(r.wander<=0){r.wander=3+Math.random()*4; r.heading=Math.random()*Math.PI*2;}
   if(d>6&&r.wander>2){ sp=1.2; r.x+=Math.sin(r.heading)*sp*dt; r.z+=Math.cos(r.heading)*sp*dt; }
  }else{
   const tx=player.pos.x-Math.sin(player.heading)*5, tz=player.pos.z-Math.cos(player.heading)*5;
   const dd=Math.hypot(tx-r.x,tz-r.z);

   if(dd>1.5){ sp=Math.min(15,dd*1.8); r.heading=Math.atan2(tx-r.x,tz-r.z); r.x+=Math.sin(r.heading)*sp*dt; r.z+=Math.cos(r.heading)*sp*dt; }
   if(Math.hypot(r.x-SANCTUARY.x,r.z-SANCTUARY.z)<SANCTUARY.r){
    scene.remove(r.parts.group); r.done=true;
    addCoins(200); syncSave(sv=>{sv.keys=(sv.keys||0)+1; sv.roundup={week:weekKey(),delivered:(sv.roundup&&sv.roundup.week===weekKey()?sv.roundup.delivered||0:0)+1}; addSP(sv,5,'roundup');}); refreshWallet(); sGem();
    toast('🤠 Home safe! +200🪙 +1🗝️');
   }
  }
  r.phase+=dt*(2.2+sp*1.9);
  const g3=gaitFor(sp); animateHorse(r.parts,r.phase,sp<0.2?0:g3.amp,g3,true,t,0,dt);

}

/* ===== The Market ==========================================================
   Star Equestrian has a market; this game had no way to let a horse go at all. That was
   survivable while horses only arrived by being bought on purpose — but the Summoning
   Stall hands you whatever it likes, the stable holds twelve, and a duplicate Shetland you
   did not choose should not be a dead end.

   So: sell a horse for a fair share of what it is worth, and a board of four horses that
   changes with the day. The board is seeded off the date, so it is the same four all day
   however many times you open it, and different tomorrow — no rerolling by reopening. */
function horseValue(h){
 if(!h)return 0;
 const br=BREEDS3.find(b=>b[0]===h.breed);
 const base={Common:130,Draft:170,Uncommon:240,Rare:430,Epic:820,Mythic:1500,Legendary:1400,Dragon:1900,Ascendant:2600}[br?br[2]:'Common']||130;
 const st=h.stats?Object.keys(h.stats).reduce((a,k)=>a+(h.stats[k]||0),0):0;
 const o=br&&br[7]||{};
 const extra=(o.wings?260:0)+(o.horn?220:0)+(o.dragon?420:0)+(o.coat?180:0);
 return Math.round(base+extra+st*15+((h.level||1)-1)*70+(h.bond||0)*3);
}
const MARKET_CUT=0.6;                       // what the market keeps; the rest is yours
function marketOffer(h){return Math.round(horseValue(h)*MARKET_CUT);}
function marketDay(){return new Date().toDateString();}
function marketStock(){
 const ds=marketDay(); let x=0;
 for(const c of ds)x=(Math.imul(x,31)+c.charCodeAt(0))>>>0;
 const rnd=()=>{x=(Math.imul(x,1664525)+1013904223)>>>0; return x/4294967296;};
 const pool=BREEDS3.filter(b=>breedAvailable(b,'market')&&b[2]!=='Dragon'&&b[2]!=='Mythic'&&b[2]!=='Legendary');
 const out=[], used=[];
 for(let i=0;i<4;i++){
  const b=pool[Math.floor(rnd()*pool.length)]||BREEDS3[0];
  const st=()=>3+Math.floor(rnd()*6);
  const stats={speed:st(),stamina:st(),jump:st(),accel:st(),agility:st()};
  const level=1+Math.floor(rnd()*4);
  const price=Math.round(horseValue({breed:b[0],stats,level,bond:0})*1.12);
  /* four horses on one board should not share a name */
  let name=NAMES3[Math.floor(rnd()*NAMES3.length)], guard=0;
  while(used.indexOf(name)>=0&&guard++<40)name=NAMES3[Math.floor(rnd()*NAMES3.length)];
  used.push(name);
  out.push({i,b,stats,level,price,name});
 }
 return out;
}

 const prng=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
 const orig=Math.random; Math.random=prng; const out=[];
 try{ for(let i=0;i<3;i++){ const r=prng(); const rar=r<0.45?'Common':r<0.80?'Uncommon':r<0.95?'Rare':'Epic'; const it=genGear(rar,GEAR_SLOTS[i%4===3?Math.floor(prng()*4):i]); it.id='mkt'+day.replace(/\W/g,'')+i; it.price=Math.round(RAR_SELL[rar]*2.5); out.push(it); } }
 finally{ Math.random=orig; }
 return out;
}

/* ================= online multiplayer: clubs, chat & friends =================
   SOCIAL gates this whole layer — the MQTT connection, chat, remote riders, profiles,
   friends, invite links and club rankings. With it off the game is purely single player
   and never contacts the broker; the code stays put so flipping this back to true
   restores everything. Trail Pass and milestone rewards are NOT social and stay on. */
const SOCIAL=true;
const net={client:null,id:(save&&save.pid)?'p'+String(save.pid).slice(3).toLowerCase():'p'+Math.random().toString(36).slice(2,8),club:null,lastPub:0};   // the id derives from the player ID, so it survives reloads
/* Topic helpers for feature packages. A topic that starts with 'srf1/' is used as written
   (with '{club}' filled in); anything else is a name inside the current club's namespace. */
function netTopic(t){t=String(t);return t.startsWith('srf1/')?t.replace('{club}',net.club||''):'srf1/'+(net.club||'')+'/'+t;}
function netSubscribe(topic){if(!NET_SUBS.includes(topic))NET_SUBS.push(topic);if(net.client&&net.client.connected&&net.club){try{net.client.subscribe(netTopic(topic));}catch(e){}}return topic;}
function netPublish(topic,obj,opts){if(!SOCIAL||!net.client||!net.client.connected||!net.club)return false;try{net.client.publish(netTopic(topic),JSON.stringify(Object.assign({id:net.id,n:myName()},obj||{})),opts||{});return true;}catch(e){return false;}}

/* Your club code is your room. It used to default to "kestrel" for everybody, which
   meant anyone who pressed Connect landed in ONE shared room with open chat and
   whoever else happened to be there. The broker is public and unauthenticated, so
   that is a room full of strangers by default.
   Now every player gets their own random code the first time they look, and you ride
   with people you sent the invite link to. Treat the code like a password: anyone who
   has it can join and read the chat. */
function myClub(){

/* Give a remote rider the same rigged horse the player rides. SkeletonUtils.clone is
   what makes this possible: a plain .clone() on a SkinnedMesh shares the ORIGINAL
   skeleton, so every remote rider would pose identically to you and to each other.
   Capped, because each clone is a 26k-vertex skinned mesh with its own 33-bone
   skeleton to update every frame — past a handful that cost is real, and the
   procedural horse is a perfectly good stand-in for a distant dot. */
/* A bridle for the rigged horse. The procedural one is parented to the procedural
   head, so it cannot simply be kept — the rig's muzzle is somewhere else entirely.
   These are the same mouth-corner coordinates attachTack uses for the rein anchors. */
function remoteBridle(){
 const g=new THREE.Group();
 const strap=smat('#4a3526');
 const nose=new THREE.Mesh(new THREE.TorusGeometry(0.115,0.017,6,14),strap);
 nose.position.set(0,1.33,0.94); nose.rotation.x=0.12; g.add(nose);
 const brow=new THREE.Mesh(new THREE.TorusGeometry(0.15,0.016,6,14),strap);
 brow.position.set(0,1.50,0.68); brow.rotation.x=Math.PI/2; g.add(brow);
 const cheek=(x)=>{const b=box(0.018,0.30,0.018,'#4a3526',x,1.42,0.80,g);b.rotation.x=0.5;return b;};
 cheek(-0.125); cheek(0.125);
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
 return g;
}

    h:+player.heading.toFixed(2),sp:+Math.abs(player.speed).toFixed(1),
    c:h?h.colors:null,k:h?(h.tack||'#7a583a'):null,tailCol:h?.tailCol||null,mark:h?.mark??null,markCol:h?.markCol??null,
    s:(s.rider&&s.rider.shirt)||RIDER_DEF_SHIRT,p:(s.rider&&s.rider.pants)||RIDER_DEF_PANTS,hr:(s.rider&&s.rider.hair)||null,sk:(s.rider&&s.rider.skin)||null,hm:(s.rider&&s.rider.helmet)||null,

  }catch(e){}
 }

   scene.remove(r.parts.group);
   if(r.rig){disposeMountedRig(r.rig);r.rig.skin?.material?.dispose();remoteRigCount=Math.max(0,remoteRigCount-1);}   // free the slot for the next rider
   delete remotes[id];
   continue;
  }
  r.x+=(r.tx-r.x)*Math.min(1,dt*5);
  r.z+=(r.tz-r.z)*Math.min(1,dt*5);
  if(typeof r.theading==='number'){
   let dh=r.theading-r.heading;
   while(dh>Math.PI)dh-=Math.PI*2;
   while(dh<-Math.PI)dh+=Math.PI*2;
   r.heading+=dh*Math.min(1,dt*6);
  }

  }
  r.phase+=dt*(2.2+r.sp*1.9);
  const g3=gaitFor(r.sp);
  animateHorse(r.parts,r.phase,r.sp<0.2?0:g3.amp,g3,true,t,0,dt);
  r.parts.group.position.set(r.x,groundH(r.x,r.z),r.z);
  r.parts.group.rotation.y=r.heading;
  r.rider.g.rotation.x=0;
  if(r.rider.u)r.rider.u.uLean.value=0.06+0.2*Math.min(1,r.sp/6)+Math.sin(r.phase)*0.03;
  G.run('remoteTick',r,dt,t);
 }
}

function shrinkShot(W){
 const src=renderer.domElement; W=W||240;
 const cv=document.createElement('canvas');
 cv.width=W; cv.height=Math.max(1,Math.round(W*src.height/src.width));

function shotScore(m){

 const parts=[
  ['📷 The shot',   6],                                  // any photo is worth something
  ['📸 On theme',   m.theme?34:0],
  ['🦌 Wildlife',   Math.min(21,(m.wild||0)*7)],
  ['🌅 Golden hour',Math.round(golden*18)],
  ['💨 Action',     Math.min(14,Math.round((m.spd||0)*1.2))],
  ['🌦️ Weather',    (m.wx&&m.wx!=='clear')?9:3],

   and the panel says so rather than dressing them up as other players. Their numbers are
   worked out from how long you have been going, so a board is never empty and never
   hopeless — some of them are ahead of you and some are behind. */
const NEIGHBOURS=[
 ['Willowbrook',1.16],['Copper Creek',0.94],['Thistledown',1.04],['Ash Hollow',0.80],
 ['Redgate',1.30],['Silverbirch',0.68],['Fernmere',1.10],['Hollypark',0.88],
];
function bhash(str){
 let h=0x811c9dc5|0;
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}
 return ((h>>>8)&0xffff)/0xffff;   // imul, not a double multiply — see the ihash trap
}
function daysGoing(s){return Math.max(1,Math.floor((Date.now()-(s.founded||Date.now()))/864e5)+1);}
/* The lifetime counters only start the day this code reaches you, so pacing the neighbours
   off the ranch's founding date would put every existing player dead last on thirteen
   boards they never had a chance to fill. Those ones start when the counter did. */
function boardDays(b,s){
 /* The pass resets every 28 days, so pacing it on the ranch's age had every neighbour
    finishing the season on tier 30 before you had started it. */
 if(b.k==='passTier')return seasonNow().day;
 if(b.k.slice(0,5)!=='life_')return daysGoing(s);
 const since=(s.life&&s.life.since)||Date.now();
 return Math.max(1,Math.floor((Date.now()-since)/864e5)+1);
}
function boardRows(b,s){
 const d=boardDays(b,s);
 const rows=NEIGHBOURS.map(([nm,str])=>{
  let v=b.rate*d*str*(0.55+0.9*bhash(b.k+nm));
  if(b.cap)v=Math.min(b.cap,v);
  return {n:nm,v:Math.max(0,Math.round(v))};
 });
 const club=lbData[b.k]||{};                       // real club members outrank neighbours
 for(const nm of Object.keys(club))rows.push({n:nm,v:club[nm],club:true});
 rows.push({n:'You',v:boardVal(s,b.k),me:true});
 rows.sort((a,b2)=>b2.v-a.v);
 return rows;
}

}

/* The ceremony. Everything below is timed against SUMMON.t in seconds. */
function startSummon(tier){
 if(SUMMON.on)return;
 const s=freshSave(); if(!s)return;
 if((s.gems||0)<tier.gems){toast('Not enough gems yet.');return;}
 if(s.horses.length>=stableCap(s)){toast('Your stable is full.');return;}
 const rar=summonRoll(tier), br=summonBreed(rar);
 let newId=null;
 syncSave(sv=>{
  sv.gems-=tier.gems;
  const st=()=>3+Math.floor(Math.random()*4);
  newId=grantHorse(sv,br[0],{stats:{speed:st(),stamina:st(),jump:st(),accel:st(),agility:st()},src:'summon',extra:{summonTier:tier.id,summonRar:rar}}).id;
  sv.stats=sv.stats||{}; sv.stats.summons=(sv.stats.summons||0)+1;
 });
 refreshWallet();
 SUMMON.on=true; SUMMON.t=0; SUMMON.tier=tier; SUMMON.rar=rar; SUMMON.breed=br;
 SUMMON.horseId=newId; SUMMON.step=-1; SUMMON.shown='Common'; SUMMON.cam=true; SUMMON.done=false;
 SUMMON.home={x:player.pos.x,z:player.pos.z,h:player.heading,ride:rideIdx};
 document.body.classList.add('summoning');
 $('sfxRar').style.opacity=0; $('sfxName').style.opacity=0; $('sfxBreed').style.opacity=0;
 /* stand the rider at the stall mouth, facing out, so the horse walks toward the camera */
 const g=SUMMON.grp;
 SUMMON.face=new THREE.Vector3(0,0,1).applyQuaternion(g.quaternion).normalize();
 SUMMON.door=new THREE.Vector3(SUMMON_STALL.x,0,SUMMON_STALL.z).addScaledVector(SUMMON.face,1.9);
 player.speed=0; player.y=0;
 /* Out of sight until the doors go. The stall is a solid building, so the horse cannot
    actually stand inside it — it is simply not drawn until the moment of the reveal, which
    is what makes the shot of the glowing doors a held breath instead of a horse waiting. */
 if(player.mesh)player.mesh.visible=false;
 player.pos.set(SUMMON.door.x,0,SUMMON.door.z);
 player.heading=Math.atan2(SUMMON.face.x,SUMMON.face.z);
 if(player.mesh){player.mesh.rotation.y=player.heading;
  player.mesh.position.set(player.pos.x,groundH(player.pos.x,player.pos.z),player.pos.z);}
 sNeigh();
}
/* The suspense: the glow climbs one rarity at a time and holds. It never climbs past what
   you actually rolled, so the moment it stops IS the answer — which is why it is allowed
   to take its time getting there. */
const SUM_STEPS=[{at:1.5},{at:2.7},{at:3.9},{at:5.1},{at:6.3}];
function tickSummon(dt){
 if(!SUMMON.on)return;
 SUMMON.t+=dt;
 const T=SUMMON.t, rarIdx=SUMMON_ORDER.indexOf(SUMMON.rar);
 /* how far the light has climbed */
 let step=-1;
 for(let i=0;i<SUM_STEPS.length;i++) if(T>=SUM_STEPS[i].at&&i<=rarIdx) step=i;
 if(step!==SUMMON.step&&step>=0){ SUMMON.step=step; SUMMON.shown=SUMMON_ORDER[step]; sGem(); }
 const col=new THREE.Color(SUMMON_COL[SUMMON.shown]||'#ffffff');
 const climbing=T<SUM_STEPS[Math.min(rarIdx,SUM_STEPS.length-1)].at+1.15;
 const open=Math.max(0,Math.min(1,(T-(SUM_STEPS[Math.min(rarIdx,4)].at+1.15))/0.75));
 /* the glow, pulsing harder the higher it has climbed */
 const lit=Math.max(0,step);            // step is -1 before the first rung: never light it negatively
 if(SUMMON.glow){
  const pulse=0.55+0.45*Math.sin(T*(5+lit*2.2));
  const amp=Math.max(0,Math.min(1,0.10+lit*0.20));
  SUMMON.glow.material.color.copy(col);
  SUMMON.glow.material.opacity=climbing?amp*pulse:(1-open)*0.9+open*0.15;
 }
 if(SUMMON.light){ SUMMON.light.color.copy(col);
  SUMMON.light.intensity=Math.max(0,climbing?(1.2+lit*3.4)*(0.6+0.4*Math.sin(T*7)):26*(1-open)+3); }
 /* the doors */
 if(SUMMON.doorL){ const a=open*1.42;
  SUMMON.doorL.rotation.y=a; SUMMON.doorR.rotation.y=-a; }
 /* the horse walks out, then rears */
 const OPEN_AT=SUM_STEPS[Math.min(rarIdx,4)].at+1.15;
 if(T>OPEN_AT+0.35&&!SUMMON.mounted){
  SUMMON.mounted=true;
  if(player.mesh)player.mesh.visible=true;                  // there it is
  const sv=freshSave();
  const idx=sv.horses.findIndex(h=>h.id===SUMMON.horseId);
  if(idx>=0){ rideIdx=idx; try{reloadHorses();}catch(e){} try{applyCoat();}catch(e){} }
  const rr=$('sfxRar'), nm=$('sfxName'), bd=$('sfxBreed');
  rr.textContent=SUMMON.rar; rr.style.color=SUMMON_COL[SUMMON.rar]; rr.style.opacity=1;
  nm.textContent=(sv.horses[idx]&&sv.horses[idx].name)||'';
  bd.textContent=SUMMON.breed[1];
 }
 if(T>OPEN_AT+0.55&&T<OPEN_AT+2.0){                       // out through the doors
  const w=(T-(OPEN_AT+0.55))/1.45;
  const px=SUMMON.door.x+SUMMON.face.x*w*2.6, pz=SUMMON.door.z+SUMMON.face.z*w*2.6;
  player.pos.set(px,0,pz); player.y=0; player.speed=0;
  if(player.mesh)player.mesh.position.set(px,groundH(px,pz),pz);
 }
 if(T>OPEN_AT+1.6&&!SUMMON.reared){                        // and up
  SUMMON.reared=true;
  try{ RIG.emote={type:'rear',t:0,dur:EMOTES.rear.dur}; sNeigh(); }catch(e){}
  $('sfxName').style.opacity=1; $('sfxBreed').style.opacity=1;
 }
 if(T>OPEN_AT+4.6&&!SUMMON.done){
  SUMMON.done=true;
  if(player.mesh)player.mesh.visible=true;
  document.body.classList.remove('summoning');

function updatePet(dt,t){
 if(!petComp)return;
 const off=2.2;
 const bx=player.pos.x-Math.sin(player.heading)*off+Math.cos(player.heading)*0.9;
 const bz=player.pos.z-Math.cos(player.heading)*off-Math.sin(player.heading)*0.9;
 const dx=bx-petComp.pos.x,dz=bz-petComp.pos.z,d=Math.hypot(dx,dz);
 if(d>40){petComp.pos.set(bx,0,bz);}      // catch up after fast travel
 let sp=0;
 if(d>0.6){
  const want=Math.atan2(dx,dz);let dh=want-petComp.heading;
  while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
  petComp.heading+=dh*Math.min(1,dt*7);
  sp=Math.min(11,1.4+d*0.7);
  petComp.pos.x+=Math.sin(petComp.heading)*sp*dt;
  petComp.pos.z+=Math.cos(petComp.heading)*sp*dt;
 }
 petComp.phase+=dt*(3+sp*2.2);
 const hop=sp>0.3?Math.abs(Math.sin(petComp.phase))*0.06*Math.min(1,sp/4):0;
 petComp.parts.group.position.set(petComp.pos.x,groundH(petComp.pos.x,petComp.pos.z)+hop,petComp.pos.z);
 petComp.parts.group.rotation.y=petComp.heading;
 const L=petComp.parts.legs;
 for(let i=0;i<4;i++){const o=i<2?0:Math.PI;L[i].rotation.x=Math.sin(petComp.phase+(i%2?Math.PI:0)+o)*0.5*Math.min(1,sp/3);}
 petComp.parts.tail.rotation.z=Math.sin(t*6)*0.25;  // happy wag
}

const DAILY_N=6;   // six a day: feeding, training, riding, foraging and taming all get a turn
// long-haul variants share their hooks with the base types
function dailyTypeAliases(type){return type==='gallop'?['gallop','gallop2k']:type==='feed'?['feed','feed6']:[type];}
const _dailyMemo={key:'',list:null};
function todayDaily(){
 const ds=new Date().toDateString();
 const mk=ds+'|'+DAILYQ.length; if(_dailyMemo.key===mk&&_dailyMemo.list)return _dailyMemo.list;
 /* The day's roll is snapshotted in the save the first time it is drawn, so a package that
    adds daily rows (addDaily) after a player has already started the day does not reshuffle
    the quests they are half-way through. */
 let list=null;
 syncSave(s=>{ ensureDq(s);
  if(Array.isArray(s.dq.roll)&&s.dq.roll.length){const rows=s.dq.roll.map(t=>DAILYQ.find(q=>q.type===t)).filter(Boolean); if(rows.length===s.dq.roll.length)list=rows;}
  if(!list){list=todayDailyRoll(ds); s.dq.roll=list.map(q=>q.type);} });
 if(!list)list=todayDailyRoll(ds);
 _dailyMemo.key=mk; return _dailyMemo.list=list;
}
function todayDailyRoll(ds){
 let h=0;for(let i=0;i<ds.length;i++)h=(h*31+ds.charCodeAt(i))|0;
 const idx=[];let k=Math.abs(h)||1; const n=Math.min(DAILY_N,DAILYQ.length);
 while(idx.length<n){k=(k*1103515245+12345)%2147483647;const j=k%DAILYQ.length;if(!idx.includes(j))idx.push(j);}
 return idx.map(i=>DAILYQ[i]);
}
function ensureDq(s){
 const ds=new Date().toDateString();
 if(!s.dq||s.dq.date!==ds)s.dq={date:ds,prog:{},claimed:{}};
}
function dailyEvt(type,val){
 val=val||1;
 /* Every one of these moments was already reported here for the daily quests; keeping a
    lifetime tally alongside costs one write and gives the boards thirteen real stats. */
 syncSave(s=>{s.life=s.life||{since:Date.now()};s.life[type]=(s.life[type]||0)+val;});
 const today=todayDaily();
 for(const ty of dailyTypeAliases(type)){
  const q=today.find(q=>q.type===ty);
  if(!q)continue;
  let crossed=false;
  syncSave(s=>{
   ensureDq(s);
   const before=s.dq.prog[ty]||0;
   if(s.dq.claimed[ty]||before>=q.goal)return;
   s.dq.prog[ty]=Math.min(q.goal,before+val);
   crossed=before<q.goal&&s.dq.prog[ty]>=q.goal;
  });
  if(crossed)toast('📋 Daily quest done: '+q.label+' — claim it in 📜 Quests!');
 }
 G.run('dailyEvt',type,val);                              // side quests, foal quests, co-op goals listen here
}
const UMBRELLA_R={k:1,g:4,sp:40,p:30};   // the meta-quest: every daily done pays a key, gems, club points and pass points on top
function claimUmbrella(){
 let ok=false;
 syncSave(s=>{ensureDq(s); if(s.dq.umbrella||Object.keys(s.dq.claimed).length<DAILY_N)return; s.dq.umbrella=true; payReward(s,UMBRELLA_R); ok=true;});
 if(ok){refreshWallet();sGem();toast('🌂 Umbrella: +'+rewardLabel(UMBRELLA_R));renderQuests();}
}
function claimDaily(type){
 const q=todayDaily().find(q=>q.type===type);if(!q)return;
 let ok=false;
 syncSave(s=>{
  ensureDq(s);
  if(s.dq.claimed[type]||(s.dq.prog[type]||0)<q.goal)return;
  s.dq.claimed[type]=true;
  payReward(s,q.r);   // coins, gems, keys, pass points, club points — every daily pays club SP now
  ok=true;
 });
 if(ok){refreshWallet();sChime();toast('📋 +'+rewardLabel(q.r));renderQuests();}
}

   +'</div>';

(function(){

 let msg=null,msg2=null;
 syncSave(s=>{
  if(s.streakLast===ds)return;
  s.streakN=(s.streakLast===yd)?(s.streakN||0)+1:1;
  s.streakLast=ds;
  const c=50+Math.min(7,s.streakN)*25;

  const sg=s.streakN%2===0?2:1; grantGems(s,sg);                 // a gem or two for coming back, every day
  if(calAdvance(s))msg2='📅 Day '+s.cal.i+' of the month is open — collect it in 🏅 → Week.';
  msg='🔥 Day '+s.streakN+' login streak! +'+c+'🪙 +'+sg+'💎';
 });
 if(msg){refreshWallet();setTimeout(()=>{try{toast(msg);}catch(e){}},2600);}
 if(msg2)setTimeout(()=>{try{toast(msg2);}catch(e){}},4200);
})();

  s.coins-=500;
  const foal=makeFoal(s,mine,r,{club:true,src:'club',rider:name});

  msg='💞 A foal was born: '+foal.name+'! '+mine.name+' × '+(r.horseName||name+"'s horse")+' 🍼 Find it in the pasture!';
  ok=true;
 });
 if(msg)toast(msg);
 if(ok){refreshWallet();reloadHorses();sChime();passAdd(25);dailyEvt('breed',1);}

let musicTimer=null,musicStep=0;
const CHORDS=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
function pad(fs){
 if(muted)return;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const t0=AC.currentTime;
  fs.forEach(f=>{
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine';o.frequency.value=f;
   g.gain.setValueAtTime(0.0001,t0);
   g.gain.linearRampToValueAtTime(0.026,t0+0.8);
   g.gain.linearRampToValueAtTime(0.0001,t0+4.6);
   o.connect(g);g.connect(AC.destination);
   o.start(t0);o.stop(t0+4.8);
  });
 }catch(e){}
}
function startMusic(){
 if(musicTimer)return;
 musicTimer=setInterval(()=>{
  if(muted)return;
  const chord=CHORDS[Math.floor(musicStep/16)%4];
  if(musicStep%16===0){pad(chord);beep(chord[0]/2,chord[0]/2,1.4,'sine',0.028);}
  if(musicStep%2===0&&Math.random()<0.42){
   const sc=[chord[0],chord[1],chord[2],chord[1]*2,chord[0]*2];
   const f=sc[Math.floor(Math.random()*sc.length)];
   beep(f,f,0.34,'triangle',0.032);
  }
  if(Math.random()<0.015){
   beep(2800,2200,0.08,'sine',0.02);
   beep(2500,3100,0.09,'sine',0.018,0.12);
  }
  musicStep++;
 },300);
}

<script>
/* Installable-app plumbing. Kept out of the game module on purpose: if any of
   this throws it must not take the game down with it. */
(function(){

  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
 }
 /* Chrome fires beforeinstallprompt only when the page actually qualifies to be
    installed, so the button appears if and only if pressing it will work — no
    dead "Install" that does nothing. iOS never fires it; there you use Share ->
    Add to Home Screen, which is why the hint below exists. */
 let deferred=null;
 addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferred=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='block';
 });
 addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('installBtn');
  if(!b)return;
  b.onclick=async()=>{
   if(!deferred)return;
   b.style.display='none';
   deferred.prompt();
   try{await deferred.userChoice;}catch(e){}
   deferred=null;
  };
  // already installed and launched from the home screen: nothing to offer
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)b.remove();
 });
 addEventListener('appinstalled',()=>{
  const b=document.getElementById('installBtn');if(b)b.remove();
 });
})();
