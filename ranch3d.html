<script type="module">
import * as THREE from 'three';
import {Sky} from 'three/addons/objects/Sky.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ================= save sync with the 2D game ================= */
const SAVE_KEY='starRanchFable_v1';
let save=null;
try{save=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
if(!save||!save.horses||!save.horses.length){
 save=save&&save.horses?save:{v:2,ranchName:'Star Ranch',founded:Date.now(),coins:150,gems:3,items:{carrot:10,apple:2,hay:3},nextId:1,horses:[],decor:[],projects:{},trophies:{},wild:null,wildTrust:0,muted:false,lastSeen:Date.now(),lastDaily:'',questDate:'',quests:[],totalRaces:0,started:true};
 save.horses.push({id:save.nextId++,name:'Star',breed:'bay',colors:{body:'#8a5a2b',mane:'#332214'},horn:false,rainbow:false,stats:{speed:3,stamina:3,jump:3},level:1,xp:0,bond:25,needs:{hunger:90,thirst:90,clean:90,happy:90},foal:false,tack:null});
 save.started=true;
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}
const myHorses=save.horses;
let rideIdx=0;
// the 3D world now owns the ranch: needs decay (even while away) & the daily gift
const DECAY3={hunger:100/(8*3600),thirst:100/(6*3600),clean:100/(12*3600),happy:100/(16*3600)};
{
 const sec=Math.min(24*3600,(Date.now()-(save.lastSeen||Date.now()))/1000);
 if(sec>60){
  for(const h of save.horses)
   for(const k in DECAY3)h.needs[k]=Math.max(15,h.needs[k]-DECAY3[k]*sec);
 }
 const ds=new Date().toDateString();
 if(save.lastDaily!==ds){
  save.lastDaily=ds;
  save.coins+=100;save.gems+=1;
  save.pass=save.pass||{pts:0};
  save.pass.pts+=30;
  setTimeout(()=>{try{toast('🎁 Daily gift: +100🪙 +1💎 +30 🎟️ pass points');}catch(e){}},1500);
 }
 save.lastSeen=Date.now();
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}
let distAcc=0;
setInterval(()=>{
 let grewName=null;
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  for(const h of s.horses)
   for(const k in DECAY3)h.needs[k]=Math.max(0,h.needs[k]-DECAY3[k]*30);
  // foals grow up: 24 real hours, or sooner if trained to level 3
  for(const h of s.horses){
   if(!h.foal)continue;
   if(!h.born){h.born=Date.now();continue;}
   if(Date.now()-h.born>86400000||(h.level||1)>=3){
    h.foal=false;
    s.stats=s.stats||{};
    s.stats.grown=(s.stats.grown||0)+1;
    grewName=h.name;
   }
  }
  s.stats=s.stats||{};
  s.stats.dist=(s.stats.dist||0)+Math.round(distAcc);
  distAcc=0;
  s.lastSeen=Date.now();
  localStorage.setItem(SAVE_KEY,JSON.stringify(s));
 }catch(e){}
 if(grewName){
  try{toast('🌱➡️🐴 '+grewName+' grew up into a beautiful horse!');reloadHorses();}catch(e){}
 }
},30000);
let coins=save?Math.floor(save.coins):0;
let gems=save?save.gems:0;
let muted=save?!!save.muted:false;
const $=id=>document.getElementById(id);
$('coinEl').textContent=coins;
$('gemEl').textContent=gems;
$('muteBtn').textContent=muted?'🔇':'🔊';
function syncSave(fn){
 if(!save)return;
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  fn(s);
  localStorage.setItem(SAVE_KEY,JSON.stringify(s));
 }catch(e){}
}
function addCoins(n){coins+=n;$('coinEl').textContent=coins;syncSave(s=>{s.coins+=n;s.stats=s.stats||{};s.stats.earned=(s.stats.earned||0)+n;});}
function statBump(k,n){syncSave(s=>{s.stats=s.stats||{};s.stats[k]=(s.stats[k]||0)+n;});}
function addGems(n){gems+=n;$('gemEl').textContent=gems;syncSave(s=>{s.gems+=n;});}
function toast(msg){
 const t=document.createElement('div');t.className='toast';t.textContent=msg;
 $('toasts').appendChild(t);
 setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400);},2200);
}

/* ================= tiny sounds ================= */
let AC=null;
function beep(f0,f1,dur,type,vol,delay){
 if(muted)return;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol||0.1,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
 }catch(e){}
}
const sCoin=()=>{beep(880,1320,0.09,'triangle',0.1);beep(1320,1760,0.12,'triangle',0.08,0.07);};
const sGem=()=>{[784,988,1319].forEach((f,i)=>beep(f,f,0.14,'triangle',0.1,i*0.08));};
const sJump=()=>beep(300,650,0.18,'sine',0.1);
const sChime=()=>{beep(659,659,0.1,'triangle',0.1);beep(988,988,0.16,'triangle',0.1,0.08);};
const sThud=()=>beep(140,60,0.16,'square',0.12);
const sHoof=alt=>beep(alt?95:75,alt?70:55,0.05,'triangle',0.05);
const sNeigh=()=>{beep(700,250,0.35,'sawtooth',0.05);beep(900,300,0.3,'sawtooth',0.035,0.05);};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';syncSave(s=>{s.muted=muted;});};
function addXp3D(n){
 let leveled=false,lvl=0,grew=false;
 syncSave(s=>{
  const h=s.horses[rideIdx];
  if(!h)return;
  h.xp=(h.xp||0)+n;
  while(h.xp>=50+h.level*50){
   h.xp-=50+h.level*50;
   h.level++;
   leveled=true;lvl=h.level;
   const st=['speed','stamina','jump'][Math.floor(Math.random()*3)];
   h.stats[st]=Math.min(10,h.stats[st]+1);
  }
  if(h.foal&&h.level>=3){h.foal=false;grew=true;}
 });
 if(leveled){
  myHorses[rideIdx].level=lvl;
  sGem();
  toast('🎉 '+myHorses[rideIdx].name+' trained up to level '+lvl+'!');
 }
 if(grew){
  sNeigh();
  toast('🍼→🐴 '+myHorses[rideIdx].name+' grew into a beautiful horse!');
  reloadHorses();
 }
}

/* ================= terrain height (smooth value noise) ================= */
function ihash(ix,iz){
 let h=ix*374761393+iz*668265263;
 h=(h^(h>>13))*1274126177;
 return ((h^(h>>16))>>>0)/4294967295;
}
function vnoise(x,z){
 const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;
 const sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz);
 const a=ihash(ix,iz),b=ihash(ix+1,iz),c=ihash(ix,iz+1),d=ihash(ix+1,iz+1);
 return a+(b-a)*sx+(c-a)*sz+(a-b-c+d)*sx*sz;
}

 let h=near*far*(n-4.0);

 h-=near*far*1.7*(1-THREE.MathUtils.smoothstep(rd,0,9));
 return h;
}

function canvasTex(w,h,draw,repeat){
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 draw(cv.getContext('2d'),w,h);
 const tx=new THREE.CanvasTexture(cv);
 tx.colorSpace=THREE.SRGBColorSpace;
 if(repeat){tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(repeat,repeat);}
 return tx;
}
function noiseCanvas(size,scale,off){
 const cv=document.createElement('canvas');cv.width=cv.height=size;
 const c=cv.getContext('2d');
 const img=c.createImageData(size,size);
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  const v=vnoise(x*scale+off,y*scale+off*2)*0.65+vnoise(x*scale*3.1+off,y*scale*3.1)*0.35;
  const i=(y*size+x)*4,g=Math.floor(v*255);
  img.data[i]=img.data[i+1]=img.data[i+2]=g;img.data[i+3]=255;
 }
 c.putImageData(img,0,0);
 return cv;
}

function shadeHex(hex,k){

   c.beginPath();c.moveTo(x,y);c.lineTo(x+5+Math.random()*12,y+(Math.random()-0.5)*3);c.stroke();

function loftZ(prof,segs,mat){

 const R=prof.length;
 for(let i=0;i<R;i++){
  const p=prof[i];
  for(let j=0;j<=segs;j++){
   const th=j/segs*Math.PI*2;
   pos.push(Math.cos(th)*p.rx,p.cy+Math.sin(th)*p.ry,p.z);
   uv.push(i/(R-1),0.5-Math.sin(th)*0.5);
  }
 }
 for(let i=0;i<R-1;i++)for(let j=0;j<segs;j++){
  const a=i*(segs+1)+j,b=a+segs+1;
  idx.push(a,b,a+1,b,b+1,a+1);
 }
 const c0=pos.length/3;
 pos.push(0,prof[0].cy,prof[0].z);uv.push(0,0.5);
 for(let j=0;j<segs;j++)idx.push(c0,j+1,j);
 const c1=pos.length/3;
 const base=(R-1)*(segs+1);
 pos.push(0,prof[R-1].cy,prof[R-1].z);uv.push(1,0.5);
 for(let j=0;j<segs;j++)idx.push(c1,base+j,base+j+1);

 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 geo.setIndex(idx);

 m.castShadow=true;
 return m;
}

// generated meshes are rough/faceless and clash with the cozy stylized look, so
// the hand-built procedural horse (face, mane, breeds, animations) is the player.
// The whole generated-mount experiment is preserved behind this flag.

  legs:[],neck:[],tail:[]};
const RIG_LEGS=[                       // 4-beat walk phasing; indices = textured-rigged horse (33 bones)
 {n:'HL',top:23,knee:25,front:false,ph:0.00},
 {n:'FL',top:7, knee:9, front:true, ph:0.25},

function rigCalibrate(){

 // the model's rest frame (transform reset), independent of placement.
 const m=RIG.scene, sav={p:m.position.clone(),q:m.quaternion.clone(),s:m.scale.clone()};
 m.position.set(0,0,0); m.quaternion.identity(); m.scale.set(1,1,1); m.updateWorldMatrix(true,true);
 const B=RIG.bones, Z=new THREE.Vector3(0,0,1);
 const axisOf=i=>{const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
  B[i].matrixWorld.decompose(p,q,s); return Z.clone().applyQuaternion(q.clone().invert()).normalize();};
 RIG.legs=RIG_LEGS.map(L=>({...L,axTop:axisOf(L.top),axKnee:axisOf(L.knee),
  rTop:B[L.top].quaternion.clone(),rKnee:B[L.knee].quaternion.clone()}));
 RIG.neck=RIG_NECK.map(i=>({i,ax:axisOf(i),r:B[i].quaternion.clone()}));
 RIG.tail=RIG_TAIL.map(i=>({i,ax:axisOf(i),r:B[i].quaternion.clone()}));
 m.position.copy(sav.p); m.quaternion.copy(sav.q); m.scale.copy(sav.s); m.updateWorldMatrix(true,true);

// Coat coloring without UVs/textures: classify each vertex by its dominant bone
// into body / mane-tail / dark-point (lower legs + muzzle), then paint vertex
// colors from the current horse's breed colors with a top-light shade gradient.
const RIG_TAILBONES=new Set([17,18,19,20]);
const RIG_POINTBONES=new Set([10,11,15,16,24,25,29,30,6]);   // lower legs + muzzle
function rigColorRegions(){
 const g=RIG.skin.geometry, si=g.attributes.skinIndex, sw=g.attributes.skinWeight, n=si.count;
 const reg=new Uint8Array(n);
 for(let v=0;v<n;v++){
  let bi=si.getX(v),bw=sw.getX(v);
  const iy=si.getY(v),wy=sw.getY(v); if(wy>bw){bw=wy;bi=iy;}
  const iz=si.getZ(v),wz=sw.getZ(v); if(wz>bw){bw=wz;bi=iz;}
  const iw=si.getW(v),ww=sw.getW(v); if(ww>bw){bw=ww;bi=iw;}
  reg[v]=RIG_TAILBONES.has(bi)?1:(RIG_POINTBONES.has(bi)?2:0);
 }
 RIG.region=reg;
}
function rigRecolor(){
 if(!RIG.ready||!RIG.region)return;
 const h=myHorses[rideIdx]; if(!h||!h.colors)return;
 const g=RIG.skin.geometry, pos=g.attributes.position, n=pos.count;
 let col=g.getAttribute('color');
 if(!col){col=new THREE.BufferAttribute(new Float32Array(n*3),3); g.setAttribute('color',col);}
 const body=new THREE.Color(h.colors.body), mane=new THREE.Color(h.colors.mane||h.colors.body);
 const point=body.clone().multiplyScalar(0.32);
 let ymin=1e9,ymax=-1e9; for(let i=0;i<n;i++){const y=pos.getY(i); if(y<ymin)ymin=y; if(y>ymax)ymax=y;}
 const inv=1/((ymax-ymin)||1), c=new THREE.Color();
 for(let i=0;i<n;i++){
  const r=RIG.region[i]; c.copy(r===1?mane:r===2?point:body);
  const sh=0.74+0.26*((pos.getY(i)-ymin)*inv);   // belly darker, back lighter

function driveRig(sp,grounded,t,dt){
 if(!RIG.ready||RIG.attachedTo!==player.mesh)return;
 const B=RIG.bones, TAU=Math.PI*2, q=RIG._q||(RIG._q=new THREE.Quaternion());

 const ph=RIG.phase, swingAmp=moving?0.38+run*0.5:0, kneeAmp=moving?0.35+run*0.6:0;

 for(const L of RIG.legs){
  let a=swingAmp*Math.sin(TAU*(ph+L.ph));
  let kb=kneeAmp*Math.max(0,Math.sin(TAU*(ph+L.ph)+1.0))*(L.front?1:-1);

   const jTop=L.front?0.7:-0.6, jKnee=L.front?1.0:-0.7;   // front legs tuck up, hind legs trail

  B[L.knee].quaternion.copy(L.rKnee).multiply(q.setFromAxisAngle(L.axKnee,kb));
 }

 for(const N of RIG.neck)B[N.i].quaternion.copy(N.r).multiply(q.setFromAxisAngle(N.ax,neckA));

 for(const T of RIG.tail)B[T.i].quaternion.copy(T.r).multiply(q.setFromAxisAngle(T.ax,tailA));
}

const TACK={saddle:null,rider:null,riderBones:null,attached:false};
// rider skeleton (from analysis): left leg hip20/knee21, right leg hip24/knee25; left-right = model x
const RIDER_HIPS=[20,24], RIDER_KNEES=[21,25];

const SADDLE_SCALE=0.62, SADDLE_DY=0.04, SADDLE_DZ=0.0, SADDLE_RY=Math.PI;
const RIDER_SCALE=0.95, RIDER_DY=0.10, RIDER_DZ=-0.02, RIDER_RY=Math.PI;

function _localAxis(bone,axisWorld){
 const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();

}
function poseRiderSeated(){

 for(const i of RIDER_HIPS)B[i].quaternion.multiply(q.setFromAxisAngle(_localAxis(B[i],X),RIDER_HIP_ANGLE));
 m.updateWorldMatrix(true,true);
 for(const i of RIDER_KNEES)B[i].quaternion.multiply(q.setFromAxisAngle(_localAxis(B[i],X),RIDER_KNEE_ANGLE));
 m.position.copy(sav.p);m.quaternion.copy(sav.r);m.scale.copy(sav.s);m.updateWorldMatrix(true,true);
}
function _fit(obj,scalar){obj.scale.setScalar(1);obj.position.set(0,0,0);obj.rotation.set(0,0,0);obj.updateWorldMatrix(true,true);

}

 g.add(loftZ(TORSO,18,coatDS));                   // one smooth swept torso
 blob(0.10,0.14,0.22,coat,0,1.62,0.42,g);         // withers ridge
 blob(0.14,0.16,0.14,coat,0,1.06,0.64,g);         // chest point

 {
  const mm=maneMat(mane);

   crest.push([0,mt*0.90,-0.21+0.40*mt]);

 }
 neck.rotation.x=-0.62;
 const head=new THREE.Group();head.position.set(0,0.945,0.40);neck.add(head);
 head.rotation.x=0.63;
 blob(0.034,0.030,0.034,shadeHex(body,0.12),0,-0.038,0.29,head);
 blob(0.030,0.018,0.036,coat,-0.068,0.04,0.03,head);
 blob(0.030,0.018,0.036,coat,0.068,0.04,0.03,head);
 blob(0.042,0.058,0.068,coat,-0.085,-0.015,-0.02,head);
 blob(0.042,0.058,0.068,coat,0.085,-0.015,-0.02,head);
 if(cfg.breed==='clyde'||seed%3!==1)blob(0.022,0.085,0.08,'#ece7df',0,0.02,0.10,head);
 blob(0.027,0.036,0.027,'#16161a',-0.075,0.02,0.05,head);
 blob(0.027,0.036,0.027,'#16161a',0.075,0.02,0.05,head);
 blob(0.009,0.011,0.009,'#f4f2ee',-0.094,0.032,0.062,head);
 blob(0.009,0.011,0.009,'#f4f2ee',0.094,0.032,0.062,head);

 if(cfg.bridle){

  nose.position.set(0,-0.026,0.195);head.add(nose);
  const brow=new THREE.Mesh(new THREE.TorusGeometry(0.10,0.010,6,14),strap);

  const cpR=box(0.011,0.14,0.011,'#4a3526',0.082,0.005,0.10,head);cpR.rotation.x=0.55;
 }
 const bitL=new THREE.Object3D();bitL.position.set(-0.064,-0.036,0.21);head.add(bitL);
 const bitR=new THREE.Object3D();bitR.position.set(0.064,-0.036,0.21);head.add(bitR);
 blob(0.046,0.04,0.08,mane,0,0.085,-0.07,head);

 earL.position.set(-0.046,0.075,-0.10);earR.position.set(0.046,0.075,-0.10);
 head.add(earL);head.add(earR);
 const earGeo=new THREE.ConeGeometry(0.032,0.13,7);
 const eL=new THREE.Mesh(earGeo,smat(body));eL.position.y=0.07;eL.castShadow=true;earL.add(eL);
 const eR=new THREE.Mesh(earGeo,smat(body));eR.position.y=0.07;eR.castShadow=true;earR.add(eR);
 earL.rotation.z=0.22;earR.rotation.z=-0.22;
 if(cfg.horn){
  const horn=new THREE.Mesh(new THREE.ConeGeometry(0.042,0.42,8),

 }
 const tail=new THREE.Group();tail.position.set(0,1.52,-1.02);g.add(tail);
 tail.add(loftY(TAILP,12,maneMat(mane)));
 tail.rotation.x=0.42;
 let wings=null;
 if(cfg.wings){
  const wShape=new THREE.Shape();
  wShape.moveTo(0,0);
  wShape.quadraticCurveTo(0.35,0.30,0.85,0.34);
  wShape.quadraticCurveTo(1.15,0.34,1.32,0.16);
  wShape.lineTo(1.18,0.02);wShape.lineTo(1.02,0.10);
  wShape.lineTo(0.86,-0.06);wShape.lineTo(0.70,0.04);
  wShape.lineTo(0.54,-0.10);wShape.lineTo(0.38,-0.02);
  wShape.quadraticCurveTo(0.16,-0.08,0,-0.06);
  wShape.closePath();
  const wGeo=new THREE.ShapeGeometry(wShape,6);
  {// camber: arch the span so it reads as a real wing, not a flat plate
   const wp=wGeo.attributes.position;
   for(let i=0;i<wp.count;i++){
    const wx=wp.getX(i);
    wp.setZ(i,-0.11*Math.sin(Math.min(1,Math.max(0,wx/1.32))*Math.PI));
   }
   wGeo.computeVertexNormals();
  }
  if(!window._featherTex){

    c.fillStyle='#f4f6fb';c.fillRect(0,0,w,h);

     c.lineWidth=1.4;
     c.beginPath();c.moveTo(x,h);c.quadraticCurveTo(x+10,h*0.45,x+5,0);c.stroke();
    }
    const gd=c.createLinearGradient(0,0,0,h);
    gd.addColorStop(0,'rgba(190,200,220,0.25)');gd.addColorStop(0.5,'rgba(255,255,255,0)');
    c.fillStyle=gd;c.fillRect(0,0,w,h);
   });
   window._featherTex.wrapS=window._featherTex.wrapT=THREE.RepeatWrapping;
   window._featherTex.repeat.set(1.4,2.6);
  }
  const wMat=new THREE.MeshStandardMaterial({map:window._featherTex,color:0xf4f6fb,roughness:0.82,side:THREE.DoubleSide});
  wMat.envMapIntensity=0.5;
  const cMat=new THREE.MeshStandardMaterial({map:window._featherTex,color:0xd9e1f0,roughness:0.9,side:THREE.DoubleSide});
  wings=[];
  for(const sgn of[-1,1]){
   const piv=new THREE.Group();
   piv.position.set(sgn*0.24,1.70,0.10);
   g.add(piv);
   const wm=new THREE.Mesh(wGeo,wMat);
   wm.rotation.x=Math.PI/2;
   wm.scale.set(sgn*1.45,1.45,1);
   wm.castShadow=true;
   piv.add(wm);
   const cm=new THREE.Mesh(wGeo,cMat);
   cm.rotation.x=Math.PI/2;
   cm.scale.set(sgn*0.78,0.82,1);
   cm.position.y=0.015;
   piv.add(cm);
   piv.userData.sgn=sgn;
   piv.rotation.z=sgn*0.30;
   wings.push(piv);
  }
 }
 const feathered=cfg.breed==='clyde'||cfg.breed==='shire';
 const legs=[
  makeLeg(g,-0.17,1.30,0.55,false,body,feathered||(seed+1)%5<2,feathered),
  makeLeg(g, 0.17,1.30,0.55,false,body,feathered||(seed+2)%5<2,feathered),
  makeLeg(g,-0.19,1.34,-0.55,true,body,feathered||(seed+3)%5<2,feathered),
  makeLeg(g, 0.19,1.34,-0.55,true,body,feathered||(seed+4)%5<2,feathered),
 ];
 if(cfg.tack){
  const ltL=leatherMat(shadeHex(cfg.tack,0.18)),lt=leatherMat(cfg.tack);
  box(0.5,0.035,0.42,ltL,0,1.745,0.10,g);
  box(0.045,0.22,0.36,ltL,-0.245,1.66,0.10,g);
  box(0.045,0.22,0.36,ltL,0.245,1.66,0.10,g);
  blob(0.145,0.085,0.23,lt,0,1.79,0.09,g);
  blob(0.055,0.07,0.055,lt,0,1.83,0.27,g);
 }
 const shadowM=contactShadow(g);
 return {group:g,legs,neck,tail,head,ears:[earL,earR],bitL,bitR,shadowM,wings};
}
function nameSprite(text){

const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_vm=new THREE.Vector3();
function updateRein(line,handObj,bitObj){
 handObj.getWorldPosition(_v1);
 bitObj.getWorldPosition(_v2);
 _vm.lerpVectors(_v1,_v2,0.5);_vm.y-=0.09;
 const attr=line.geometry.attributes.position;
 for(let i=0;i<8;i++){
  const u=i/7,a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;
  attr.setXYZ(i,a*_v1.x+b*_vm.x+c*_v2.x,a*_v1.y+b*_vm.y+c*_v2.y,a*_v1.z+b*_vm.z+c*_v2.z);
 }
 attr.needsUpdate=true;
 line.visible=true;
}

function makeGate(x,z,rotY){
 const g=new THREE.Group();
 for(const s of[-1,1]){
  tube(0.05,0.06,2.6,whitePaintMat,s*2.6,1.3,0,g);
  const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.42),
   new THREE.MeshBasicMaterial({color:s<0?0xc0392b:0x2e86c1,side:THREE.DoubleSide}));
  flag.position.set(s*2.6+(s<0?0.35:-0.35),2.35,0);
  g.add(flag);
 }
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.6,0.07,8,24),
  new THREE.MeshBasicMaterial({color:0xffd166}));
 ring.position.y=1.6;
 g.add(ring);
 g.position.set(x,groundH(x,z),z);
 g.rotation.y=rotY;
 scene.add(g);
 return {g,ring};
}

function startCourse(ev){
 cancelCourse();
 const jumps3=[];
 let par;
 if(ev.race){
  let pts=RACE_ROUTES[ev.route].map(p=>p.slice());
  if(ev.rev)pts=pts.slice().reverse();
  let len=0;
  pts.forEach((p,i)=>{
   const nx=pts[(i+1)%pts.length];
   len+=Math.hypot(nx[0]-p[0],nx[1]-p[1]);
   const rotY=Math.atan2(nx[0]-p[0],nx[1]-p[1]);
   const made=makeGate(p[0],p[1],rotY);
   const num=nameSprite(String(i+1));
   num.position.y=3.0;
   num.scale.set(1.1,0.34,1);
   made.g.add(num);
   jumps3.push({x:p[0],z:p[1],rotY,g:made.g,ring:made.ring,prevSide:0});
  });
  par=len/7.2;
 }else{
  const N=ev.n;
  const cx=2,cz=1,A=Math.min(17,11+N*0.6),B=Math.min(13,8+N*0.5);
  for(let i=0;i<N;i++){
   const th=i/N*Math.PI*2+0.4;
   const x=cx+Math.cos(th)*A,z=cz+Math.sin(th)*B;
   const rotY=Math.atan2(-A*Math.sin(th),B*Math.cos(th));
   const g=new THREE.Group();
   box(0.17,1.1,0.17,paintMat('#2e86c1'),-1.5,0.55,0,g);
   box(0.17,1.1,0.17,paintMat('#2e86c1'),1.5,0.55,0,g);
   box(3,0.13,0.1,whitePaintMat,0,0.55,0,g);
   box(3,0.13,0.1,whitePaintMat,0,0.9,0,g);
   const num=nameSprite(String(i+1));
   num.position.y=1.7;
   num.scale.set(1.1,0.34,1);
   g.add(num);
   g.position.set(x,groundH(x,z),z);
   g.rotation.y=rotY;
   scene.add(g);
   jumps3.push({x,z,rotY,g,prevSide:0});
  }
  par=N*9;
 }
 course={ev,jumps:jumps3,idx:0,t:0,cd:3.6,started:false,faults:0,race:!!ev.race,par};
 $('eventsPanel').style.display='none';
 $('courseHud').style.display='flex';
 $('courseHudTxt').textContent='🏆 '+ev.name+' — get ready!';
 if(net.client&&net.client.connected)netSendChat('🏁 started '+ev.name+' — join from 🏆 Events and race me!');
}
function cancelCourse(){
 if(!course)return;
 for(const j of course.jumps)scene.remove(j.g);
 course=null;
 arrow.visible=false;
 $('courseHud').style.display='none';
 $('countdown').style.display='none';
}
function finishCourse(){
 const c=course,ev=c.ev;
 const par=c.par||ev.n*9;
 const stars=c.t<par?'⭐⭐⭐':c.t<par*1.4?'⭐⭐':'⭐';
 let first=false;
 try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));first=!!(s&&s.trophies&&!s.trophies[ev.id]);}catch(e){}
 addCoins(ev.reward);
 addXp3D(Math.round(ev.reward/8));
 passAdd(50);
 if(first){addGems(1);syncSave(s=>{s.trophies[ev.id]=true;});}
 sChime();sGem();
 toast('🏆 '+ev.name+' — '+stars+' in '+c.t.toFixed(1)+'s! +'+ev.reward+'🪙'+(first?' +1💎':''));
 if(net.client&&net.client.connected)netSendChat('🏆 finished '+ev.name+' in '+c.t.toFixed(1)+'s '+stars);
 let newBest=false;
 syncSave(s=>{
  s.bestTimes=s.bestTimes||{};
  if(!s.bestTimes[ev.id]||c.t<s.bestTimes[ev.id]){s.bestTimes[ev.id]=+c.t.toFixed(1);newBest=true;}
 });
 if(newBest){toast('⏱️ New personal best on '+ev.name+'!');publishMyBoards();}
 questEvt('event',ev.id);
 dailyEvt('event',1);
 cancelCourse();
}

   if(s.items[k]<=0){msg='None left — stock up in the 🛍️ Shop!';ok=false;return;}

function drawBigMap(){
 const mc=$('bigmap').getContext('2d');
 const S=560/700;
 const W2=(x,z)=>[280+x*S,280+z*S];
 mc.fillStyle='#5d8c4f';mc.fillRect(0,0,560,560);
 const zone=(x,z,r,c)=>{
  const q=W2(x,z);
  const g=mc.createRadialGradient(q[0],q[1],8,q[0],q[1],r*S);
  g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
  mc.fillStyle=g;mc.fillRect(0,0,560,560);
 };
 zone(-220,130,170,'rgba(217,162,118,0.75)');
 zone(220,-110,150,'rgba(232,224,154,0.55)');
 zone(-160,-210,170,'rgba(238,242,240,0.6)');
 mc.strokeStyle='#4f9ad6';mc.lineWidth=6;mc.lineCap='round';
 mc.beginPath();
 for(let x=-340;x<=340;x+=16){
  const q=W2(x,riverZ(x));
  x===-150?mc.moveTo(q[0],q[1]):mc.lineTo(q[0],q[1]);
 }
 mc.stroke();
 mc.fillStyle='#d9c49a';
 const aq=W2(0,0);
 mc.beginPath();mc.ellipse(aq[0],aq[1],23.5*S,18.5*S,0,0,7);mc.fill();
 mc.strokeStyle='#fff';mc.lineWidth=2;
 mc.strokeRect(280-25*S,280-20*S,50*S,40*S);
 mc.strokeRect(280+PAST.x1*S,280+PAST.z1*S,(PAST.x2-PAST.x1)*S,(PAST.z2-PAST.z1)*S);
 const pq=W2(20,16);
 mc.fillStyle='#4f9ad6';mc.beginPath();mc.arc(pq[0],pq[1],4.5*S,0,7);mc.fill();
 mc.fillStyle='#b96b38';
 [[42,-50],[48,-56],[54,-48],[45,-43]].forEach(cc=>{
  const q=W2(cc[0],cc[1]);mc.fillRect(q[0]-3,q[1]-3,6,6);
 });
 if(course){
  mc.strokeStyle='rgba(255,209,102,0.85)';mc.lineWidth=2.5;
  mc.beginPath();
  course.jumps.forEach((j,i)=>{const q=W2(j.x,j.z);i?mc.lineTo(q[0],q[1]):mc.moveTo(q[0],q[1]);});
  mc.closePath();mc.stroke();
 }
 mc.font='700 16px "Trebuchet MS",sans-serif';mc.textAlign='center';
 const lbl=(x,z,s)=>{
  const q=W2(x,z);
  mc.strokeStyle='rgba(40,30,15,0.75)';mc.lineWidth=4;mc.strokeText(s,q[0],q[1]);
  mc.fillStyle='#fff';mc.fillText(s,q[0],q[1]);
 };
 lbl(0,-14,'⭐ Star Ranch');
 lbl(47,-64,'🏘️ Heartside');
 lbl(215,-100,'🌾 Agricola');
 lbl(-220,125,'🏜️ Bronco Canyon');
 lbl(-160,-205,'🏔️ Witberg');
 lbl(0,134,'🌉 River Crossing');
 const sv=freshSave();
 const n=sv&&sv.shoes3d?Object.keys(sv.shoes3d).length:0;
 mc.font='700 14px "Trebuchet MS",sans-serif';
 lbl(0,310,'🍀 Golden horseshoes: '+n+'/12 — explore to find them!');
 const q=W2(player.pos.x,player.pos.z);
 mc.save();
 mc.translate(q[0],q[1]);
 mc.rotate(-player.heading);
 mc.fillStyle='#fff';
 mc.strokeStyle='rgba(40,30,15,0.75)';mc.lineWidth=2;
 mc.beginPath();mc.moveTo(0,8);mc.lineTo(-5,-6);mc.lineTo(5,-6);mc.closePath();
 mc.fill();mc.stroke();
 mc.restore();
}

function netConnect(){
 if(typeof mqtt==='undefined'){toast('🌐 Online mode needs an internet connection');return;}
 if(net.client){try{net.client.end(true);}catch(e){}net.client=null;}
 const s=freshSave();
 const club=((s&&s.club)||'evervale').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)||'evervale';
 net.club=club;
 try{
  net.client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'srf_'+net.id,clean:true,connectTimeout:9000,reconnectPeriod:5000});
 }catch(e){netStatus('offline');return;}
 net.client.on('connect',()=>{
  netStatus('online');
  net.client.subscribe('srf1/'+club+'/pos');
  net.client.subscribe('srf1/'+club+'/chat');
  net.client.subscribe('srf1/'+club+'/lb/#');
  setTimeout(publishMyBoards,1500);
  toast('🟢 Connected to club "'+club+'" — riders who join it will appear in your world!');
  netSendChat('joined the club! 🐴');
 });
 net.client.on('message',(topic,payload)=>{
  let m;
  try{m=JSON.parse(payload.toString());}catch(e){return;}
  if(!m||m.id===net.id)return;
  if(topic.endsWith('/pos'))remoteUpdate(m);
  else if(topic.endsWith('/chat')&&typeof m.t==='string'){
   const nm2=String(m.n||'Rider').slice(0,14);
   chatMsg(nm2,m.t.slice(0,90));
   const rm=Object.values(remotes).find(r=>r.name===nm2);
   if(rm)showBubble(rm,m.t);
  }
  else{
   const tp=topic.split('/');
   if(tp[2]==='lb'&&tp[3]&&typeof m.v==='number'){
    lbData[tp[3]]=lbData[tp[3]]||{};
    lbData[tp[3]][String(m.n||tp[4]||'Rider').slice(0,14)]=m.v;
   }
  }
 });
 net.client.on('close',()=>netStatus('offline'));
 net.client.on('error',()=>netStatus('offline'));
}
function isFriend(name){

}
function remoteUpdate(m){
 if(typeof m.x!=='number'||typeof m.z!=='number')return;
 let r=remotes[m.id];
 if(!r){
  if(Object.keys(remotes).length>=12)return;
  const parts=makeHorse({colors:(m.c&&m.c.body)?m.c:{body:'#8a5a2b',mane:'#332214'},tack:m.k||'#7a583a',bridle:true,seed:5,wings:!!m.wg,coat:m.ct||null});
  const rider=makeRider({shirt:m.s||'#c98c5a',pants:m.p||'#4a4338'});
  parts.group.add(rider.g);
  const nm=String(m.n||'Rider').slice(0,14);
  const tag=nameSprite((isFriend(nm)?'💚':'🌐')+nm);
  tag.position.y=3.15;
  parts.group.add(tag);
  scene.add(parts.group);
  r=remotes[m.id]={parts,rider,name:nm,x:m.x,z:m.z,tx:m.x,tz:m.z,heading:m.h||0,sp:0,phase:Math.random()*6,lastSeen:0};
  chatMsg('🌐',nm+' is riding nearby!');
 }
 r.tx=m.x;r.tz=m.z;
 r.theading=m.h||0;
 r.sp=m.sp||0;
 r.lastSeen=0;
 if(m.c&&m.c.body)r.colors=m.c;
 if(m.hn)r.horseName=m.hn;
 if(m.b)r.breed=m.b;
 r.wings=!!m.wg;
 if(m.ct)r.coat=m.ct;
 if(m.hl)r.horseLv=m.hl;
}
function netTick(dt,t){
 if(net.client&&net.club&&t-net.lastPub>0.15){
  net.lastPub=t;
  const s=freshSave();
  const h=s&&s.horses[rideIdx];
  try{
   net.client.publish('srf1/'+net.club+'/pos',JSON.stringify({
    id:net.id,n:myName(),x:+player.pos.x.toFixed(1),z:+player.pos.z.toFixed(1),
    h:+player.heading.toFixed(2),sp:+Math.abs(player.speed).toFixed(1),
    c:h?h.colors:null,k:h?(h.tack||'#7a583a'):null,
    s:(s.rider&&s.rider.shirt)||'#c98c5a',p:(s.rider&&s.rider.pants)||'#4a4338',
    hn:h?String(h.name).slice(0,14):null,b:h?(h.breed||null):null,hl:h?(h.level||1):1,wg:!!(h&&h.wings),ct:h?(h.coat||null):null,
   }));
  }catch(e){}
 }
 for(const id of Object.keys(remotes)){
  const r=remotes[id];
  r.lastSeen+=dt;
  if(r.lastSeen>7){
   scene.remove(r.parts.group);
   delete remotes[id];
   continue;
  }
  r.x+=(r.tx-r.x)*Math.min(1,dt*5);
  r.z+=(r.tz-r.z)*Math.min(1,dt*5);
  if(typeof r.theading==='number'){
   let dh=r.theading-r.heading;
   while(dh>Math.PI)dh-=Math.PI*2;
   while(dh<-Math.PI)dh+=Math.PI*2;
   r.heading+=dh*Math.min(1,dt*6);
  }
  r.phase+=dt*(2.2+r.sp*1.9);
  const g3=gaitFor(r.sp);
  animateHorse(r.parts,r.phase,r.sp<0.2?0:g3.amp,g3,true,t,0,dt);
  r.parts.group.position.set(r.x,groundH(r.x,r.z),r.z);
  r.parts.group.rotation.y=r.heading;
  r.rider.g.rotation.x=-0.1;
 }
}

function updatePet(dt,t){
 if(!petComp)return;
 const off=2.2;
 const bx=player.pos.x-Math.sin(player.heading)*off+Math.cos(player.heading)*0.9;
 const bz=player.pos.z-Math.cos(player.heading)*off-Math.sin(player.heading)*0.9;
 const dx=bx-petComp.pos.x,dz=bz-petComp.pos.z,d=Math.hypot(dx,dz);
 if(d>40){petComp.pos.set(bx,0,bz);}      // catch up after fast travel
 let sp=0;
 if(d>0.6){
  const want=Math.atan2(dx,dz);let dh=want-petComp.heading;
  while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
  petComp.heading+=dh*Math.min(1,dt*7);
  sp=Math.min(11,1.4+d*0.7);
  petComp.pos.x+=Math.sin(petComp.heading)*sp*dt;
  petComp.pos.z+=Math.cos(petComp.heading)*sp*dt;
 }
 petComp.phase+=dt*(3+sp*2.2);
 const hop=sp>0.3?Math.abs(Math.sin(petComp.phase))*0.06*Math.min(1,sp/4):0;
 petComp.parts.group.position.set(petComp.pos.x,groundH(petComp.pos.x,petComp.pos.z)+hop,petComp.pos.z);
 petComp.parts.group.rotation.y=petComp.heading;
 const L=petComp.parts.legs;
 for(let i=0;i<4;i++){const o=i<2?0:Math.PI;L[i].rotation.x=Math.sin(petComp.phase+(i%2?Math.PI:0)+o)*0.5*Math.min(1,sp/3);}
 petComp.parts.tail.rotation.z=Math.sin(t*6)*0.25;  // happy wag
}

// long-haul variants share their hooks with the base types
function dailyTypeAliases(type){return type==='gallop'?['gallop','gallop2k']:type==='feed'?['feed','feed6']:[type];}
function todayDaily(){
 const ds=new Date().toDateString();
 let h=0;for(let i=0;i<ds.length;i++)h=(h*31+ds.charCodeAt(i))|0;
 const idx=[];let k=Math.abs(h)||1;
 while(idx.length<3){k=(k*1103515245+12345)%2147483647;const j=k%DAILYQ.length;if(!idx.includes(j))idx.push(j);}
 return idx.map(i=>DAILYQ[i]);
}
function ensureDq(s){
 const ds=new Date().toDateString();
 if(!s.dq||s.dq.date!==ds)s.dq={date:ds,prog:{},claimed:{}};
}
function dailyEvt(type,val){
 val=val||1;
 const today=todayDaily();
 for(const ty of dailyTypeAliases(type)){
  const q=today.find(q=>q.type===ty);
  if(!q)continue;
  let crossed=false;
  syncSave(s=>{
   ensureDq(s);
   const before=s.dq.prog[ty]||0;
   if(s.dq.claimed[ty]||before>=q.goal)return;
   s.dq.prog[ty]=Math.min(q.goal,before+val);
   crossed=before<q.goal&&s.dq.prog[ty]>=q.goal;
  });

function pad(fs){
 if(muted)return;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const t0=AC.currentTime;
  fs.forEach(f=>{
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine';o.frequency.value=f;
   g.gain.setValueAtTime(0.0001,t0);
   g.gain.linearRampToValueAtTime(0.026,t0+0.8);
   g.gain.linearRampToValueAtTime(0.0001,t0+4.6);
   o.connect(g);g.connect(AC.destination);
   o.start(t0);o.stop(t0+4.8);
  });
 }catch(e){}
}
function startMusic(){

const GAITS={
 walk:{off:[0,Math.PI,Math.PI*0.5,Math.PI*1.5],amp:0.42,rate:1.6},
 trot:{off:[0,Math.PI,Math.PI,0],amp:0.62,rate:1.9},
 gallop:{off:[0,0.45,Math.PI+0.3,Math.PI],amp:0.95,rate:1.55},
};
function gaitFor(sp){return sp<2.8?GAITS.walk:sp<7?GAITS.trot:GAITS.gallop;}
function animateHorse(parts,phase,amp,gait,grounded,t,grazing,dt){
 const k=dt?Math.min(1,dt*14):1;
 for(let i=0;i<4;i++){
  const o=gait.off[i];
  const swing=Math.sin(phase+o)*amp*(i<2?0.55:0.6);
  const lift=Math.max(0,Math.sin(phase+o+Math.PI*0.5));
  const hip=parts.legs[i].hip,knee=parts.legs[i].knee;
  hip.rotation.x+=(swing-hip.rotation.x)*k;
  knee.rotation.x+=((grounded?-lift*amp*1.15:-0.55)-knee.rotation.x)*k;
 }
 parts.tail.rotation.x=0.5+Math.sin(phase*0.55)*0.16;
 parts.tail.rotation.z=Math.sin(phase*0.4+1)*0.12;
 if(parts.wings){
  const pow=parts.wingPow||0;
  for(const w of parts.wings){
   const sgn=w.userData.sgn;
   const flap=grounded
    ?Math.sin(t*2.1)*0.06+Math.sin(phase)*0.05*amp
    :Math.sin(t*(6.5+pow*4.5))*(0.38+0.4*pow);
   w.rotation.z=sgn*(0.30+(grounded?flap:0.20+0.12*(1-pow)+flap));
   w.rotation.x=grounded?0:-(0.12+0.12*pow);
  }
 }
 if(grazing>0){
  parts.neck.rotation.x+=(0.55-parts.neck.rotation.x)*0.06;
  parts.head.rotation.x+=(0.85-parts.head.rotation.x)*0.06;
 }else{
  parts.head.rotation.x+=(0.63-parts.head.rotation.x)*0.08;
 }
}

 player.heading+=turn*dt*(1.7+Math.min(1.5,Math.abs(player.speed)*0.1));

  const S=70/130;
  const W2=(x,z)=>[70+x*S,70+z*S];
  mc.fillStyle='#d9c49a';
  mc.beginPath();mc.ellipse(70,70,23.5*S,18.5*S,0,0,7);mc.fill();
  mc.strokeStyle='rgba(244,240,230,0.9)';mc.lineWidth=1.5;
  mc.strokeRect(70-25*S,70-20*S,50*S,40*S);
  mc.strokeStyle='rgba(244,240,230,0.75)';mc.lineWidth=1.1;
  mc.strokeRect(70+PAST.x1*S,70+PAST.z1*S,(PAST.x2-PAST.x1)*S,(PAST.z2-PAST.z1)*S);
  mc.fillStyle='#4f9ad6';
  const pp=W2(20,16);
  mc.beginPath();mc.arc(pp[0],pp[1],4.5*S,0,7);mc.fill();
  mc.strokeStyle='#4f9ad6';mc.lineWidth=3.5;
  mc.beginPath();
  for(let rx=-128;rx<=128;rx+=12){
   const q=W2(rx,riverZ(rx));
   rx===-78?mc.moveTo(q[0],q[1]):mc.lineTo(q[0],q[1]);
  }
  mc.stroke();
  mc.fillStyle='#d9b85c';
  const wq=W2(35,-39);
  mc.fillRect(wq[0]-5,wq[1]-3,10,6);
  mc.fillStyle='#b96b38';
  [[42,-50],[48,-56],[54,-48],[45,-43]].forEach(cc=>{
   const q=W2(cc[0],cc[1]);
   mc.fillRect(q[0]-1.5,q[1]-1.5,3,3);
  });
  if(course){
   mc.strokeStyle='rgba(255,209,102,0.7)';mc.lineWidth=1.2;
   mc.beginPath();
   course.jumps.forEach((j,i)=>{const q=W2(j.x,j.z);i?mc.lineTo(q[0],q[1]):mc.moveTo(q[0],q[1]);});
   mc.closePath();mc.stroke();
   course.jumps.forEach((j,i)=>{
    const q=W2(j.x,j.z);
    mc.fillStyle=i===course.idx?'#ffd166':i<course.idx?'#9ab87a':'#eee';
    mc.beginPath();mc.arc(q[0],q[1],2.6,0,7);mc.fill();
   });
  }else{
   mc.fillStyle='#eee';
   for(const j of jumps){const q=W2(j.x,j.z);mc.fillRect(q[0]-1.5,q[1]-1.5,3,3);}
  }
  mc.fillStyle='#e8762a';
  for(const c of carrots)if(c.g.visible){const q=W2(c.g.position.x,c.g.position.z);mc.fillRect(q[0]-1,q[1]-1,2,2);}
  mc.fillStyle='#ddd';
  for(const a of herd){const q=W2(a.pos.x,a.pos.z);mc.beginPath();mc.arc(q[0],q[1],2,0,7);mc.fill();}
  mc.fillStyle='#ffb4a2';
  for(const n of npcs){const q=W2(n.pos.x,n.pos.z);mc.beginPath();mc.arc(q[0],q[1],2.2,0,7);mc.fill();}
  const pq=W2(player.pos.x,player.pos.z);
  mc.save();
  mc.translate(pq[0],pq[1]);
  mc.rotate(-player.heading);
  mc.fillStyle='#fff';
  mc.beginPath();mc.moveTo(0,4.2);mc.lineTo(-2.8,-3.2);mc.lineTo(2.8,-3.2);mc.closePath();mc.fill();
  mc.restore();
  mc.restore();
 }
 composer.render();
 hintT+=dt;
 if(hintT>9)$('hint').style.opacity='0';
 const ld=$('load');
 if(ld)ld.remove();
}
tick();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 composer.setSize(innerWidth,innerHeight);
});
</script>
<script>
setTimeout(()=>{
 const ld=document.getElementById('load');
 if(ld)ld.innerHTML='Hmm, the 3D engine could not load.<br>3D mode needs an internet connection the first time. 🛜';
},9000);
</script>
</body>
</html>
