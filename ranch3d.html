<style>
/* ================= Meadowlark UI 4 — paper & leather =================
   One design system, three layers:
     1. TOKENS   — colour, space, type, radius, elevation, rarity. Nothing below invents a value.
     2. PRIMITIVES — .mk-* component classes any panel can reach for.
     3. CHROME   — the global panel/HUD rules, so all sixteen panels improve at once.
   Every id the game writes to is unchanged; every legacy variable name still resolves. */
@font-face{font-family:"Fredoka";src:url("assets/fonts/fredoka.woff2") format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Nunito";src:url("assets/fonts/nunito.woff2") format("woff2");font-weight:400 900;font-display:swap}

/* ---------- 1. TOKENS ---------- */
:root{
 /* paper — the surfaces */
 --paper:#fffaf1;--paper-2:#f6ecd9;--paper-3:#efe1c6;--paper-raised:#fff;
 --line:#e6d6b8;--line-2:#d4bf93;
 /* ink — the type */
 --ink:#3b2a1e;--ink-2:#6b5a49;--ink-3:#9a8770;--ink-inv:#fff8ea;
 /* leather — the dark ground */
 --leather:#6b4a2f;--leather-2:#4a3220;--dark:rgba(43,30,20,.88);
 /* brass — the one accent */
 --brass:#e0b25a;--brass-2:#c8952f;--brass-3:#fff0c2;
 --gold:var(--brass);--gold-2:var(--brass-2);--gold-3:var(--brass-3);
 /* meadow / barn — good news and bad */
 --meadow:#5fb56a;--meadow-2:#3f8f4c;--meadow-3:#eaf5dc;
 --barn:#d9534f;--barn-2:#a33b37;--barn-3:#fdeceb;
 --green:var(--meadow);--green-2:var(--meadow-2);--red:var(--barn);
 --sky:#7fb8e6;--rose:#e88aa8;
 /* semantic state — kept separate from the brand accent on purpose */
 --good:var(--meadow-2);--good-bg:var(--meadow-3);
 --warn:#d9902f;--warn-bg:#fdf1dc;
 --bad:var(--barn-2);--bad-bg:var(--barn-3);
 /* rarity ramp — common → mythic, used everywhere a rarity appears */
 --rar-common:#9a8770;--rar-uncommon:#5fa86b;--rar-rare:#4a8fd4;
 --rar-epic:#9a6ae0;--rar-legendary:#e0a93c;--rar-mythic:#e0559a;
 --rarity:var(--rar-common);
 /* glass */
 --glass:rgba(255,250,241,.80);--glass-line:rgba(255,255,255,.75);
 /* space — a 4px scale, nothing off-grid */
 --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
 /* type — Fredoka displays, Nunito reads */
 --font:"Nunito","Trebuchet MS",sans-serif;--display:"Fredoka","Nunito","Trebuchet MS",sans-serif;
 --fs-xs:11px;--fs-sm:12.5px;--fs-md:13.5px;--fs-lg:15px;--fs-xl:18px;--fs-2xl:22px;--fs-3xl:30px;
 --lh-tight:1.2;--lh:1.45;
 /* radius */
 --r-xs:8px;--r-s:12px;--r:18px;--r-l:24px;--r-full:999px;
 /* elevation — one ladder, four rungs */
 --e0:0 1px 2px rgba(50,32,10,.06);
 --e1:0 2px 6px rgba(50,32,10,.14);
 --e2:0 10px 30px rgba(50,32,10,.22);
 --e3:0 30px 80px rgba(40,25,5,.38);
 --sh-1:var(--e1);--sh-2:var(--e2);--sh-3:var(--e3);
 --ring:0 0 0 3px rgba(224,178,90,.55);
 /* layout */
 --tb:64px;--dock-h:56px;--panel-pad:16px;--tap:44px;
 --panel-top:calc(64px + env(safe-area-inset-top));
 --panel-gap-bottom:calc(90px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;font-family:var(--font);color:var(--ink)}
canvas{display:block}
:focus-visible{outline:3px solid rgba(224,178,90,.65);outline-offset:2px;border-radius:6px}

/* ---------- 2. PRIMITIVES ---------- */
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--glass-line);box-shadow:var(--e2),inset 0 1px 0 rgba(255,255,255,.85)}

/* card — the neutral container for a group of rows */
.mk-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-s);padding:var(--sp-3);box-shadow:var(--e0)}
.mk-card+.mk-card{margin-top:var(--sp-2)}
.mk-card.good{border-color:#bfe0a4;background:linear-gradient(180deg,#fff,var(--good-bg))}
.mk-card.warn{border-color:#eccf93;background:linear-gradient(180deg,#fff,var(--warn-bg))}
.mk-card.bad{border-color:#efc0bd;background:linear-gradient(180deg,#fff,var(--bad-bg))}

/* row — media | content | trailing action. The trailing cell NEVER wraps onto a second line. */
.mk-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:var(--sp-3);row-gap:2px;
 border:1px solid var(--line);border-radius:14px;padding:var(--sp-2) var(--sp-3);background:var(--paper-raised);
 box-shadow:var(--e0);font-size:var(--fs-md);min-height:var(--tap);transition:transform .12s,box-shadow .15s,border-color .15s}
.mk-row>*{min-width:0}
.qrow{display:flex;flex-wrap:nowrap;align-items:center;gap:var(--sp-3);min-height:var(--tap)}
.qrow>.qico{flex:none;width:32px;text-align:center;font-size:22px}
.qrow>.qmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--sp-1)}
.qrow>button,.qrow>.chip,.qrow>.mk-chip,.qrow>.badge{flex:none;white-space:nowrap}
.mk-row__media{grid-column:1;font-size:22px;line-height:1;text-align:center;width:32px}
.mk-row__main{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:var(--sp-1)}
.mk-row__end{grid-column:3;justify-self:end;white-space:nowrap}
/* Legacy shape: a bare emoji text node, <b>name</b>, <span>detail</span>, <button>price</button>.
   Those anonymous text nodes rule out a grid here, so: one no-wrap flex line, the text cells
   given min-width:0 so they shrink and wrap inside themselves, and the trailing control pinned
   right with flex:none. A price chip can no longer be pushed onto a line of its own. */
.evrow{display:flex;flex-wrap:nowrap;align-items:center;gap:var(--sp-2);
 border:1px solid var(--line);border-radius:14px;padding:var(--sp-2) var(--sp-3);background:var(--paper-raised);
 box-shadow:var(--e0);font-size:var(--fs-md);min-height:var(--tap);transition:transform .12s,box-shadow .15s,border-color .15s}
/* The text cells still shrink, but never below a readable floor: a row that a feature package
   has stuffed with extra chips used to squeeze a name down to one character per line. min() keeps
   the floor from becoming a minimum width on a narrow phone row, and break-word splits a word only
   when it genuinely cannot fit rather than at every character. */
.evrow>b{flex:0 1 auto;min-width:min(100%,4.5em);font-weight:800;overflow-wrap:break-word;line-height:var(--lh-tight)}
.evrow>span{flex:1 1 auto;min-width:min(100%,6em);color:var(--ink-2);font-size:var(--fs-sm);font-weight:600;overflow-wrap:break-word;line-height:var(--lh-tight)}
.evrow>button,.evrow>select,.evrow>.chip,.evrow>.mk-chip,.evrow>.badge{flex:0 0 auto;white-space:nowrap;margin:0}
/* The stable roster is the one row six feature packages all splice into — breed, bond, mastery,
   lineage, tack. One line cannot hold that, and nowrap pushed Tack and Rename off the end where
   they could not be clicked. Here, and only here, the row wraps so every control stays reachable. */
#stablePanel .evrow{flex-wrap:wrap;row-gap:var(--sp-1)}
.evrow>button:first-of-type,.evrow>.chip:first-of-type,.evrow>.mk-chip:first-of-type{margin-left:auto}
.evrow:hover,.mk-row:hover{transform:translateX(2px);box-shadow:var(--e1)}
.evrow.done,.qrow.done{border-color:#bfe0a4;background:linear-gradient(180deg,#fff,var(--good-bg))}
.qrow.claimed{opacity:.55}
.qrow{font-weight:700}

/* chip — a compact fact. Numbers get tabular figures so columns line up. */
.mk-chip,.chip{display:inline-flex;align-items:center;gap:var(--sp-1);background:var(--paper-2);border:1px solid var(--line);
 border-radius:var(--r-full);padding:4px 11px;font-weight:800;font-size:var(--fs-sm);color:var(--ink);white-space:nowrap;
 font-variant-numeric:tabular-nums;line-height:1.35}
.chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7);box-shadow:var(--e1);padding:5px 12px;font-size:13px;font-weight:700}
.mk-chip.gold{background:var(--brass-3);border-color:#e8cf8a;color:#6b4e12}
.mk-chip.good{background:var(--good-bg);border-color:#bfe0a4;color:var(--good)}
.mk-chip.warn{background:var(--warn-bg);border-color:#eccf93;color:var(--warn)}
.mk-chip.bad{background:var(--bad-bg);border-color:#efc0bd;color:var(--bad)}

/* bar — carries its value and its cap */
.mk-bar,.cbar,.qbar{position:relative;flex:1;height:10px;min-width:40px;background:rgba(59,42,30,.1);border-radius:var(--r-full);overflow:hidden;box-shadow:inset 0 1px 2px rgba(50,32,10,.1)}
.mk-bar>i,.cfill,.qfill{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--brass),#ffd97a);transition:width .3s}
.mk-bar.good>i{background:linear-gradient(90deg,var(--meadow-2),var(--meadow))}
.mk-bar.warn>i{background:linear-gradient(90deg,#c47f1d,#eab55a)}
.mk-bar.bad>i{background:linear-gradient(90deg,var(--barn-2),#e8827e)}
.mk-bar__cap{font-size:var(--fs-xs);font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qbar{height:8px}

/* tabs — a strip that scrolls sideways. It must never wrap to a second row. */
.mk-tabs,.crow:has(> .tabbtn),.lbTabs{display:flex!important;flex-wrap:nowrap!important;align-items:center;gap:var(--sp-1);
 background:var(--paper-2);border-radius:var(--r-full);padding:var(--sp-1);width:auto;max-width:100%;
 overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
 mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.mk-tabs::-webkit-scrollbar,.crow:has(> .tabbtn)::-webkit-scrollbar,.lbTabs::-webkit-scrollbar{display:none}
.mk-tabs>*,.crow:has(> .tabbtn)>*,.lbTabs>*{flex:none;scroll-snap-align:start}
.crow:has(> .tabbtn) .lbl{position:sticky;left:0;z-index:1}
.tabbtn,.mk-tab{background:transparent;border:1px solid transparent;box-shadow:none;border-radius:var(--r-full);padding:7px 13px;color:var(--ink-2);font-size:var(--fs-md);font-weight:700;white-space:nowrap}
.tabbtn:hover,.mk-tab:hover{transform:none;background:rgba(255,255,255,.6);filter:none;box-shadow:none}
.tabbtn.on,.mk-tab.on{background:var(--ink);color:var(--ink-inv);border-color:var(--ink);box-shadow:var(--e1)}

/* buttons */
select,button,a.btn,.mk-btn{font-family:var(--font);font-weight:700;font-size:13.5px;color:var(--ink);background:linear-gradient(#fffaf0,#f1e2c4);border:1.5px solid var(--line-2);border-radius:var(--r-s);padding:7px 12px;cursor:pointer;box-shadow:inset 0 1px 0 #fff,var(--e1);transition:transform .12s,box-shadow .15s,filter .15s,background .15s;text-decoration:none;line-height:var(--lh-tight)}
button:hover,a.btn:hover,select:hover,.mk-btn:hover{transform:translateY(-1px);filter:brightness(1.04);box-shadow:inset 0 1px 0 #fff,0 5px 12px rgba(50,32,10,.2)}
button:active,.mk-btn:active{transform:translateY(1px) scale(.97);box-shadow:inset 0 2px 4px rgba(50,32,10,.18);filter:brightness(.98)}
button:disabled,.mk-btn[disabled]{opacity:.45;cursor:default;transform:none;filter:none}
button:focus-visible,select:focus-visible,input:focus-visible,a.btn:focus-visible{outline:3px solid rgba(224,178,90,.65);outline-offset:2px}
.mk-btn--primary,.claimBtn{background:linear-gradient(#ffe7a6,#e9bb52);border-color:var(--brass-2);color:#4a3210}
.mk-btn--secondary{background:linear-gradient(#fffaf0,#f1e2c4)}
.mk-btn--ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.mk-btn--ghost:hover{background:rgba(224,178,90,.18);border-color:rgba(224,178,90,.35);box-shadow:none;filter:none}
.mk-btn--danger{background:linear-gradient(#fbe0de,#f0b6b2);border-color:#d79b96;color:#7d2b26}
button.ico{width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;display:inline-flex;align-items:center;justify-content:center}

/* thumb — a portrait with a rarity ring */
.mk-thumb{position:relative;flex:none;width:48px;height:48px;border-radius:var(--r-xs);overflow:hidden;background:var(--paper-2);
 display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;
 box-shadow:0 0 0 2px var(--rarity),var(--e0)}
.mk-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mk-thumb.round{border-radius:50%}
.mk-thumb.r-common{--rarity:var(--rar-common)}.mk-thumb.r-uncommon{--rarity:var(--rar-uncommon)}
.mk-thumb.r-rare{--rarity:var(--rar-rare)}.mk-thumb.r-epic{--rarity:var(--rar-epic)}
.mk-thumb.r-legendary{--rarity:var(--rar-legendary)}.mk-thumb.r-mythic{--rarity:var(--rar-mythic)}

/* badge / pip */
.mk-badge,.badge{display:inline-block;background:linear-gradient(#ffe39a,var(--brass));color:#4a3210;border-radius:var(--r-xs);padding:1px 7px;font-size:var(--fs-xs);font-weight:800;box-shadow:var(--e1);white-space:nowrap}
.mk-badge.good{background:var(--good-bg);color:var(--good);box-shadow:none}
.mk-badge.bad{background:var(--bad-bg);color:var(--bad);box-shadow:none}
#dock .pip,#sysBtns .pip,.lbTabs .pip{display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:9px;background:#e05a3c;color:#fff;font-size:10px;font-weight:800;margin-left:4px;padding:0 3px;vertical-align:top}

/* empty state + note */
.mk-empty{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--ink-3);font-weight:700;font-size:var(--fs-md)}
.mk-empty .ico{font-size:34px;opacity:.55}
.mk-note{font-size:var(--fs-sm);line-height:var(--lh);color:var(--ink-2);background:var(--paper-2);border-left:3px solid var(--brass);border-radius:0 var(--r-xs) var(--r-xs) 0;padding:var(--sp-2) var(--sp-3)}
.mk-note.good{border-left-color:var(--meadow);background:var(--good-bg)}
.mk-note.bad{border-left-color:var(--barn);background:var(--bad-bg)}
.mk-section{font-family:var(--display);font-size:var(--fs-lg);font-weight:600;color:var(--ink);margin:var(--sp-3) 0 var(--sp-2);display:flex;align-items:center;gap:var(--sp-2)}

/* ---------- 3. CHROME: the HUD ---------- */
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
#hud *{pointer-events:auto}
#wallet{display:flex;gap:14px;align-items:center;padding:7px 16px;border-radius:var(--r-full)}
#wallet .w{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#wallet .w i{font-style:normal;font-size:15px}
#sysBtns{display:flex;gap:6px}
#vrBtn{top:calc(58px + env(safe-area-inset-top))!important;right:calc(12px + env(safe-area-inset-right))!important;z-index:5!important;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7);border-radius:var(--r-full);font-size:13px}
#sysBtns button{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7)}
/* the horse card (top-left) */
#statusCard{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:6;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:20px;width:250px;color:var(--ink)}
#scTop{display:flex;align-items:center;gap:10px;position:relative}
#scPortrait{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #fff;box-shadow:0 3px 9px rgba(50,32,10,.3);flex:none;overflow:hidden}
#scPortrait img{width:100%;height:100%;object-fit:cover}
#gaitEl{position:absolute;left:36px;top:34px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid #fff;box-shadow:var(--e1);font-size:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#scInfo{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
#scName{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
#horseSel{font-size:12px;padding:3px 10px;border-radius:var(--r-full);background:var(--paper-2);border-color:var(--line);box-shadow:none;width:100%;min-height:0}
.scbars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scb{height:7px;border-radius:4px;background:rgba(59,42,30,.12);overflow:hidden}
.scb i{display:block;height:100%;border-radius:4px;transition:width .4s}
#scXp{height:5px;border-radius:3px;background:rgba(59,42,30,.12);overflow:hidden}
#scXp i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#ffd97a)}
#scBtns{display:flex;gap:6px}
#scBtns button{flex:1;height:36px;padding:0;border-radius:12px;font-size:16px}
#nameEl{display:none}
/* quest pill, course capsule, stamina (top-centre) */
#questTrack{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-line);border-radius:var(--r-full);padding:7px 16px;font-weight:700;font-size:13px;color:var(--ink);max-width:min(46vw,520px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--e1)}
#courseHud{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:var(--dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink-inv);padding:9px 18px;border-radius:var(--r-full);font-family:var(--display);font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,248,234,.18);box-shadow:var(--e2)}
#courseHud button{padding:3px 10px;border-radius:var(--r-full);font-size:12px}
#stamWrap{position:fixed;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;width:170px;height:8px;border-radius:6px;background:rgba(43,30,20,.55);border:1px solid rgba(255,248,234,.6);display:none;overflow:hidden}
#stamFill{height:100%;width:100%;background:linear-gradient(90deg,#7fd07a,#b5e88a);border-radius:6px;transition:width .12s linear}
#stamWrap.blown #stamFill{background:linear-gradient(90deg,#e06a5a,#ff9a7a)}
#countdown{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);z-index:8;font-family:var(--display);font-size:110px;font-weight:700;color:var(--ink-inv);text-shadow:0 6px 24px rgba(40,25,5,.55),0 0 2px rgba(0,0,0,.4);display:none;letter-spacing:.02em}

/* ---------- the dock: one height, one baseline, every item labelled ---------- */
/* Anchored in the band to the RIGHT of the minimap rather than centred on the viewport: now that
   every item carries a label the bar is wide enough that a viewport-centred dock slid its first
   item under the minimap. width:max-content + margin auto keeps it centred in that band while it
   fits, and clamps it to the band (still scrollable) when it does not. */
#dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));
 left:calc(186px + env(safe-area-inset-left));right:12px;width:max-content;margin:0 auto;z-index:6;
 display:flex;align-items:stretch;gap:2px;padding:5px;border-radius:20px;max-width:100%;
 overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
 scroll-snap-type:x proximity;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
 mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
#dock::-webkit-scrollbar{display:none}
#dock button{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;justify-content:center;gap:6px;
 height:var(--tap);min-height:var(--tap);background:transparent;border:1px solid transparent;box-shadow:none;border-radius:14px;
 padding:0 13px;font-size:13.5px;font-weight:700;white-space:nowrap;line-height:1}
#dock button:hover{background:rgba(224,178,90,.18);border-color:rgba(224,178,90,.35);transform:none;box-shadow:none;filter:none}
#dock button:active{transform:scale(.96)}
#dock button.on{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
#dock .badge{margin-left:0;vertical-align:baseline}

/* ---------- prompts, hints, toasts ---------- */
#hint{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;background:var(--dark);color:var(--ink-inv);padding:8px 16px;border-radius:var(--r-full);font-size:13px;font-weight:600;transition:opacity 1s;pointer-events:none;border:1px solid rgba(255,248,234,.15)}
#ctx{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:7;background:var(--dark);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink-inv);padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;display:none;border:1px solid rgba(255,248,234,.22);box-shadow:var(--e2);animation:rise .18s ease}
#tameHud{position:fixed;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:var(--dark);color:var(--ink-inv);padding:8px 16px;border-radius:var(--r-full);font-weight:700;display:none}
#roundHud{position:fixed;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:#3d5a2a;color:#f2ffe6;padding:8px 18px;border-radius:var(--r-full);font-weight:800;display:none;box-shadow:var(--e2)}
#drillHud{position:fixed;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:#6b3f18;color:#fff3e0;padding:8px 18px;border-radius:var(--r-full);font-weight:800;display:none;box-shadow:var(--e2)}
#poseBar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:12;display:none;gap:6px;align-items:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-line);border-radius:var(--r-full);padding:7px 12px;box-shadow:var(--e2);flex-wrap:wrap;max-width:94vw}
#poseBar .pl{font-size:12px;font-weight:800;color:var(--ink-2);padding:0 4px}
body.posing #poseBar{display:flex}
body.posing #dock,body.posing #questTrack,body.posing #statusCard,body.posing #mini,body.posing #hint,body.posing #ctx{display:none!important}
#shotCount{position:fixed;inset:0;z-index:13;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:150px;font-weight:800;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.55)}
#shotCount.on{display:flex}
#toasts{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(116px + env(safe-area-inset-bottom));z-index:9;display:flex;flex-direction:column;align-items:flex-end;width:min(350px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--dark);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink-inv);padding:9px 13px;border-radius:14px;font-size:13px;line-height:var(--lh);font-weight:600;border-left:3px solid var(--brass);box-shadow:var(--e1);animation:rise .22s ease;width:100%;overflow-wrap:anywhere}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes rise{from{transform:translateY(8px) scale(.96)}to{transform:translateY(0) scale(1)}}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
/* ---- loading ---- */
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 8%,#c6e4f7 0%,#a9cfe8 40%,#8fbf6a 100%);color:#2f4a5e;font-family:var(--display);font-size:30px;font-weight:600;z-index:30;text-align:center;letter-spacing:.01em}
#loadbar{width:220px;height:8px;margin:16px auto 0;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
#loadbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--brass),#ffe6a8);border-radius:99px;transition:width .25s ease}
#loadpct{margin-top:8px;font-family:var(--font);font-size:13px;font-weight:700;opacity:.7}

/* ---------- 4. GLOBAL PANEL CHROME ----------
   Sixteen panels, one rule. The panel is the scrollport: it is capped to the space between
   the top offset and the dock, it scrolls inside itself (so nothing is ever clipped away),
   its first child sticks as a header, and its last row clears the safe area. */
#eventsPanel,#carePanel,#shopPanel,#onlinePanel,#lbPanel,#moneyPanel,#summonPanel,#buildPanel,#stablePanel,#questPanel,#profilePanel,.fpanel{
 position:fixed;top:var(--panel-top);left:50%;transform:translateX(-50%);z-index:10;
 background:linear-gradient(180deg,#fffdf7,#fbf3e3);border:1px solid rgba(255,255,255,.8);border-radius:var(--r-l);
 padding:var(--panel-pad) var(--panel-pad) calc(var(--panel-pad) + 6px);
 display:none;flex-direction:column;gap:var(--sp-2);
 max-height:calc(100dvh - var(--panel-top) - var(--panel-gap-bottom));
 overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
 width:min(470px,94vw);color:var(--ink);box-shadow:var(--e3),inset 0 1px 0 #fff;
 animation:panelIn .22s ease;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
@keyframes panelIn{from{transform:translateX(-50%) translateY(-14px) scale(.985)}to{transform:translateX(-50%) translateY(0) scale(1)}}   /* transform only: an entrance must never leave a panel invisible if the timeline stalls */
#eventsPanel::-webkit-scrollbar,#shopPanel::-webkit-scrollbar,#stablePanel::-webkit-scrollbar,#questPanel::-webkit-scrollbar,#lbPanel::-webkit-scrollbar,#carePanel::-webkit-scrollbar,#buildPanel::-webkit-scrollbar,#onlinePanel::-webkit-scrollbar,#moneyPanel::-webkit-scrollbar,#summonPanel::-webkit-scrollbar,#profilePanel::-webkit-scrollbar,.fpanel::-webkit-scrollbar{width:8px}
#eventsPanel::-webkit-scrollbar-thumb,#shopPanel::-webkit-scrollbar-thumb,#stablePanel::-webkit-scrollbar-thumb,#questPanel::-webkit-scrollbar-thumb,#lbPanel::-webkit-scrollbar-thumb,#carePanel::-webkit-scrollbar-thumb,#buildPanel::-webkit-scrollbar-thumb,#onlinePanel::-webkit-scrollbar-thumb,#moneyPanel::-webkit-scrollbar-thumb,#summonPanel::-webkit-scrollbar-thumb,#profilePanel::-webkit-scrollbar-thumb,.fpanel::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
/* the header area sticks, whether the panel builds a .panelHeader or just opens with a <b> */
.ph,#eventsPanel>b:first-child,#lbPanel>b:first-child,#onlinePanel>b:first-child,#carePanel>b:first-child,#shopPanel>b:first-child,#stablePanel>b:first-child,#questPanel>b:first-child,#moneyPanel>b:first-child,#summonPanel>b:first-child,#buildPanel>b:first-child,#profilePanel>b:first-child,.fpanel>b:first-child{
 font-family:var(--display);font-size:var(--fs-xl);font-weight:600;display:flex;align-items:center;gap:var(--sp-2);letter-spacing:.01em;color:var(--ink)}
#eventsPanel>b:first-child,#lbPanel>b:first-child,#onlinePanel>b:first-child,#carePanel>b:first-child,#shopPanel>b:first-child,#stablePanel>b:first-child,#questPanel>b:first-child,#moneyPanel>b:first-child,#summonPanel>b:first-child,#buildPanel>b:first-child,#profilePanel>b:first-child,.fpanel>b:first-child{
 position:sticky;top:calc(-1 * var(--panel-pad));z-index:3;flex:none;
 margin:calc(-1 * var(--panel-pad)) calc(-1 * var(--panel-pad)) 2px;padding:14px var(--panel-pad) 10px;
 background:#fffdf7;border-bottom:1px solid var(--line)}
.ph .chip{font-family:var(--font);font-size:12px}
.panelHeader{position:sticky;top:calc(-1 * var(--panel-pad));z-index:3;margin:calc(-1 * var(--panel-pad)) calc(-1 * var(--panel-pad)) 2px;padding:12px var(--panel-pad);background:#fffdf7;border-bottom:1px solid var(--line);flex-shrink:0}
.panelHeader b{flex:1;min-width:0;font-size:var(--fs-xl)}
.panelClose{flex:none;min-height:40px;padding:8px 11px;font-size:12px;white-space:nowrap}

/* ---------- panel interior components ---------- */
.passCard{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--paper-raised);box-shadow:var(--e0)}
.passCard .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.passCard .sub{font-size:var(--fs-xs);color:var(--ink-2);margin:2px 0 6px}
.passStrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;overscroll-behavior-x:contain}
.passStrip::-webkit-scrollbar{height:7px}
.passStrip::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
.tierCard{flex:none;width:76px;border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;background:#fdfaf2}
.tierCard.now{border-color:var(--rar-legendary);background:#fff8e8;box-shadow:0 0 0 2px rgba(224,169,60,.28)}

.tslot{margin-top:3px;font-size:10px;font-weight:700;border-radius:7px;padding:4px 2px;min-height:24px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.tslot.free{background:#eef4e4;color:#4a3526}
.tslot.gold{background:var(--brass-3);color:#6b4e12}
.tslot.lock{opacity:.42}
.tslot.done{background:#e2efd6;color:#5b7a44}
.tslot button{font-size:10px;padding:2px 4px;width:100%;min-height:0;height:auto}
.vipCard{border:1px solid #e8cf8a;border-radius:14px;padding:11px 12px;background:linear-gradient(180deg,#fff8e2,#ffeec0)}
.vipCard .perks{font-size:11.5px;color:#4a3526;line-height:1.5;margin:4px 0 7px}
.vipCard .plans{display:flex;gap:6px;flex-wrap:wrap}
.shotRow{display:flex;gap:6px;overflow-x:auto;padding:5px 2px 7px}
.shot{position:relative;flex:none;width:118px;border:2px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:#000;line-height:0}
.shot.pick{border-color:var(--rar-legendary);box-shadow:0 0 0 2px rgba(224,169,60,.3)}
.shot img{width:100%;display:block}
.shot .sc{position:absolute;top:3px;right:3px;background:rgba(20,16,10,.72);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;line-height:1.4}
.shot .ent{position:absolute;bottom:3px;left:3px;background:var(--rar-legendary);color:#3a2a10;font-size:9px;font-weight:800;border-radius:6px;padding:1px 5px;line-height:1.5}
/* the reveal card: nothing but the horse and its name, over a hidden HUD */
#summonFx{position:fixed;inset:0;z-index:60;display:none;pointer-events:none;text-align:center}
body.summoning #hud,body.summoning #dock,body.summoning #questTrack,body.summoning #mini,body.summoning #ctx,
body.summoning #statusCard,body.summoning #stamWrap,body.summoning #touch,body.summoning #stickZone,
body.summoning #chatFeed,body.summoning #hint{display:none!important}
body.summoning #summonFx{display:block}
#sfxRar{position:absolute;left:0;right:0;top:12%;font-size:15px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;opacity:0;transition:opacity .5s}
#sfxName{position:absolute;left:0;right:0;top:16.5%;font-size:44px;font-weight:800;color:#fff;opacity:0;transition:opacity .6s;text-shadow:0 3px 22px rgba(0,0,0,.65)}
#sfxBreed{position:absolute;left:0;right:0;top:25%;font-size:16px;font-weight:700;color:#fff;opacity:0;transition:opacity .6s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sumTier{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper-raised);margin-bottom:7px}
.sumTier .odds{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.sumOdd{font-size:var(--fs-xs);font-weight:800;border-radius:7px;padding:2px 7px;color:#fff}
.lbTabs{margin:2px 0 4px}
.bGroup{font-size:12px;font-weight:800;color:#8c7a63;margin:8px 0 3px}
.bRow{border:1px solid var(--line);border-radius:12px;padding:7px 10px;background:var(--paper-raised);margin-bottom:5px}
.bHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:800}
.bHead .rk{font-size:11px;color:#8c7a63;font-weight:700}
.bList{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.bE{font-size:11px;font-weight:700;background:#f7f2e6;border-radius:7px;padding:2px 6px;color:#6b5a44}
.bE.me{background:#dceccb;color:#3f5f2c}
.bE.club{background:#dbeaf7;color:#24506e}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 2px}
.calDay{border:1px solid var(--line);border-radius:9px;padding:4px 2px;text-align:center;background:#fdfaf2;min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.calDay .dn{font-size:9px;font-weight:800;color:#b8a888}
.calDay .rw{font-size:9.5px;font-weight:700;color:#8c7a63;line-height:1.15}
.calDay.big{background:#fff4dc;border-color:#e8cf8a}
.calDay.open{background:var(--good-bg);border-color:#8fbf6a;cursor:pointer}
.calDay.open .rw{color:#3f5f2c}
.calDay.done{background:#e2efd6;border-color:#bfe0a4}
.calDay.done .rw{color:#5b7a44}
/* the care panel's stat rows: label | bar | value, and the value column never wraps */
.crow{display:flex;align-items:center;gap:var(--sp-2);font-size:13px;min-height:30px}
.crow .lbl{min-width:68px;max-width:150px;font-weight:700;color:var(--ink-2);font-size:12px;line-height:var(--lh-tight);flex:none}
.crow>b,.crow>span:last-child{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- dialogue ---- */
#dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;background:linear-gradient(180deg,#fffdf7,#fbf3e3);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:18px 20px 16px;width:min(440px,92vw);max-height:min(80dvh,760px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;color:var(--ink);display:none;box-shadow:var(--e3);animation:pop .2s ease}
#dlg>b{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--paper-2);border-radius:var(--r-full);padding:4px 12px;margin-bottom:6px}
#dlg p{line-height:var(--lh);font-size:15px;margin:8px 0}
#dlg button{margin-top:4px}
/* ---- chat ---- */
#chatFeed{position:fixed;left:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;gap:4px;max-width:min(340px,70vw);pointer-events:none}
#chatFeed div{background:var(--dark);color:var(--ink-inv);padding:6px 12px;border-radius:12px;font-size:13px;font-weight:600;overflow-wrap:break-word}
#chatBar{position:fixed;left:16px;bottom:calc(110px + env(safe-area-inset-bottom));z-index:8;display:none;gap:6px;width:min(360px,72vw)}
#chatBar input{flex:1;font-family:var(--font);font-size:14px;padding:8px 12px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--paper)}
/* ---- map, minimap, build, free camera ---- */
#mini{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:calc(16px + env(safe-area-inset-left));z-index:6;border:3px solid rgba(255,250,241,.92);border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
#bigmapWrap{position:fixed;inset:0;background:rgba(30,40,25,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:25;display:none;align-items:center;justify-content:center}
#bigmap{border:4px solid #f3e6c6;border-radius:24px;box-shadow:var(--e3);max-width:92vw;max-height:80vh}
#ftBar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:92vw;margin-top:12px}
#ftBar button{font-size:13px;padding:6px 12px;background:var(--glass);border-color:rgba(255,255,255,.7)}
#buildHud{display:none;position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-line);border-radius:14px;padding:9px 14px;color:var(--ink);font-weight:700;font-size:13px;box-shadow:var(--e2);max-width:94vw;text-align:center}
#buildHud button{margin-left:6px}
#buildHud.bad{border-color:var(--barn);color:var(--bad)}
body.freecam #hud,body.freecam #hint,body.freecam #questTrack,body.freecam #mini,body.freecam #ctx,body.freecam #statusCard,body.freecam #stamWrap,body.freecam #touch,body.freecam #stickZone,body.freecam #chatFeed,body.freecam #tameHud,body.freecam #dock{display:none!important}
#fcHint{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9;background:var(--dark);color:var(--ink-inv);padding:7px 14px;border-radius:var(--r-full);font-size:12px;font-weight:600}
body.freecam #fcHint{display:block}
/* ---- touch ---- */
#touch{position:fixed;z-index:6;user-select:none;-webkit-user-select:none;display:none;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,var(--tb));gap:10px;touch-action:none}
#touch button{width:var(--tb);height:var(--tb);border-radius:50%;font-size:23px;opacity:.94;touch-action:none;padding:0;border-width:2px;box-shadow:0 4px 12px rgba(40,25,5,.3);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#touch button:active{transform:scale(.92);filter:brightness(1.1)}
#stickZone{position:fixed;left:0;bottom:0;width:46vw;height:56vh;z-index:6;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stickBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:3px solid rgba(255,248,234,.55);background:rgba(74,53,38,.22);opacity:0;transition:opacity .12s;pointer-events:none}
#stickKnob{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff8ea,#e3cf9f);border:3px solid var(--line-2);box-shadow:0 4px 12px rgba(40,25,5,.35);opacity:0;transition:opacity .12s;pointer-events:none}
#stickZone.on #stickBase,#stickZone.on #stickKnob{opacity:.95}
body.touch #touch{display:grid}
body.touch #stickZone{display:block}

/* ---------- 5. RESPONSIVE ---------- */

 #courseHud{top:calc(154px + env(safe-area-inset-top));max-width:calc(100vw - 32px);font-size:14px}
 #stamWrap{top:calc(194px + env(safe-area-inset-top))}
 #dock{left:176px;right:12px;transform:none;width:auto;max-width:none}
 #hint{max-width:calc(100vw - 210px);left:auto;right:12px;transform:none;font-size:12px;text-align:center}
}

 #statusCard{width:calc(50vw - 18px);max-width:218px;padding:8px}
 #scTop{gap:7px}

 #scName{font-size:14px}
 #scBtns{display:none}
 #hud{flex-direction:column;align-items:flex-end;gap:6px;width:calc(50vw - 18px)}
 #wallet{gap:7px;padding:5px 7px;max-width:100%;flex-wrap:wrap;justify-content:flex-end}
 #wallet .w{font-size:13px}
 #wallet .w i{font-size:13px}
 #sysBtns button{width:32px;height:32px;font-size:14px}
 #vrBtn{top:calc(110px + env(safe-area-inset-top))!important;font-size:12px;padding:6px 11px}
 #questTrack{top:calc(110px + env(safe-area-inset-top));left:12px;transform:none;max-width:calc(100vw - 154px);font-size:12px}
 /* the dock moves to the top on a phone, clear of the joystick and the touch pad */
 #dock{top:calc(156px + env(safe-area-inset-top));bottom:auto;left:12px;right:12px;transform:none;width:auto;max-width:none;justify-content:flex-start;padding:4px}
 #dock button{height:42px;min-height:42px;padding:0 11px;font-size:12.5px}
 #hint{display:none}
 #ctx{bottom:calc(96px + env(safe-area-inset-bottom))}

 on(name,fn){(HOOKS[name]=HOOKS[name]||[]).push(fn);return fn;},

const RIDER_DEF_SHIRT='#3d4a6e', RIDER_DEF_PANTS='#cfc6ae';

function ensureCore(s){
 if(!s)return s;
 s.items=s.items||{}; s.stats=s.stats||{}; s.life=s.life||{since:Date.now()}; s.flags=s.flags||{}; s.mig=s.mig||{};
 if(!s.pid)s.pid='MR-'+rand8();

 s.inbox=s.inbox||[];

 if('breedVoucher' in s)delete s.breedVoucher;
 s.tokens=s.tokens||{key:'',n:0};
 s.doors=s.doors||{};
 if(s.tackRoom){s.doors.tackroom=s.tackRoom;delete s.tackRoom;}
 s.perks=s.perks||{}; s.mastery=s.mastery||{};
 s.wardrobe=s.wardrobe||{owned:{},worn:{}};

 if(Array.isArray(s.friends)){const o={};for(const n of s.friends)if(n)o[n]=true;s.friends=o;}else s.friends=s.friends||{};
 s.blocked=s.blocked||{};

const MAP_MARKERS=[], MINI_MARKERS=[], NET_SUBS=[];
const KEYMAP={care:'KeyI',shop:'KeyO',events:'KeyU',stable:'KeyN',quests:'KeyJ',club:'KeyK',boards:'KeyL',chat:'Enter',pet:'KeyG',whistle:'KeyH',slide:'KeyX',wild:'KeyZ',firstPerson:'KeyT',emoteBar:'KeyY',kick:'Digit6',brush:'Digit7',guitar:'Digit8',sprint:'ShiftLeft',rotFine:'Shift+R/Q'};

function keyOf(name){return KEYMAP_USER[name]||KEYMAP[name]||null;}
/* Reward kinds. payReward(s,r) pays every key of r it knows; packages add kinds. */
const REWARD_KINDS={};
function rewardKind(k,pay,label){REWARD_KINDS[k]={pay,label:label||(v=>v+' '+k)};}
rewardKind('c',(s,v)=>{s.coins+=v;s.stats=s.stats||{};s.stats.earned=(s.stats.earned||0)+v;logEarn(s,v);},v=>v+'🪙');
rewardKind('g',(s,v)=>{grantGems(s,v);},v=>v+'💎');
rewardKind('k',(s,v)=>{s.keys=(s.keys||0)+v;},v=>v+'🗝️');
rewardKind('p',(s,v)=>{s.pass=s.pass||{pts:0};s.pass.pts+=v;},v=>v+'🎟️');
rewardKind('sp',(s,v)=>{addSP(s,v,'reward');},v=>v+'⭐');
rewardKind('xp',(s,v)=>{const h=s.horses[rideIdx];if(h)applyXp(s,h,v);},v=>'+'+v+' XP');
rewardKind('sxp',(s,v)=>{const h=s.horses[rideIdx];if(h)for(const k in v)grantStatXp(s,h,k,v[k]);},v=>Object.keys(v).map(k=>'+'+v[k]+' '+k+' XP').join(' '));

function isoWeekKey(t){const d=new Date(t||Date.now());const day=(d.getUTCDay()+6)%7;return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day)).toISOString().slice(0,10);}   // Monday 00:00 UTC

const PERS={
 energetic:{emoji:'⚡',label:'Energetic',desc:'quick off the mark, and eats like a horse',ac:1.08,decay:1.15,neck:0.03},
 relaxed:{emoji:'😌',label:'Relaxed',desc:'calm and steady; frets less, loves a grooming',decay:0.88,groom:2,neck:-0.06},
 social:{emoji:'💞',label:'Social',desc:'bonds fast over petting and treats',pet:2,feed:1.5},
 alert:{emoji:'👀',label:'Alert',desc:'notices everything and turns a shade sharper',ag:1.06,neck:0.06},
 aloof:{emoji:'🌫️',label:'Aloof',desc:'slow to trust, but a bonded aloof horse runs its heart out',bondLow:0.6,spBond:1.06},

function persMul(h){const p=h&&PERS[h.pers]; if(!p)return {sp:1,ac:1,ag:1};

/* ---- seasons, the pass, and VIP ------------------------------------------------------

const SEASON_EPOCH=Date.UTC(2026,0,5);           // a Monday, so seasons turn over on Mondays
const SEASON_DAYS=28;
const SEASONS=[
 {id:'bloom',name:'Season of Bloom',emoji:'🌸',tint:'#f2a0c8',
  desc:'Blossom on the orchard, foals in the low field, and the light getting longer.'},
 {id:'sun',name:'Season of the Long Sun',emoji:'☀️',tint:'#ffd166',
  desc:'Dust on the trail, shade under the cottonwoods, and evenings that never end.'},
 {id:'ember',name:'Season of Embers',emoji:'🍂',tint:'#e07a3c',
  desc:'The woods turn, the air sharpens, and the horses come in with frost on their backs.'},
 {id:'frost',name:'Season of Frost',emoji:'❄️',tint:'#9fd8f2',

/* breed3() reads two <select>s that only exist while the flat shop is open. Rather than
   copy the genetics, hand it the elements it expects and take them away afterwards. */
function vrBreed(ia,ib){
 const mk=(id,v)=>{
  const old=document.getElementById(id);
  if(old&&old.parentNode)old.parentNode.removeChild(old);   // must be the only one, or $() finds theirs
  const e=document.createElement('input');
  e.type='hidden';e.id=id;e.value=String(v);
  document.body.appendChild(e);
  return e;
 };

 try{breed3();}
 finally{

 }
}

/* Every scrolling page shares this: build a list of row-drawing closures, then draw the
   slice that fits. Rows scrolled out are clipped away and vrButton drops their hitboxes. */
function drawVRList(c){
 const rows=[];
 let note='';
 try{
  const sv=freshSave()||{};
  if(vrPage==='shop')note=buildVRShop(rows,sv);
  else if(vrPage==='stable')note=buildVRStable(rows,sv);
  else if(vrPage==='quests')note=buildVRQuests(rows,sv);
  else if(vrPage==='events')note=buildVREvents(rows,sv);
  else if(vrPage==='pass')note=buildVRPass(rows,sv);
  else if(VR_BUILDERS[vrPage])note=VR_BUILDERS[vrPage](rows,sv)||'';
 }catch(e){
  rows.length=0;
  note='Could not read your save just now — try again in a moment.';
 }
 vrContentH=rows.length*VRM_STEP;
 const max=Math.max(0,vrContentH-vrListH);
 let sc=vrScroll[vrPage]||0;
 sc=Math.max(0,Math.min(max,sc));
 vrScroll[vrPage]=sc;

 if(!rows.length){
  c.fillStyle='#8c7a63';
  c.font='600 24px "Trebuchet MS",sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  String(note||'Nothing here yet.').split('\n')
   .forEach((ln,i)=>c.fillText(ln,VRM_W/2,vrListTop+110+i*38));
  return;
 }

 c.save();
 c.beginPath();c.rect(24,vrListTop,VRM_W-48,vrListH);c.clip();
 vrClip={y:vrListTop,h:vrListH};
 for(let i=0;i<rows.length;i++){
  const y=vrListTop-sc+i*VRM_STEP;
  if(y+VRM_ROW<vrListTop-4||y>vrListTop+vrListH+4)continue;
  rows[i](y);
 }
 vrClip=null;
 c.restore();

 if(max>0){
  const tx=998,th=Math.max(40,vrListH*vrListH/vrContentH);
  const ty=vrListTop+(vrListH-th)*(sc/max);
  vrRR(c,tx,vrListTop,8,vrListH,4);c.fillStyle='#efe3c8';c.fill();
  vrRR(c,tx,ty,8,th,4);c.fillStyle='#d9b97f';c.fill();
 }
}

function vrMenuClick(id){

 if(id==='exit'){const s=renderer.xr.getSession();if(s)s.end();return;}
 if(id.startsWith('tab:')){vrPage=id.slice(4);drawVRMenu();return;}
 if(id.startsWith('shoptab:')){vrShopTab=id.slice(8);vrScroll.shop=0;drawVRMenu();return;}
 if(id.startsWith('questtab:')){vrQuestTab=id.slice(9);vrScroll.quests=0;drawVRMenu();return;}
 if(id.startsWith('care:')){try{careAct(id.slice(5));}catch(e){}drawVRMenu();return;}
 if(id.startsWith('pass:')||id.startsWith('gpass:')){
  const gold=id.startsWith('gpass:'), i=+id.slice(gold?6:5);
  let got=null;
  syncSave(sv=>{ got=passClaim(sv,i,gold); });
  if(got){refreshWallet();sGem();
   toast(got.tint?('✨ '+seasonNow().def.name+' tack unlocked!')
    :got.tack?'✨ Golden saddle unlocked — it is in the Tack shop!'
    :('🎟️ Tier '+(i+1)+': '+passRewardLabel(got)));}
  drawVRMenu();return;
 }
 if(id==='act:ctrl'){
  vrCtrlMode=VRCTRL[(VRCTRL.indexOf(vrCtrlMode)+1)%VRCTRL.length];
  try{localStorage.setItem('mlrVRCtrl',vrCtrlMode);}catch(e){}
  reinCal=0;                               // re-learn where your hands rest for the new mode
  toast(vrCtrlMode==='reins'?'🎗️ Reins only — the thumbstick is off.'
       :vrCtrlMode==='stick'?'🕹️ Thumbstick only — the reins are just for show.'
       :'🎮 Either — reins or stick, whichever you use.');
  drawVRMenu();return;
 }
 if(id==='act:trick'){
  try{window._tkN=((window._tkN||0)+1)%3;startTrick(['roll','spin','flip'][window._tkN]);}catch(e){}
  setVRMenu(false);return;
 }
 if(id==='act:fly'){const b=$('flyBtn');if(b)b.click();setVRMenu(false);return;}
 if(id==='act:photo'){const b=$('photoBtn');if(b)b.click();return;}

 /* Everything below reuses the flat game's own handlers, then hides the DOM panels those
    handlers pop open — invisible in VR, but they would be sitting there on the way out. */

 try{
  if(p[0]==='buy'){

/* The VR button is always drawn, even where VR cannot run. Hiding it on an
   unsupported browser is technically correct and tells a first-time visitor on a
   laptop that the headset mode does not exist — which is the opposite of true, and
   VR is the part of this worth showing. So: live button where WebXR is available,
   and everywhere else a muted one that says what it needs. */
{
 const b=document.createElement('button');
 b.id='vrBtn';
 b.style.cssText='position:fixed;top:52px;right:10px;z-index:12;';
 const enable=()=>{
  b.textContent='🥽 Ride in VR';
  b.title='Ride from the saddle, holding the reins in your hands';
  b.onclick=async()=>{
   if(renderer.xr.isPresenting){renderer.xr.getSession().end();return;}
   try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','hand-tracking']});
    await renderer.xr.setSession(s);
   }catch(err){
    /* Reaching here means the browser said immersive-vr was supported and then
       refused to start one. Overwhelmingly that is an OpenXR runtime installed
       with no headset actually on — a PC with SteamVR sitting idle answers "yes"
       to isSessionSupported — so lead with that rather than the raw DOMException,
       and keep the real message on the end for anything genuinely unusual. */
    const why=(err&&err.name==='NotSupportedError')||(err&&err.name==='InvalidStateError')
     ? 'Could not start VR — is your headset connected and turned on?'
     : 'Could not start VR — is your headset connected and turned on? ('+((err&&err.message)||err)+')';
    if(typeof toast==='function')toast(why);
   }
  };
 };
 const explain=why=>{
  b.textContent='🥽 Ride in VR';   // same label either way: it advertises the mode, and the dimming says it needs a headset
  b.style.cssText+='opacity:0.55;border-style:dashed;';
  b.title=why;
  b.onclick=()=>{ if(typeof toast==='function')toast(why); };
 };
 if(!navigator.xr||!navigator.xr.isSessionSupported){
  /* No WebXR at all: every desktop Safari, and Chrome/Firefox with no runtime. */
  explain(isSecureContext
   ? 'Open this link in a VR headset — on a Quest, use its own browser — to ride holding the reins.'
   : 'VR needs a secure (https) page. Open the published link rather than a plain http one.');
 }else{
  navigator.xr.isSessionSupported('immersive-vr')
   .then(ok=>ok?enable():explain('No headset detected. Open this link in a VR headset — on a Quest, use its own browser — to ride holding the reins.'))
   .catch(()=>explain('Could not check for a headset. Open this link in a VR headset’s own browser to ride holding the reins.'));
 }
 document.body.appendChild(b);
}

function meadowBladeTexture(size,count){return canvasTex(size,size,(c,w,h)=>{
 c.clearRect(0,0,w,h);
 for(let i=0;i<count;i++){
  const x=w*(0.12+Math.random()*0.76),tall=h*(0.38+Math.random()*0.60);
  const lean=(Math.random()-0.5)*w*0.46,bw=w*(0.012+Math.random()*0.013);
  const tipX=x+lean,tipY=h-tall;
  const g=c.createLinearGradient(0,h,0,tipY);
  g.addColorStop(0,'#315b28');g.addColorStop(0.50,'#699342');
  g.addColorStop(1,i%4===0?'#bdc980':'#9ab962');
  c.fillStyle=g;c.beginPath();c.moveTo(x-bw,h);
  c.bezierCurveTo(x-bw*0.6,h-tall*0.35,tipX-lean*0.3,tipY+tall*0.22,tipX,tipY);
  c.bezierCurveTo(tipX-lean*0.13,tipY+tall*0.30,x+bw,h-tall*0.32,x+bw,h);
  c.closePath();c.fill();
 }
});}

/* Static merging. The cheap trees, the bushes and the lavender are built from many small
   meshes that never move, and every one of them was its own draw call, twice a frame once
   the shadow pass is counted. Groups registered here are baked into one mesh per material
   after the world is built, which turns a few hundred draw calls into a dozen. */
const STATIC_MERGE=[];
function mergeStatics(){
 const byMat=new Map(); let meshes=0;
 for(const g of STATIC_MERGE){
  g.updateMatrixWorld(true);
  g.traverse(o=>{
   if(!o.isMesh||o.isSkinnedMesh||o.isInstancedMesh||Array.isArray(o.material))return;
   const geo=o.geometry; if(!geo.index||!geo.attributes.normal||!geo.attributes.uv)return;
   const c=geo.clone().applyMatrix4(o.matrixWorld);
   for(const k of Object.keys(c.attributes))if(k!=='position'&&k!=='normal'&&k!=='uv'&&!(k==='color'&&o.material.vertexColors))c.deleteAttribute(k);
   const e=byMat.get(o.material)||{list:[],cast:false,recv:false};
   e.list.push(c); e.cast=e.cast||o.castShadow; e.recv=e.recv||o.receiveShadow; byMat.set(o.material,e); meshes++;
  });
 }
 let draws=0;
 for(const [mat,e] of byMat){
  const merged=mergeGeometries(e.list,false); e.list.forEach(c=>c.dispose()); if(!merged)continue;
  const m=new THREE.Mesh(merged,mat); m.name='static_merged'; m.castShadow=e.cast; m.receiveShadow=e.recv; scene.add(m); draws++;
 }
 for(const g of STATIC_MERGE)if(g.parent)g.parent.remove(g);
 STATIC_MERGE.length=0;
 return {meshes,draws};
}

function loftZ(prof,segs,mat){

 for(let i=0;i<R;i++){
  const p=prof[i];

   const th=j/segs*Math.PI*2;
   pos.push(Math.cos(th)*p.rx,p.cy+Math.sin(th)*p.ry,p.z);
   uv.push(i/(R-1),0.5-Math.sin(th)*0.5);
  }
 }
 for(let i=0;i<R-1;i++)for(let j=0;j<segs;j++){
  const a=i*(segs+1)+j,b=a+segs+1;
  idx.push(a,b,a+1,b,b+1,a+1);
 }
 const c0=pos.length/3;
 pos.push(0,prof[0].cy,prof[0].z);uv.push(0,0.5);
 for(let j=0;j<segs;j++)idx.push(c0,j+1,j);
 const c1=pos.length/3;
 const base=(R-1)*(segs+1);
 pos.push(0,prof[R-1].cy,prof[R-1].z);uv.push(1,0.5);
 for(let j=0;j<segs;j++)idx.push(c1,base+j,base+j+1);
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

 /* ===== Dawn mist, and dust in the light =====
    Two cheap things that do more for a landscape than any amount of geometry. Mist gathers
    in the low ground at dawn and dusk and burns off by mid-morning, so the same valley reads
    differently depending on when you ride out; and when the sun is low, motes drift through
    the air in front of you and light up when you look toward it, which is what a shaft of
    light through trees actually looks like from inside it. Both ride a window around the
    rider, like the grass does. */
 {
  /* A card of mist has to have no edges at all, or it reads as a grey rectangle standing in
     the field — which is exactly what the first version did. Soft lumps, then everything
     rubbed away toward the rim. */
  const softTex=canvasTex(256,128,(c,w,h)=>{
   c.clearRect(0,0,w,h);
   for(let i=0;i<34;i++){
    const cx=20+Math.random()*(w-40), cy=h*0.55+(Math.random()-0.5)*h*0.5;
    const rr=16+Math.random()*36;
    const g2=c.createRadialGradient(cx,cy,0,cx,cy,rr);
    g2.addColorStop(0,'rgba(255,255,255,0.30)'); g2.addColorStop(0.55,'rgba(255,255,255,0.13)');
    g2.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g2; c.beginPath(); c.arc(cx,cy,rr,0,7); c.fill();
   }
   c.globalCompositeOperation='destination-out';         // rub it away toward every edge
   const em=c.createRadialGradient(w/2,h/2,h*0.18,w/2,h/2,w*0.52);
   em.addColorStop(0,'rgba(0,0,0,0)'); em.addColorStop(0.62,'rgba(0,0,0,0.25)'); em.addColorStop(1,'rgba(0,0,0,1)');
   c.save(); c.translate(w/2,h/2); c.scale(1,h/w*2.0); c.translate(-w/2,-h/2);
   c.fillStyle=em; c.fillRect(-w,-h,w*3,h*3); c.restore();
   const fl=c.createLinearGradient(0,0,0,h);              // and thin at the top, where mist ends
   fl.addColorStop(0,'rgba(0,0,0,0.9)'); fl.addColorStop(0.4,'rgba(0,0,0,0)'); fl.addColorStop(1,'rgba(0,0,0,0.2)');
   c.fillStyle=fl; c.fillRect(0,0,w,h);
   c.globalCompositeOperation='source-over';
  });

 galaxy:{ramp:['#0a0818','#3a2a72','#caa8ff'], glow:0.8,  rough:0.78},

    burns around the silhouette. Shadow is violet all over; this is only lit at its edge. */
 eclipse:{ramp:['#040308','#0f0b16','#c98a2a'], glow:0.75, rough:0.80},

    across it — the grey mare the mountain calls the Silver Kestrel. */

};

 fire:`float em=_hash(floor(vMapUv*vec2(44.0,30.0))+floor(uTime*4.0)*7.0);
   em=smoothstep(0.78,1.0,em)*smoothstep(0.35,1.0,_l);

 galaxy:`float st=step(0.991,_hash(floor(vMapUv*170.0)))*(0.5+0.5*sin(uTime*3.0+vMapUv.x*60.0));

   _ramp+=vec3(1.0)*st*1.6;

 ice:`float gl=step(0.99,_hash(floor(vMapUv*150.0)))*(0.5+0.5*sin(uTime*4.0+_l*30.0));

   _ramp+=vec3(0.5,0.3,0.95)*_fres*0.8;

 moonlit:`float _sn=step(0.986,_hash(floor(vMapUv*vec2(120.0,80.0))+floor(uTime*1.5)*3.0))*(0.5+0.5*sin(uTime*2.5+vMapUv.y*40.0));

function fantasyCoatRig(type,scaly){

 m.onBeforeCompile=sh=>{
  sh.uniforms.uC0={value:C0};sh.uniforms.uC1={value:C1};sh.uniforms.uC2={value:C2};
  sh.uniforms.uGlow={value:cfg.glow};sh.uniforms.uTime={value:0};

    `#include <map_fragment>

     vec3 _ramp = _l<0.5 ? mix(uC0,uC1,_l*2.0) : mix(uC1,uC2,(_l-0.5)*2.0);
     float _fres = pow(1.0-abs(dot(normalize(vNormal),normalize(vViewPosition))),2.5);
     vec3 _emis = _ramp*uGlow*(0.14+_l);

     ${scaly?`
     /* Overlapping plates, rows offset by half a scale, dark in the seams and catching a
        highlight along the top edge of each one. This is most of what separates a dragon
        from a horse painted an odd colour. */
     {vec2 _s=vMapUv*vec2(52.0,34.0); float _row=floor(_s.y); _s.x+=mod(_row,2.0)*0.5;

      float _lip=1.0-smoothstep(0.0,0.30,length(vec2(_f.x,(_f.y+0.20)*1.5)));

      diffuseColor.rgb+=_lip*0.16*(0.4+_l);
      _emis*=mix(1.1,0.55,_seam);}`:''}`)

    `#include <emissivemap_fragment>
     totalEmissiveRadiance=_emis;`);

}

 galaxy:{web:'#a678ff',root:'#241a52',bone:'#1a1230',glow:'#c6a8ff',head:'#3a2a72',ridge:'#c6a8ff'},
 shadow:{web:'#6a4ad0',root:'#140e26',bone:'#0e0a18',glow:'#8a5ae0',head:'#241a3e',ridge:'#8a5ae0'},
 aurora:{web:'#4fd8b0',root:'#0e3a2e',bone:'#0c2a22',glow:'#9cffd8',head:'#1f7a62',ridge:'#9cffd8'},
 _:     {web:'#9fb4d8',root:'#2b3546',bone:'#222836',glow:'#cfe0ff',head:'#5a6478',ridge:'#cfe0ff'},
};

 mt[0].color.set('#ffffff'); mt[0].emissive.set(th.glow); mt[0].emissiveIntensity=0.10;

const WING_TINT={
 fire:  {a:'#ffc24a',b:'#c2330c',e:'#ff5a1e',ei:0.42},
 galaxy:{a:'#c4a6ff',b:'#3a2780',e:'#7a4ad8',ei:0.40},
 shadow:{a:'#5a4488',b:'#140c26',e:'#6a3ad0',ei:0.30},   // darker/smokier so wings don't outshine the shadow body
 ice:   {a:'#cdeeff',b:'#4fb0dc',e:'#7fd8f5',ei:0.45},
 aurora:{a:'#7dffc0',b:'#2a8fc8',e:'#3ce0a0',ei:0.48},

function tintWingMats(piv,type){   // tint one wing's two feather materials to a mythic theme

function tintWings(type){   // player's rigged mount

function spawnCritter(key,hx,hz,hr){
 const p=makeCritter(key);
 scene.add(p.group);
 const a=Math.random()*Math.PI*2,rr=Math.random()*hr;
 const c={p,key,def:p.def,home:{x:hx,z:hz,r:hr},
  x:hx+Math.cos(a)*rr,z:hz+Math.sin(a)*rr,y:0,heading:Math.random()*6.3,
  mode:'idle',timer:1+Math.random()*4,tx:0,tz:0,phase:Math.random()*9,
  blink:2+Math.random()*4,fly:null,speed:0};
 if(p.def.gait==='float')c.z=riverZ(c.x)+(Math.random()-0.5)*3;  // ducks start on the water
 critters.push(c);
}
function updateCritters(dt,t){
 for(const c of critters){
  const D=c.def,P=c.p;
  // day/night: most wildlife sleeps at night; deer stay out through dusk
  const awake=D.dusky?nightNow<0.85:nightNow<0.55;
  P.group.visible=awake;
  if(!awake)continue;
  const pd=Math.hypot(player.pos.x-c.x,player.pos.z-c.z);
  /* -------- behaviour states -------- */
  if(D.fleeR&&c.mode!=='flee'&&pd<D.fleeR&&Math.abs(player.speed)>3){
   c.mode='flee';c.timer=2.2+Math.random();
  }
  c.timer-=dt;
  if(c.mode==='flee'){
   const away=Math.atan2(c.x-player.pos.x,c.z-player.pos.z);
   c.heading+=(THREE.MathUtils.euclideanModulo(away-c.heading+Math.PI,Math.PI*2)-Math.PI)*Math.min(1,dt*6);
   c.speed=D.fleeSpeed||D.speed*2.4;
   if(c.timer<=0){c.mode='idle';c.timer=1+Math.random()*2;}
  }else if(c.mode==='wander'){
   const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz);
   if(d<0.5||c.timer<=0){c.mode=Math.random()<0.55?'graze':'idle';c.timer=2.5+Math.random()*5;c.speed=0;}
   else{
    const want=Math.atan2(dx,dz);
    c.heading+=(THREE.MathUtils.euclideanModulo(want-c.heading+Math.PI,Math.PI*2)-Math.PI)*Math.min(1,dt*3);
    c.speed=D.speed;
   }
  }else{ // idle / graze
   c.speed=0;
   if(c.timer<=0){
    c.mode='wander';c.timer=8+Math.random()*6;
    const hd=Math.hypot(c.x-c.home.x,c.z-c.home.z);
    if(hd>c.home.r){c.tx=c.home.x;c.tz=c.home.z;}                 // drift back home
    else{const a=Math.random()*Math.PI*2,rr=2+Math.random()*c.home.r;
     c.tx=c.home.x+Math.cos(a)*rr;c.tz=c.home.z+Math.sin(a)*rr;}
   }
  }
  /* -------- locomotion & gait -------- */
  if(D.gait==='float'){                       // ducks paddle the river
   c.heading+=Math.sin(t*0.23+c.phase)*dt*0.5;
   c.x+=Math.sin(c.heading)*D.speed*dt;
   c.x=THREE.MathUtils.clamp(c.x,c.home.x-c.home.r,c.home.x+c.home.r);
   const zc=riverZ(c.x);
   c.z+=(zc+(Math.sin(c.phase)*2)-c.z)*Math.min(1,dt*1.1);
   c.y=rawH(c.x,zc)+0.55+Math.sin(t*1.3+c.phase)*0.02;
   P.group.rotation.z=Math.sin(t*1.1+c.phase)*0.05;
  }else if(D.gait==='fly'){                   // bluebirds hop between perch spots
   if(!c.fly&&c.mode==='wander'){
    c.fly={fx:c.x,fz:c.z,fy:groundH(c.x,c.z),t:0,
     dur:Math.max(1.2,Math.hypot(c.tx-c.x,c.tz-c.z)/D.speed)};
   }
   if(c.fly){
    c.fly.t+=dt;
    const p01=Math.min(1,c.fly.t/c.fly.dur);
    c.x=THREE.MathUtils.lerp(c.fly.fx,c.tx,p01);
    c.z=THREE.MathUtils.lerp(c.fly.fz,c.tz,p01);
    const gy=groundH(c.x,c.z);
    c.y=THREE.MathUtils.lerp(c.fly.fy,gy,p01)+Math.sin(Math.PI*p01)*3.2-gy;
    c.heading=Math.atan2(c.tx-c.fly.fx,c.tz-c.fly.fz);
    if(p01>=1){c.fly=null;c.mode='graze';c.timer=2.5+Math.random()*4;}
   }else c.y=0;
   const flap=c.fly?Math.sin(t*26+c.phase)*0.85:0.12+Math.sin(t*2+c.phase)*0.04;
   if(P.wings.length){P.wings[0].rotation.z=-flap;P.wings[1].rotation.z=flap;}
  }else{                                      // ground gaits share the mover
   c.x+=Math.sin(c.heading)*c.speed*dt;
   c.z+=Math.cos(c.heading)*c.speed*dt;
   c.y=0;
  }
  c.phase+=dt*(2.4+c.speed*2.6);
  const moving=c.speed>0.05;
  if(D.gait==='walk4'&&P.legs.length===4){
   for(let i=0;i<4;i++)P.legs[i].rotation.x=moving?Math.sin(c.phase+(i===0||i===3?0:Math.PI))*0.55:0;
   P.body.position.y=moving?Math.abs(Math.sin(c.phase*2))*0.02:0;
  }else if(D.gait==='walk2'&&P.legs.length===2){
   P.legs[0].rotation.x=moving?Math.sin(c.phase)*0.7:0;
   P.legs[1].rotation.x=moving?-Math.sin(c.phase)*0.7:0;
   P.body.rotation.z=moving?Math.sin(c.phase)*0.07:0;
   P.body.position.z=moving?Math.abs(Math.sin(c.phase))*0.02:0;
  }else if(D.gait==='hop'){
   const h=moving?Math.max(0,Math.sin(c.phase*1.6)):0;
   c.y+=h*0.22;
   P.body.scale.y=1-(moving?Math.max(0,Math.sin(c.phase*1.6+Math.PI))*0.12:0);
   for(const lg of P.legs)lg.rotation.x=moving?-h*0.9:0;
  }
  /* -------- shared juice: graze lean, blinking, tail wag -------- */
  const leanT=(c.mode==='graze'&&!moving)?(D.gait==='walk2'?0.5+Math.sin(t*7+c.phase)*0.12:0.34+Math.sin(t*1.4+c.phase)*0.04):0;
  P.body.rotation.x+=(leanT-P.body.rotation.x)*Math.min(1,dt*5);
  c.blink-=dt;
  if(c.blink<-0.13)c.blink=2.5+Math.random()*4;
  const es=c.blink<0?0.12:1;
  for(const e of P.eyes)e.scale.y=P.def.eyeR*es;
  if(P.tail)P.tail.rotation.y=Math.sin(t*(moving?9:2.2)+c.phase)*(moving?0.5:0.15);
  P.group.position.set(c.x,(D.gait==='float'?c.y:groundH(c.x,c.z)+c.y),c.z);
  P.group.rotation.y=c.heading;
 }
}

/* ================= golden horseshoe hunt — 10 fresh hiding spots every day ================= */
const SHOE_N=10;
const shoes=[];
{
 const ds=new Date().toDateString();
 let hh=0;for(let i=0;i<ds.length;i++)hh=(hh*31+ds.charCodeAt(i))|0;
 let kk=Math.abs(hh)||1;
 const rnd=()=>((kk=(kk*1103515245+12345)%2147483647)/2147483647);
 const shoeGeo=new THREE.TorusGeometry(0.34,0.095,8,18,Math.PI*1.4);
 const shoeMat=new THREE.MeshStandardMaterial({color:0xffd166,roughness:0.22,metalness:0.85,emissive:0xa87818,emissiveIntensity:0.6});
 for(let i=0;i<SHOE_N;i++){
  let x=0,z=0,tries=0;
  do{x=(rnd()-0.5)*480;z=(rnd()-0.5)*480;tries++;}
  while(tries<40&&((Math.abs(x)<30&&Math.abs(z)<26)||Math.abs(z-riverZ(x))<8));
  const m=new THREE.Mesh(shoeGeo,shoeMat);
  m.castShadow=true;
  m.rotation.z=Math.PI*0.8;                    // opening down, like a lucky horseshoe
  m.position.set(x,groundH(x,z)+0.8,z);
  scene.add(m);
  shoes.push({m,x,z,got:false,ph:rnd()*9});
 }
 try{                                          // restore today's finds
  const sv=freshSave();
  if(sv&&sv.shoes&&sv.shoes.date===ds)sv.shoes.got.forEach(i=>{if(shoes[i]){shoes[i].got=true;shoes[i].m.visible=false;}});
 }catch(e){}
}
function updateShoes(dt,t){
 for(let i=0;i<shoes.length;i++){
  const sh=shoes[i];
  if(sh.got)continue;
  sh.m.rotation.y=t*1.5+sh.ph;
  sh.m.position.y=groundH(sh.x,sh.z)+0.8+Math.sin(t*2+sh.ph)*0.12;
  if(Math.hypot(player.pos.x-sh.x,player.pos.z-sh.z)<2.5){
   sh.got=true;sh.m.visible=false;
   let all=false;
   syncSave(s=>{
    const ds=new Date().toDateString();
    if(!s.shoes||s.shoes.date!==ds)s.shoes={date:ds,got:[]};
    if(!s.shoes.got.includes(i))s.shoes.got.push(i);
    s.coins+=80;
    s.stats=s.stats||{};
    s.stats.shoesFound=(s.stats.shoesFound||0)+1;
    if(s.shoes.got.length>=SHOE_N){grantGems(s,6);all=true;}
   });
   refreshWallet();sCoin();
   addXp3D(15); passAdd(4);                       // a horseshoe is worth coins AND horse XP
   const left=shoes.filter(q=>!q.got).length;
   toast(all?'🥇 ALL '+SHOE_N+' golden horseshoes found today! +80🪙 +15 XP +6💎':'🍀 Golden horseshoe! +80🪙 +15 XP — '+left+' more hidden somewhere today…');
   dailyEvt('shoe',1);
  }
 }
}
window._shoes=shoes;   // diagnostics

/* ================= mythic stardust trail — fantasy coats sparkle at speed ================= */
const TRAIL_N=70;
const TRAIL_COL={galaxy:0x9a6cff,fire:0xff7a2e,ice:0x9fe0ff,aurora:0x5affc8,shadow:0xb08cff};
const trailMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false});
const trail=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,5),trailMat,TRAIL_N);
trail.frustumCulled=false;trail.visible=false;
scene.add(trail);
const trailP=[];
for(let i=0;i<TRAIL_N;i++)trailP.push({life:0,x:0,y:-50,z:0,vy:0});
let trailIdx=0,trailAcc=0;
function updateTrail(dt){
 const h=myHorses[rideIdx];
 const active=!!(h&&(h.coat||h.trail)&&(Math.abs(player.speed)>7||player.flying));
 if(active){
  trailMat.color.set(h.coat?(TRAIL_COL[h.coat]||0xffffff):h.trail);
  trailAcc+=dt*26;
  while(trailAcc>1){
   trailAcc-=1;
   const p=trailP[trailIdx=(trailIdx+1)%TRAIL_N];
   p.life=0.8;
   p.x=player.pos.x-Math.sin(player.heading)*1.3+(Math.random()-0.5)*0.55;
   p.z=player.pos.z-Math.cos(player.heading)*1.3+(Math.random()-0.5)*0.55;
   p.y=groundH(player.pos.x,player.pos.z)+player.y+0.55+Math.random()*0.85;
   p.vy=0.4+Math.random()*0.9;
  }
 }
 let any=false;
 for(let i=0;i<TRAIL_N;i++){
  const p=trailP[i];
  if(p.life>0){
   p.life-=dt;p.y+=p.vy*dt;any=true;
   _ffV.set(p.x,p.y,p.z);_ffS.setScalar(Math.max(0.001,p.life)*1.5);
  }else{_ffV.set(0,-50,0);_ffS.setScalar(0.0001);}
  _ffM4.compose(_ffV,_ffQ,_ffS);
  trail.setMatrixAt(i,_ffM4);
 }
 trail.visible=any;
 if(any)trail.instanceMatrix.needsUpdate=true;
}

/* ===== Pegasus wing =====
   A bird's wing rather than a fan of blades. Three segments that fold — arm, forearm and
   hand — carry the feathers in the rows a real wing wears: primaries on the hand,
   secondaries on the forearm, tertials at the body, three rows of coverts lapping over
   their roots, and an alula at the wrist. Every feather is one instance of a single
   cambered, alpha-cut card, so a whole wing costs four draw calls however many feathers it
   wears, and each feather's place is recomputed from the joints every frame. That is what
   lets the wing fold along the barrel at a halt, half-open at a gallop, and beat with a
   real downstroke — quick down, slower recovery, the primaries trailing behind the hand. */

function enableTouchUI(){ document.body.classList.add('touch'); }

/* Belt and braces: the media query is wrong often enough to matter — some tablets
   and hybrid laptops report a fine pointer — and since the on-screen stick is now
   the ONLY way to steer without a keyboard, guessing wrong would leave a player

addEventListener('touchstart',enableTouchUI,{once:true,passive:true});

/* A floating analog stick. Steering a horse with separate left/right buttons is
   all-or-nothing, which is why turning felt like a light switch on a phone — the
   game already carries analog turn and throttle for VR, so the stick simply feeds
   the same two values and the flat game reads them the same way.

   Floating, not fixed: the stick centres itself wherever the thumb first lands
   anywhere in the lower-left, so it never has to be looked at or aimed for. */
{
 const zone=$('stickZone'),base=$('stickBase'),knob=$('stickKnob');
 const R=58, DEAD=0.14;
 let id=null,cx=0,cy=0;
 const place=(el,x,y)=>{el.style.left=x+'px';el.style.top=y+'px';};
 const release=()=>{
  id=null;zone.classList.remove('on');
  touch.turnA=0;touch.goA=0;touch.analog=false;
  touch.go=touch.left=touch.right=false;
 };
 if(zone){
  zone.addEventListener('pointerdown',e=>{
   if(id!==null)return;
   e.preventDefault();
   id=e.pointerId;
   try{zone.setPointerCapture(id);}catch(err){}   // capture is an optimisation, not a requirement
   const r=zone.getBoundingClientRect();
   cx=e.clientX-r.left;cy=e.clientY-r.top;
   place(base,cx,cy);place(knob,cx,cy);
   zone.classList.add('on');
   touch.analog=true;
  });
  zone.addEventListener('pointermove',e=>{
   if(e.pointerId!==id)return;
   e.preventDefault();
   const r=zone.getBoundingClientRect();
   let dx=(e.clientX-r.left)-cx, dy=(e.clientY-r.top)-cy;
   const d=Math.hypot(dx,dy);
   if(d>R){dx*=R/d;dy*=R/d;}
   place(knob,cx+dx,cy+dy);
   let nx=dx/R, ny=dy/R;
   const mag=Math.hypot(nx,ny);
   if(mag<DEAD){nx=ny=0;}
   else{ const k=((mag-DEAD)/(1-DEAD))/mag; nx*=k;ny*=k; }
   // squared curve on yaw: fine control near centre, full lock only at the rim
   touch.turnA=-Math.sign(nx)*nx*nx;
   touch.goA=Math.max(0,-ny);            // push up to go; pulling back does not reverse
   touch.go=touch.goA>0.06;
   touch.left=touch.turnA>0.06;
   touch.right=touch.turnA<-0.06;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
   zone.addEventListener(ev,e=>{ if(e.pointerId===id)release(); }));
 }
}

/* Camera drag tracks ONE pointer id. Without that, a second finger arriving —
   which on a phone is the normal case, thumb on the stick and thumb on the view —
   kept overwriting the drag origin and the camera lurched every time either
   finger moved. The stick lives in its own element and captures its own pointer,
   so it never reaches this handler at all. */
renderer.domElement.addEventListener('pointerdown',e=>{
 if(camDrag)return;                       // already dragging with another finger
 camDrag={id:e.pointerId,x:e.clientX,y:e.clientY};
});
addEventListener('pointermove',e=>{
 if(!camDrag||e.pointerId!==camDrag.id)return;
 if(freeCam){freeCam.yaw-=(e.clientX-camDrag.x)*0.004;freeCam.pitch=THREE.MathUtils.clamp(freeCam.pitch-(e.clientY-camDrag.y)*0.004,-1.4,1.4);camDrag.x=e.clientX;camDrag.y=e.clientY;return;}
 camYaw-=(e.clientX-camDrag.x)*0.006;
 camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-camDrag.y)*0.004,0.06,1.0);
 camDrag.x=e.clientX;camDrag.y=e.clientY;
});
const endDrag=e=>{ if(camDrag&&(!e||e.pointerId===camDrag.id))camDrag=null; };
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);

   on the club board beside the other milestones and reset on Monday like everything else. */

/* ===== The Runaway Roundup ==================================================
   Star Equestrian runs a bronco bounty: loose horses out on the range, and you bring them
   in. This is that, in our pasture, and it is the first thing in the game where riding
   POSITION is the skill rather than riding fast — a loose horse runs from whatever is
   nearest, so you have to get on the far side of one and push it toward the gate. Charging
   straight at it just sends it further out.

   Five horses, two and a half minutes, and a pen at the east end. */
const ROUND_N=5, ROUND_TIME=150, ROUND_COOL=1800000;      // half an hour between roundups
const ROUND_PEN={x:-44,z:-8,r:7.5};
const ROUND={on:false,t:0,horses:[],penned:0,grp:null,ring:null};
function roundupReady(s){ return !s||!s.roundAt||Date.now()-s.roundAt>ROUND_COOL; }
function roundupWaitMin(s){ return Math.max(0,Math.ceil((ROUND_COOL-(Date.now()-(s.roundAt||0)))/60000)); }
function buildPen(){
 if(ROUND.grp)return ROUND.grp;
 const g=new THREE.Group();
 const R=ROUND_PEN.r;
 /* posts round three quarters of a circle, with the mouth facing back into the field */
 for(let k=0;k<16;k++){
  const a=-Math.PI*0.62+ (k/15)*Math.PI*1.72;
  const x=Math.cos(a)*R, z=Math.sin(a)*R;
  box(0.18,1.25,0.18,'#c9b083',x,0.62,z,g);
  if(k){const px=Math.cos(-Math.PI*0.62+((k-1)/15)*Math.PI*1.72)*R, pz=Math.sin(-Math.PI*0.62+((k-1)/15)*Math.PI*1.72)*R;
   const mx=(x+px)/2, mz=(z+pz)/2, len=Math.hypot(x-px,z-pz);
   const rail=box(len,0.10,0.07,'#e2d3ae',mx,0.95,mz,g); rail.rotation.y=Math.atan2(x-px,z-pz)+Math.PI/2;}
 }
 const ring=new THREE.Mesh(new THREE.CircleGeometry(R,30),
  new THREE.MeshBasicMaterial({color:0x8fd070,transparent:true,opacity:0.20,depthWrite:false}));
 ring.rotation.x=-Math.PI/2; ring.position.y=0.05; g.add(ring);
 const sp=nameSprite('🚩 The pen'); sp.position.y=2.4; g.add(sp);
 g.position.set(ROUND_PEN.x,groundH(ROUND_PEN.x,ROUND_PEN.z),ROUND_PEN.z);
 g.visible=false; scene.add(g);
 ROUND.grp=g; ROUND.ring=ring;
 return g;
}
function startRoundup(){
 if(ROUND.on)return;
 const s=freshSave();
 if(!roundupReady(s)){toast('🐎 The next roundup is in about '+roundupWaitMin(s)+' minutes.');return;}
 buildPen(); ROUND.grp.visible=true;
 ROUND.horses=[];
 for(let i=0;i<ROUND_N;i++){
  const wb=WILD_BREEDS[Math.floor(Math.random()*WILD_BREEDS.length)];
  const parts=makeHorse({colors:{body:wb.body,mane:wb.mane},seed:Math.floor(Math.random()*9)});
  const tag=nameSprite('🐴 runaway'); tag.position.y=2.7; parts.group.add(tag);
  /* scattered across the west of the pasture, well away from the pen */
  const x=PAST.x1+8+Math.random()*(ROUND_PEN.x-PAST.x1-22);
  const z=PAST.z1+8+Math.random()*(PAST.z2-PAST.z1-16);
  parts.group.position.set(x,groundH(x,z),z);
  scene.add(parts.group);
  ROUND.horses.push({parts,wb,pos:new THREE.Vector3(x,0,z),heading:Math.random()*6,phase:Math.random()*6,
                     penned:false,rest:Math.random()*2});
 }
 ROUND.on=true; ROUND.t=ROUND_TIME; ROUND.penned=0;
 $('roundHud').style.display='block';
 sNeigh();
 toast('🐎 Five runaways in the pasture! Get BEHIND one and push it to the 🚩 pen.');
}
function endRoundup(quit){
 if(!ROUND.on)return;
 const got=ROUND.penned;
 for(const h of ROUND.horses){ try{scene.remove(h.parts.group);}catch(e){} }
 ROUND.horses=[]; ROUND.on=false;
 if(ROUND.grp)ROUND.grp.visible=false;
 $('roundHud').style.display='none';
 if(quit){toast('🐎 Roundup abandoned.');return;}
 const coins=got*130, bonus=(got===ROUND_N);
 syncSave(sv=>{
  sv.roundAt=Date.now();
  sv.coins+=coins+(bonus?250:0);
  if(bonus){sv.gems=(sv.gems||0)+2; sv.keys=(sv.keys||0)+1;}
  sv.stats=sv.stats||{}; sv.stats.rounded=(sv.stats.rounded||0)+got;
  logEarn(sv,coins+(bonus?250:0));
  addSP(sv,got*4,'roundup');
 });
 refreshWallet(); passAdd(got*6); weekBump('events',1);
 if(got)sChime();
 toast(bonus?('🐎 ALL FIVE IN! +'+(coins+250)+'🪙 +2💎 +1🗝️')
            :('🐎 '+got+' of '+ROUND_N+' penned · +'+coins+'🪙'));

function tickRoundup(dt,t){
 if(!ROUND.on)return;
 ROUND.t-=dt;
 const px=player.pos.x, pz=player.pos.z;
 for(const h of ROUND.horses){
  if(h.penned)continue;
  const dx=h.pos.x-px, dz=h.pos.z-pz, d=Math.hypot(dx,dz);
  if(d<15){
   /* it runs from whoever is nearest — which is what makes position the game */
   const away=Math.atan2(dx,dz);
   let dh=away-h.heading;
   while(dh>Math.PI)dh-=Math.PI*2; while(dh<-Math.PI)dh+=Math.PI*2;
   h.heading+=dh*Math.min(1,dt*3.2);
   const spd=d<7?7.2:5.4;
   h.pos.x+=Math.sin(h.heading)*spd*dt;
   h.pos.z+=Math.cos(h.heading)*spd*dt;
   h.phase+=dt*8; h.rest=0.6;
  }else{
   h.rest-=dt;
   if(h.rest<=0){ h.heading+=(Math.random()-0.5)*0.9; h.rest=1.5+Math.random()*2.5; }
   h.pos.x+=Math.sin(h.heading)*1.0*dt;
   h.pos.z+=Math.cos(h.heading)*1.0*dt;
   h.phase+=dt*1.6;
  }
  /* keep them in the field */
  h.pos.x=Math.max(PAST.x1+2,Math.min(PAST.x2-2,h.pos.x));
  h.pos.z=Math.max(PAST.z1+2,Math.min(PAST.z2-2,h.pos.z));
  h.parts.group.position.set(h.pos.x,groundH(h.pos.x,h.pos.z),h.pos.z);
  h.parts.group.rotation.y=h.heading;
  animateHorse(h.parts,h.phase,d<15?0.9:0.25,d<15?GAITS.gallop:GAITS.walk,true,t,0);
  dressWithRig(h,h.parts,{body:h.wb.body,mane:h.wb.mane},{breed:h.wb.breed});tickRig(h,d<15?7.5:1,dt,t,0);
  if(Math.hypot(h.pos.x-ROUND_PEN.x,h.pos.z-ROUND_PEN.z)<ROUND_PEN.r){
   h.penned=true; ROUND.penned++;
   try{scene.remove(h.parts.group);}catch(e){}
   sChime();
   toast('🚩 In the pen — '+ROUND.penned+' of '+ROUND_N+'!');
  }
 }
 const hud=$('roundHud');
 if(hud)hud.textContent='🐎 Roundup · '+ROUND.penned+'/'+ROUND_N+' penned · '+Math.max(0,Math.ceil(ROUND.t))+'s';
 if(ROUND.ring)ROUND.ring.material.opacity=0.16+0.10*Math.sin(t*3);

}

/* ===== Panels, dock buttons and renderer registries (G.ui) ===========================
   A feature package never edits a renderer. It registers: a whole panel (uiPanel), a tab on
   an existing panel (shopTab/questTab/lbTab/buildTab), a section spliced into an existing
   renderer (careSection & co.), and named actions bound through data-fx="name:arg:arg".
   The contract is written out in assets/features/index.js. */
let PANEL_IDS=['eventsPanel','carePanel','shopPanel','onlinePanel','lbPanel','moneyPanel','summonPanel','stablePanel','questPanel','profilePanel','buildPanel'];
const PANEL_DEFS={}, PANEL_HOTKEYS={}, UI_ACTIONS={}, UI_SECTIONS={};
const EXTRA_SHOP_TABS=[], EXTRA_QUEST_TABS=[], EXTRA_LB_TABS=[], EXTRA_BUILD_TABS=[];
let buildTab='pieces';
function hidePanels(){for(const id of PANEL_IDS){const p=$(id);if(p)p.style.display='none';}}
function uiSection(name,fn){(UI_SECTIONS[name]=UI_SECTIONS[name]||[]).push(fn);return fn;}
function sect(name,...args){const a=UI_SECTIONS[name];if(!a||!a.length)return '';let o='';for(const f of a){try{o+=f(...args)||'';}catch(e){console.error('section '+name,e);}}return o;}
function uiAction(name,fn){UI_ACTIONS[name]=fn;return fn;}
function uiDispatch(cmd,el){const parts=String(cmd||'').split(':');const fn=UI_ACTIONS[parts[0]];if(!fn)return false;try{fn(parts.slice(1),el,cmd);}catch(e){console.error('action '+cmd,e);}return true;}
function bindFx(p){if(!p)return;p.querySelectorAll('[data-fx]').forEach(b=>{b.onclick=()=>uiDispatch(b.dataset.fx,b);});p.querySelectorAll('[data-fxin]').forEach(el=>{el.onchange=()=>uiDispatch(el.dataset.fxin,el);});}
function addTab(list,def){const i=list.findIndex(t=>t.id===def.id);if(i>=0)list[i]=def;else if(typeof def.pos==='number')list.splice(Math.max(0,Math.min(list.length,def.pos)),0,def);else list.push(def);return def;}
function mergeTabs(base,extra){const out=base.map(b=>({id:b[0],label:b[1]}));for(const t of extra){const row={id:t.id,label:t.label||t.id};const i=out.findIndex(b=>b.id===t.id);if(i>=0)out[i]=row;else if(typeof t.pos==='number')out.splice(Math.max(0,Math.min(out.length,t.pos)),0,row);else out.push(row);}return out;}
function uiPanel(def){
 const id=def.id; if(!id)throw Error('panel needs an id');
 let p=$(id);
 if(!p){p=document.createElement('div');p.id=id;p.className='fpanel';document.body.appendChild(p);}
 if(!PANEL_IDS.includes(id))PANEL_IDS.push(id);
 PANEL_DEFS[id]=def;
 const bd=def.dock||(typeof def.sys==='object'?def.sys:null);
 if(bd){
  const btnId=bd.id||id.replace(/Panel$/,'')+'Btn';
  let btn=$(btnId);
  if(!btn){
   btn=document.createElement('button');btn.id=btnId;
   if(def.sys){btn.className='ico';$('sysBtns').appendChild(btn);}
   else{const after=bd.after&&$(bd.after);if(after&&after.parentNode===$('dock'))after.after(btn);else $('dock').appendChild(btn);}
  }
  btn.textContent=bd.label||def.title||id; if(bd.title)btn.title=bd.title;
  btn.onclick=()=>uiToggle(id);
  def.btnId=btnId;
 }
 if(def.hotkey)PANEL_HOTKEYS[def.hotkey]=()=>uiToggle(id);
 if(def.vr){const tab=def.vr.tab||id.replace(/Panel$/,'');if(!TABS.some(t=>t[0]===tab))TABS.push([tab,def.vr.label||def.title||tab]);if(def.vr.build)VR_BUILDERS[tab]=def.vr.build;}
 if(def.dock&&typeof def.dock.pip==='function'&&def.btnId){let n=0;try{n=def.dock.pip()||0;}catch(e){}hudBadge(def.btnId,n);}   // painted again on every refreshWallet
 return def;
}
function uiRender(id){
