<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Horse model review · Star Ranch Fable</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#d9dcd6;color:#20352c;font:14px/1.5 system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
    header{position:absolute;top:26px;left:30px;max-width:420px;pointer-events:none}a{color:inherit;pointer-events:auto}header a{font-size:12px;text-decoration:none}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:23px}h1{font:38px/1.15 Georgia,serif;font-weight:400;margin:6px 0 10px}header p{margin:0;color:#526156;max-width:360px}
    .models{position:absolute;right:26px;top:26px;display:flex;gap:5px;flex-wrap:wrap;max-width:510px;justify-content:end}.controls{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
    button,select{font:inherit;color:inherit;border:1px solid #2b403328;background:#f3f3ecef;border-radius:8px;padding:9px 13px;cursor:pointer;box-shadow:0 3px 12px #223d2d08}button:hover{background:#e2e9dc}button[aria-pressed=true]{background:#294635;color:#f5f5eb;border-color:#294635}button:focus-visible,select:focus-visible{outline:2px solid #987139;outline-offset:3px}
    #status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 20px;border-radius:10px;background:#f5f5ee}#status:empty{display:none}footer{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#526156}.hint{white-space:nowrap}
    @media(max-width:800px){header{top:17px;left:18px}h1{font-size:29px}.eyebrow{margin-top:16px}header p{font-size:12px;max-width:290px}.models{top:174px;left:18px;right:18px;justify-content:start;max-width:none}.models button{font-size:12px;padding:7px 10px}.controls{bottom:66px;gap:4px}button,select{font-size:12px;padding:8px 10px}.hint{display:none}footer{font-size:10px;bottom:14px;max-width:390px}}
  </style>
  <script type="importmap">{"imports":{"three":"./assets/vendor/three/build/three.module.js","three/addons/":"./assets/vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <header><a href="breeds.html?horse=artist-study">← Breed Studio</a><div class="eyebrow">Replacement study</div><h1 id="name">Horse model review</h1><p id="description">Inspect the actual 3D models under the same lighting.</p></header>
  <nav class="models" aria-label="Horse model"><button data-model="b2przemo" aria-pressed="true">New bay study</button><button data-model="lyndon" aria-pressed="false">Alternate base</button><button data-model="existing" aria-pressed="false">Current sporthorse</button></nav>
  <div id="status" role="status">Loading horse…</div>
  <nav class="controls" aria-label="Model inspection"><button data-view="quarter" aria-pressed="true">Three-quarter</button><button data-view="side" aria-pressed="false">Side</button><button data-view="opposite" aria-pressed="false">Other side</button><button data-view="front" aria-pressed="false">Front</button><button data-view="head" aria-pressed="false">Face</button><select id="surface" aria-label="Surface"><option value="coat">Coat</option><option value="clay">Neutral clay</option><option value="wire">Topology</option></select><select id="movement" aria-label="Movement" hidden></select><select id="speed" aria-label="Playback speed" hidden><option value="1">Normal speed</option><option value="0.5">Half speed</option><option value="0.25">Quarter speed</option></select><button id="pause" aria-pressed="false" hidden>Pause</button><button id="turn" aria-pressed="false">Rotate</button></nav>
  <footer><span id="credit">Loading source details…</span><span class="hint">Drag to orbit · Scroll to zoom · F for fullscreen</span></footer>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {createHeroHorseGroom} from './assets/hero-horse-groom.js?v=hero-motion-4';
    import {finishHeroCoat} from './assets/hero-horse-coat.js?v=hero-review-3';
    class OrbitControls extends THREE.EventDispatcher {
      constructor(camera,element){super();this.target=new THREE.Vector3();this.minDistance=.35;this.maxDistance=14;this.maxPolarAngle=Math.PI*.495;this.camera=camera;const pointers=new Map();
        element.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});element.setPointerCapture(e.pointerId);this.dispatchEvent({type:'start'});});
        element.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;const offset=camera.position.clone().sub(this.target),spherical=new THREE.Spherical().setFromVector3(offset);if(pointers.size===1){spherical.theta-=(e.clientX-old.x)*.007;spherical.phi=THREE.MathUtils.clamp(spherical.phi+(e.clientY-old.y)*.005,.12,this.maxPolarAngle);}else{const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)?.[1];if(other){const before=Math.hypot(old.x-other.x,old.y-other.y),after=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(after>1)spherical.radius=THREE.MathUtils.clamp(spherical.radius*before/after,this.minDistance,this.maxDistance);}}camera.position.copy(this.target).add(new THREE.Vector3().setFromSpherical(spherical));pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});this.update();});
        for(const type of ['pointerup','pointercancel','lostpointercapture'])element.addEventListener(type,e=>pointers.delete(e.pointerId));
        element.addEventListener('wheel',e=>{e.preventDefault();const offset=camera.position.clone().sub(this.target),distance=THREE.MathUtils.clamp(offset.length()*Math.exp(Math.max(-150,Math.min(150,e.deltaY))*.0015),this.minDistance,this.maxDistance);camera.position.copy(this.target).add(offset.setLength(distance));this.update();},{passive:false});
      }
      update(){this.camera.lookAt(this.target);}
    }
    const $=id=>document.getElementById(id);
    const specs={
      b2przemo:{url:'./assets/models/horse-candidates/b2przemo/rig-study/horse-rig-study.glb',name:'Bay horse study',description:'A new horse study with a clean neck, defined face, fitted eyes and strand mane and tail.',credit:'Horse by b2przemo · Adapted coat, eyes and grooming.',source:'https://blendswap.com/blend/13903',license:'https://creativecommons.org/licenses/by/3.0/',licenseName:'CC BY 3.0',head:[.0000073,1.915271,1.063753]},
      lyndon:{url:'./assets/models/horse-candidates/lyndon-daniels/horse-review.glb',name:'Realtime horse base',description:'A second artist-made candidate with its original coat, eyes and mane. Standing model study.',credit:'Horse by Lyndon Daniels · CC0 · Materials adapted for this review.',source:'https://opengameart.org/content/realtime-ranchers-3d-model-pack'},
      existing:{url:'./assets/models/hero-horse/hero-animated.glb',name:'Current sporthorse',description:'The existing game horse, shown at the same scale and under the same lighting.',credit:'Existing generated horse and local finishing · Preserved for comparison.'}
    };
    const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);renderer.domElement.setAttribute('aria-label','Interactive 3D horse review');
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
    const scene=new THREE.Scene();scene.background=new THREE.Color('#d9dcd6');scene.fog=new THREE.Fog('#d9dcd6',16,40);
    const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,.02,70);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.minDistance=.35;controls.maxDistance=14;controls.maxPolarAngle=Math.PI*.495;controls.target.set(0,1,0);
    scene.add(new THREE.HemisphereLight(0xf0f5ff,0x8a8473,1.6));
    const sun=new THREE.DirectionalLight(0xfff3e5,2.6);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.5,far:20});sun.shadow.normalBias=.015;sun.shadow.bias=-.0001;scene.add(sun);
    const fill=new THREE.DirectionalLight(0xe3edff,.9);fill.position.set(4,3,-3);scene.add(fill);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0xb7bcb0,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.006;floor.receiveShadow=true;scene.add(floor);
    const pmrem=new THREE.PMREMGenerator(renderer),envScene=new THREE.Scene();envScene.background=new THREE.Color(.65,.68,.7);const panel=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({color:0xffffff}));panel.position.set(-4,5,3);panel.lookAt(0,0,0);envScene.add(panel);const environment=pmrem.fromScene(envScene,.12);scene.environment=environment.texture;pmrem.dispose();panel.geometry.dispose();panel.material.dispose();
    const clay=new THREE.MeshStandardMaterial({color:0xa8a293,roughness:.75}),wire=new THREE.MeshBasicMaterial({color:0x31453c,wireframe:true});
    let model=null,groom=null,selected='b2przemo',loading=true,requestId=0,view='quarter',turn=false,manual=false,height=2.2,bounds=new THREE.Box3(),head=new THREE.Vector3(0,1.8,1),error=null;
    let mixer=null,clips=[],action=null,paused=false;
    const materialCache=new Map();
    function surface(){const mode=$('surface').value;model?.traverse(o=>{if(!o.isMesh)return;o.material=mode==='clay'?clay:mode==='wire'?wire:materialCache.get(o);if(o.userData.reviewHair)o.visible=mode==='coat';});renderer.render(scene,camera);}
    function frame(kind=view){view=kind;turn=false;$('turn').setAttribute('aria-pressed','false');const portrait=Math.max(1,1.1/camera.aspect);const target=kind==='head'?head.clone():bounds.getCenter(new THREE.Vector3());if(kind!=='head')target.y=height*.49;const distance=height*(kind==='head'?.86:2.5)*portrait;const theta=kind==='front'?0:kind==='side'?-Math.PI/2:kind==='opposite'?Math.PI/2:-.82;camera.position.copy(target).add(new THREE.Vector3().setFromSphericalCoords(distance,kind==='head'?1.44:1.47,theta));controls.target.copy(target);controls.update();for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===kind));renderer.render(scene,camera);}
    function release(next,g){g?.dispose?.();const geometries=new Set(),materials=new Set(),textures=new Set();next?.traverse(o=>{if(!o.isMesh)return;geometries.add(o.geometry);for(const mat of Array.isArray(o.material)?o.material:[o.material])if(mat!==clay&&mat!==wire)materials.add(mat);const saved=materialCache.get(o);for(const mat of Array.isArray(saved)?saved:[saved])if(mat)materials.add(mat);o.skeleton?.dispose?.();});for(const mat of materials){for(const val of Object.values(mat))if(val?.isTexture)textures.add(val);mat.dispose();}for(const tex of textures)tex.dispose();for(const geo of geometries)geo.dispose();}
    async function select(key){const ticket=++requestId;loading=true;error=null;$('status').textContent='Loading horse…';try{
      const spec=specs[key],loaded=await new GLTFLoader().loadAsync(spec.url+'?review=artist-base-1');if(ticket!==requestId){release(loaded.scene);return;}let next=loaded.scene,nextGroom=null;
      if(key==='existing'){const manifest=await fetch('./assets/models/hero-horse/manifest.json').then(r=>r.json());finishHeroCoat({THREE,scene:next});let skin=null;next.traverse(o=>{if(o.isSkinnedMesh&&(!skin||o.geometry.attributes.position.count>skin.geometry.attributes.position.count))skin=o;});nextGroom=await createHeroHorseGroom({THREE,skin,mount:next,surfaceMesh:skin,profile:manifest,anchors:manifest.anchors,maneColor:manifest.maneColor||'#221b16',tailColor:manifest.tailColor||'#221b16'});for(const mesh of nextGroom.meshes||[])mesh.userData.reviewHair=true;next.rotation.y=-Math.PI/2;}
      if(ticket!==requestId){release(next,nextGroom);return;}next.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(next),size=box.getSize(new THREE.Vector3());next.scale.multiplyScalar(2.2/size.y);next.updateMatrixWorld(true);box.setFromObject(next);const center=box.getCenter(new THREE.Vector3());next.position.add(new THREE.Vector3(-center.x,-box.min.y,-center.z));next.updateMatrixWorld(true);
      if(model){mixer?.stopAllAction();mixer?.uncacheRoot(model);scene.remove(model);release(model,groom);}materialCache.clear();model=next;groom=nextGroom;scene.add(model);model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;materialCache.set(o,o.material);for(let parent=o;parent&&parent!==model.parent;parent=parent.parent)if(/hair|mane|forelock|strand|tail/i.test(parent.name))o.userData.reviewHair=true;});bounds.setFromObject(model);height=bounds.max.y;head.set(0,height*.81,bounds.max.z-bounds.getSize(new THREE.Vector3()).z*.10);
      clips=(loaded.animations||[]).filter(c=>key!=='b2przemo'||['Rest','Idle','Walk_InPlace'].includes(c.name));mixer=clips.length?new THREE.AnimationMixer(model):null;action=null;paused=false;$('movement').replaceChildren(new Option('Standing pose',''));for(const clip of clips)if(clip.name!=='Rest')$('movement').add(new Option(clip.name==='Walk_InPlace'?'Slow walk':clip.name.replaceAll('_',' '),clip.name));for(const id of ['movement','speed','pause'])$(id).hidden=!clips.length;$('pause').textContent='Pause';$('pause').setAttribute('aria-pressed','false');$('speed').value='1';
      if(spec.head)head.fromArray(spec.head);selected=key;$('name').textContent=spec.name;$('description').textContent=spec.description;$('credit').textContent=spec.credit;if(spec.source){const a=document.createElement('a');a.href=spec.source;a.target='_blank';a.rel='noopener';a.textContent=' Source';$('credit').append(a);}if(spec.license){const a=document.createElement('a');a.href=spec.license;a.target='_blank';a.rel='noopener';a.textContent=' · '+spec.licenseName;$('credit').append(a);}for(const b of document.querySelectorAll('[data-model]'))b.setAttribute('aria-pressed',String(b.dataset.model===key));surface();frame();loading=false;$('status').textContent='';
    }catch(e){if(ticket!==requestId)return;loading=false;error=e.message;$('status').textContent='Could not load this model. Select another model or reload.';console.error(e);}}
    for(const b of document.querySelectorAll('[data-model]'))b.onclick=()=>select(b.dataset.model);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>frame(b.dataset.view);$('surface').onchange=surface;$('turn').onclick=()=>{turn=!turn;$('turn').setAttribute('aria-pressed',String(turn));};
    $('movement').onchange=()=>{mixer?.stopAllAction();const clip=clips.find(c=>c.name===$('movement').value);action=clip?mixer.clipAction(clip).reset().play():null;mixer?.update(0);renderer.render(scene,camera);};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';$('pause').setAttribute('aria-pressed',String(paused));};
    controls.addEventListener('start',()=>{turn=false;$('turn').setAttribute('aria-pressed','false');});
    addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(model)frame();});
    function update(dt){if(!paused)mixer?.update(dt*Number($('speed').value));if(turn){const offset=camera.position.clone().sub(controls.target).applyAxisAngle(new THREE.Vector3(0,1,0),dt*.3);camera.position.copy(controls.target).add(offset);controls.update();}renderer.render(scene,camera);}
    let last=performance.now();renderer.setAnimationLoop(now=>{if(!manual)update(Math.min(.1,(now-last)/1000));last=now;});
    window.advanceTime=ms=>{manual=true;update(ms/1000);};window.render_game_to_text=()=>JSON.stringify({mode:'horse model review',selected,view,surface:$('surface').value,turntable:turn,loading,modelReady:!!model,error,animations:clips.map(c=>c.name),movement:action?.getClip().name||'standing pose',animationTime:action?.time||0,paused,graphics:{horseReady:!!model,horseLoading:loading},bounds:model?[bounds.min.toArray(),bounds.max.toArray()]:null,coordinates:'Y up, +Z forward, meters',camera:camera.position.toArray(),target:controls.target.toArray(),triangles:renderer.info.render.triangles});
    window.horseReview={select,frame,scene,camera,renderer};const initial=new URLSearchParams(location.search);select(specs[initial.get('model')]?initial.get('model'):'b2przemo');
  </script>
</body>
